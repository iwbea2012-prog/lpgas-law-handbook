った場合に当該燃焼器へのガスの供給を自動的に遮断し燃焼を停止する機能を有するものである場合"},{"d":2,"t":"ハ　屋外式のものである場合（当該燃焼器の排気筒が、屋内に設置する部分を有する場合を除く。）"},{"d":2,"t":"供給設備の種類｜点検を行う事項","tb":1},{"d":2,"t":"（１）　供給設備（特定供給設備及びバルク供給に係るものを除く。）｜第十八条第二号イ及びハからトまで、第三号イ、ホ及びヘ並びに第十四号に掲げる基準に関する事項","tb":1},{"d":2,"t":"（２）　供給設備（特定供給設備を除き、バルク供給に係るものに限る。）｜第十九条第一号チ、リ及びワ、第二号イ、ハ及びホ（第十九条第一号チ、リ及びワに係る部分に限る。）並びに第三号ロ、ハ（９）及び（１０）、ニ（２）並びにホ（２）及び（６）並びに第七号（第十八条第十四号に限る。）に掲げる基準に関する事項","tb":1},{"d":2,"t":"（３）　特定供給設備（バルク供給に係るものを除く。）｜第五十三条第一号イ、ロ及びニからチまで並びに第二号イ、ロ、ト及びチに掲げる基準に関する事項","tb":1},{"d":2,"t":"（４）　特定供給設備（バルク供給に係るものに限る。）｜第五十四条第一号（第十九条第二号ハ及びホ（第十九条第一号チ、リ及びワに限る。）並びに第五十三条第一号イ及びロに限る。）並びに第二号ロ（１）から（３）まで、ホ（第十九条第三号ハ（９）及び（１０）に限る。）、ヘ（第十九条第三号ニ（２）に限る。）及びト（第十九条第三号ホ（２）及び（６）に限る。）に掲げる基準に関する事項","tb":1},{"d":1,"t":"四　第三十七条の消費設備の調査のうち第四十四条第一号ロ、ヘ及びトに掲げる基準に関する事項については、第三十七条第一号の規定にかかわらず、供給開始時及び十年に一回以上の回数で調査を行うことができる。ただし、第一号認定を受けた際現に液化石油ガスの供給を受けている者における第一号認定後の第一回の調査は、前回の調査から十年までの間に行うものとする。"},{"d":1,"t":"五　認定対象消費者が設置する燃焼器の全てについて第三号のイからハまでのいずれかに該当する場合は、第三十七条の消費設備の調査のうち、第四十四条第一号イ（配管及びガス栓に係る部分に限る。）、ヌ、ヲ（地下室に係る部分を除く。）、ワ、カ及びヨ並びにタ（１）（ｉ）から（ｉｖ）まで及び（２）（ｉ）（（１）（ｉ）及び（ｉｖ）に係る部分に限る。）並びにツ（不完全燃焼する状態に至った場合に当該燃焼器へのガスの供給を自動的に遮断し燃焼を停止する機能を有するものを除く。）並びにネ（２）及び（３）並びにムに掲げる基準に関する事項については、第三十七条第一号の規定にかかわらず、供給開始時及び五年に一回以上の回数で調査を行うことができる。ただし、第一号認定を受けた際現に液化石油ガスの供給を受けている者における第一号認定後の第一回の調査は、前回の調査から五年までの間に行うものとする。"},{"d":1,"t":"六　前四号の規定にかかわらず、災害その他やむを得ない事由によりこれらの号に規定する回数で保安業務を行うことが困難であるときは、経済産業大臣が当該事由を勘案して定める期間に一回以上保安業務を行うことができる。"}],"del":false},{"id":"規則-50_2","law":"規則","num":"50_2","title":"第五十条の二","cap":"（第二号認定液化石油ガス販売事業者に係る保安業務の方法等の特例）","capInh":false,"path":"第四章　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"第二号認定液化石油ガス販売事業者が販売契約を締結している認定対象消費者についての保安業務を行う保安機関に係る法第三十五条の九の経済産業省令で定める基準は、前条第一号に掲げるものとする。","p":1}],"del":false},{"id":"規則-51","law":"規則","num":"51","title":"第五十一条","cap":"（貯蔵施設等の許可申請）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十六条第一項の規定により貯蔵施設又は特定供給設備の設置の許可の申請をしようとする者は、様式第二十八による申請書を貯蔵施設又は特定供給設備の所在地を管轄する都道府県知事に提出しなければならない。","p":1},{"d":0,"t":"２　前項の申請書には、貯蔵施設又は特定供給設備の位置（他の施設との関係位置を含む。）及び構造並びに付近の状況を示す図面を添付しなければならない。","p":1}],"del":false},{"id":"規則-52","law":"規則","num":"52","title":"第五十二条","cap":"（貯蔵施設の技術上の基準）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の経済産業省令で定める貯蔵施設の技術上の基準は、第十四条各号に掲げる基準とする。","p":1}],"del":false},{"id":"規則-53","law":"規則","num":"53","title":"第五十三条","cap":"（特定供給設備の技術上の基準）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の経済産業省令で定める特定供給設備（バルク供給に係るものを除く。）の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　貯蔵設備（貯槽であるものを除く。以下この号において同じ。）は、次に定める基準に適合すること。"},{"d":2,"t":"イ　貯蔵設備（次の表に掲げるものを除く。）は、その外面から、第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離を有すること。"},{"d":3,"t":"貯蔵設備の区分｜貯蔵設備の外面から最も近い第一種保安物件までの距離｜貯蔵設備の外面から最も近い第二種保安物件までの距離","tb":1},{"d":3,"t":"（イ）　貯蔵能力が一万キログラム未満の貯蔵設備｜十三・五八メートル以上｜九・〇五メートル以上十一・三一メートル未満","tb":1},{"d":3,"t":"（ロ）　同右｜十三・五八メートル以上十六・九七メートル未満｜九・〇五メートル以上","tb":1},{"d":2,"t":"ロ　イの表に掲げる貯蔵設備（イ）及び（ロ）には、十六・九七メートル以内にある第一種保安物件又は十一・三一メートル以内にある第二種保安物件に対し鉄筋コンクリート障壁等を設けること。"},{"d":2,"t":"ハ　貯蔵設備は、その外面から火気（当該貯蔵設備に附属する気化装置内のものを除く。以下ハにおいて同じ。）を取り扱う施設に対し八メートル以上の距離を有し、又は当該貯蔵設備と火気を取り扱う施設との間に当該貯蔵設備から漏えいした液化石油ガスが当該火気を取り扱う施設に流動することを防止するための措置を講ずること。"},{"d":2,"t":"ニ　貯蔵設備には、液化石油ガスが漏えいしたとき滞留しないような措置を講ずること。"},{"d":2,"t":"ホ　貯蔵設備（販売所内に設置されているものを除く。）には、さく、へい等を設けること。"},{"d":2,"t":"ヘ　貯蔵設備には、その外部から見やすいように警戒標を掲げてあること。"},{"d":2,"t":"ト　貯蔵設備には、消火設備を設けること。"},{"d":2,"t":"チ　貯蔵設備には、不燃性又は難燃性の材料を使用した軽量な屋根又は遮へい板を設けること。"},{"d":2,"t":"リ　充てん容器等には、転落、転倒等による衝撃及びバルブ等の損傷を防止する措置を講ずること。"},{"d":2,"t":"ヌ　充てん容器等（当該容器に取り付けたスカートを含む。）には、湿気、水滴等による腐しょくを防止する措置を講ずること。"},{"d":1,"t":"二　貯槽は、次に定める基準に適合すること。"},{"d":2,"t":"イ　貯槽（次の表に掲げるものを除く。）は、その外面から、第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離を有すること。"},{"d":3,"t":"貯槽の区分｜貯槽の外面から最も近い第一種保安物件までの距離｜貯槽の外面から最も近い第二種保安物件までの距離","tb":1},{"d":3,"t":"（イ）　貯蔵能力が三千キログラム未満の貯槽｜十六・九七メートル未満｜十一・三一メートル未満","tb":1},{"d":3,"t":"（ロ）　同右｜十六・九七メートル未満｜十一・三一メートル以上","tb":1},{"d":3,"t":"（ハ）　同右｜十六・九七メートル以上｜十一・三一メートル未満","tb":1},{"d":3,"t":"（ニ）　貯蔵能力が三千キログラム以上一万キログラム未満の貯槽｜十三・五八メートル以上｜九・〇五メートル以上十一・三一メートル未満","tb":1},{"d":3,"t":"（ホ）　同右｜十三・五八メートル以上十六・九七メートル未満｜九・〇五メートル以上","tb":1},{"d":2,"t":"ロ　イの表に掲げる貯槽（イ）、（ロ）、（ハ）、（ニ）及び（ホ）には、十六・九七メートル以内にある第一種保安物件若しくは十一・三一メートル以内にある第二種保安物件に対し鉄筋コンクリート障壁等を設け、又は当該貯槽を地盤面下に埋設すること。"},{"d":2,"t":"ハ　第一種保安物件又は第二種保安物件が密集し、特に公共の安全を維持する必要がある地域であって、経済産業大臣が指定する地域においては、貯槽を地盤面下に埋設すること。"},{"d":2,"t":"ニ　地盤面下に埋設する貯槽は、次に定める基準に適合するものであること。"},{"d":3,"t":"（１）　貯槽は、貯槽室に設置し、かつ、次の（イ）、（ロ）又は（ハ）に掲げる措置を講ずること。ただし、腐しょくを防止する措置を講じた貯槽を地盤に固定し、かつ、地盤面上の重量物の荷重に耐えることができる措置を講じた場合には、当該貯槽を貯槽室に設置しないことができる。"},{"d":4,"t":"（イ）　貯槽の周囲に乾燥砂を詰めること。"},{"d":4,"t":"（ロ）　貯槽を水没させること。"},{"d":4,"t":"（ハ）　貯槽室内を強制換気すること。"},{"d":3,"t":"（２）　貯槽の頂部は、三十センチメートル以上地盤面から下にあること。"},{"d":3,"t":"（３）　貯槽を二以上隣接して設置する場合には、その相互間に一メートル以上の間隔を保つこと。"},{"d":2,"t":"ホ　貯槽は、その外面から火気（当該貯槽に附属する気化装置内のものを除く。以下ホにおいて同じ。）を取り扱う施設に対し、貯蔵能力が三千キログラム未満のものにあっては五メートル以上、三千キログラム以上のものにあっては八メートル以上の距離を有し、又は当該貯槽と火気を取り扱う施設との間に当該貯槽から漏えいした液化石油ガスが当該火気を取り扱う施設に流動することを防止するための施設を設けること。"},{"d":2,"t":"ヘ　貯槽（貯蔵能力が三千キログラム以上のものに限る。以下ヘにおいて同じ。）は、その外面から他の貯槽又はバルク貯槽若しくは酸素の貯蔵設備（地盤面に対して移動することができず、かつ、貯蔵能力が圧縮ガスにあっては三百立方メートル、液化ガスにあっては三千キログラム以上のものに限る。）に対し一メートル又は当該貯槽及び他の貯槽又はバルク貯槽若しくは当該酸素の貯蔵設備の最大直径の和の四分の一の長さのいずれか大なるものに等しい距離以上の距離を有すること。ただし、当該貯槽に水噴霧装置を設けた場合は、この限りでない。"},{"d":2,"t":"ト　貯槽（販売所内に設置されているもの又は地盤面下に埋設されているものを除く。）には、さく、へい等を設けること。"},{"d":2,"t":"チ　貯槽には、その外部から見やすいように液化石油ガスの貯槽である旨を朱書すること。"},{"d":2,"t":"リ　貯槽の材料は、その使用条件等に照らし適切なものであること。この場合において、告示で定める材料は、使用しないこと。"},{"d":2,"t":"ヌ　貯槽には、使用上支障のある腐しょく、割れ等の欠陥がないものであること。"},{"d":2,"t":"ル　貯槽には、腐しょくを防止する措置を講ずること。"},{"d":2,"t":"ヲ　貯槽の基礎は、不同沈下等により当該貯槽に有害なひずみが生じないようなものであること。この場合において、貯槽の支柱（支柱のない貯槽にあっては、その底部）は、同一の基礎に緊結すること。"},{"d":2,"t":"ワ　貯槽は、常用の圧力の一・五倍以上（第二種特定設備にあっては、常用の圧力の一・三倍以上）の圧力で水その他の安全な液体を使用して行う耐圧試験（その構造により液体を使用することが困難であると認められるときは、常用の圧力の一・二五倍以上（第二種特定設備にあっては、常用の圧力の一・一倍以上）の圧力で空気、窒素等の気体を使用して行う耐圧試験）及び常用の圧力以上の圧力で行う気密試験に合格するものであること。"},{"d":2,"t":"カ　貯槽は、常用の圧力の二倍以上の圧力で降伏を起こさないような肉厚を有するものであること。"},{"d":2,"t":"ヨ　貯槽には、告示で定めるところにより、圧力計を設け、かつ、当該貯槽内の圧力が許容圧力を超えた場合に、直ちにその圧力を許容圧力以下に戻すことができる安全弁を設けること。"},{"d":2,"t":"タ　ヨの規定により設けた安全弁には、放出管を設けること。この場合において、放出管の開口部の位置は、周囲に着火源等のない安全な位置であって、地盤面から五メートルの高さ又は貯槽の頂部から二メートルの高さのいずれか高い位置以上の高さであること。"},{"d":2,"t":"レ　貯槽には、液面計（丸形ガラス管液面計を除く。）を設けること。この場合において、ガラス管液面計を使用するときは、当該ガラス管液面計には、その破損を防止するための措置を講じ、貯槽とガラス管液面計とを接続する管には、自動式及び手動式の止め弁を設けること。"},{"d":2,"t":"ソ　貯槽に取り付けられた受入管（液化石油ガスを受け入れるための管をいい、当該管と貯槽との接続部を含む。以下ツ及びウにおいて同じ。）及び供給管（当該管と貯槽との接続部を含む。以下ツ及びウにおいて同じ。）には、ツの規定により設ける緊急遮断装置に係るバルブのほか、二以上のバルブを設け、当該二以上のバルブの一は、当該貯槽の直近に設けること。この場合において、当該貯槽の直近に設けたバルブは、液化石油ガスを送り出し又は受け入れるとき以外のときは、閉止しておくこと。"},{"d":2,"t":"ツ　受入管及び供給管（内容積が五千リットル以上の貯槽に取り付けられたものに限る。）には、当該貯槽の外面から五メートル以上離れた位置において操作することができる緊急遮断装置を設けること。ただし、受入管にあっては、逆止弁をもって代えることができる。"},{"d":2,"t":"ネ　地盤面上に設置する貯槽及びその支柱は、不燃性の断熱材で被覆すること等により耐熱性の構造とし、又は当該貯槽及びその支柱にその外面から五メートル以上離れた位置において操作することができる冷却用散水装置その他の有効な冷却装置を設けること。"},{"d":2,"t":"ナ　貯槽（販売所内に設置されているものに限る。）から漏えいする液化石油ガスが滞留するおそれのある場所には、当該液化石油ガスの漏えいを検知し、かつ、警報するための設備を設けること。"},{"d":2,"t":"ラ　貯槽には、当該貯槽に生ずる静電気を除去する措置を講ずること。"},{"d":2,"t":"ム　貯槽には、その貯蔵能力が三千キログラム未満のものにあっては消火設備を、三千キログラム以上のものにあっては防消火設備を設けること。"},{"d":2,"t":"ウ　受入管及び供給管に設けたバルブ（操作ボタン等により当該バルブを開閉する場合にあっては、当該操作ボタン等。以下ウにおいて同じ。）には、次の（１）及び（２）に掲げる基準により、作業員が当該バルブを適切に操作することができるような措置を講ずること。"},{"d":3,"t":"（１）　バルブには、当該バルブの開閉方向（操作することにより当該バルブに係る貯槽に保安上重大な影響を与えるバルブにあっては、当該バルブの開閉状態を含む。）を明示すること。"},{"d":3,"t":"（２）　バルブ（操作ボタン等により開閉するものを除く。）に係る受入管及び供給管には、当該バルブに近接する部分に、容易に識別することができる方法により、当該管内の液化石油ガスの流れの方向を表示すること。"},{"d":2,"t":"ヰ　貯槽（貯蔵能力が三千キログラム以上のものに限る。以下この号において同じ。）、受入管及び供給管（液状の液化石油ガス（法第二条第一項に規定する液化石油ガスをいう。次条第二号チ（６）において同じ。）が通る地盤面上の配管（外径四十五ミリメートル以上のものに限る。次条第二号チ（６）において同じ。）であって、貯槽から地震防災遮断弁（地震時及び地震後の地震災害の発生並びに拡大を防止するための遮断機能を有する弁をいう。次条第二号チ（６）において同じ。）までの間のものをいう。）並びにこれらの支持構造物及び基礎は、経済産業大臣が定める耐震に関する性能を有すること。"},{"d":1,"t":"三　貯蔵設備が容器である場合は、一般消費者等への液化石油ガスの供給を中断することなく充てん容器等の交換を行うことができる設備を設けること。"},{"d":1,"t":"四　第十八条第四号から第八号の二まで、第十号及び第十九号から第二十一号までの基準に適合すること。"}],"del":false},{"id":"規則-54","law":"規則","num":"54","title":"第五十四条","cap":"（バルク供給に係る特定供給設備の技術上の基準）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の経済産業省令で定める特定供給設備（バルク供給に係るものに限る。）の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　バルク容器は、第十九条第二号ハからホまで及び第四号から第六号まで並びに前条第一号イからハまでに掲げる基準に適合すること。"},{"d":1,"t":"二　バルク貯槽は、次に掲げる基準に適合すること。"},{"d":2,"t":"イ　第十九条第三号イの基準に適合するものであること。"},{"d":2,"t":"ロ　次の基準に適合するものであること。"},{"d":3,"t":"（１）　貯蔵能力が千キログラム以上三千キログラム未満のバルク貯槽は、次に定める基準に適合するものであること。"},{"d":4,"t":"（ｉ）　バルク貯槽の外面から第一種保安物件又は第二種保安物件に対し七メートル以上の距離を有すること。ただし、次のいずれかに該当する場合は、この限りでない。"},{"d":5,"t":"（イ）　告示で定めるところにより、第一種保安物件又は第二種保安物件に対し、加熱試験に合格する構造壁又はこれと同等以上の性能を有する壁を設けた場合"},{"d":5,"t":"（ロ）　第一種保安物件又は第二種保安物件に対し、鉄筋コンクリート障壁等を設けた場合"},{"d":5,"t":"（ハ）　バルク貯槽を地盤面下に埋設した場合"},{"d":4,"t":"（ｉｉ）　第一種保安物件又は第二種保安物件に対し、鉄筋コンクリート障壁等が設けられ、当該鉄筋コンクリート障壁等が設けられていない方向に他の第一種保安物件又は第二種保安物件が存在する場合にあっては、当該他の第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離をそれぞれ有し、又は当該他の第一種保安物件若しくは第二種保安物件に対し、鉄筋コンクリート障壁等を設けること。"},{"d":3,"t":"（２）　貯蔵能力が三千キログラム以上のバルク貯槽（次の表に掲げるバルク貯槽であって、貯蔵能力が一万キログラム未満のものを除く。）は、その外面から、第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離を有すること。"},{"d":4,"t":"バルク貯槽の外面から最も近い第一種保安物件までの距離｜バルク貯槽の外面から最も近い第二種保安物件までの距離","tb":1},{"d":4,"t":"イ　十三・五八メートル以上｜九・〇五メートル以上十一・三一メートル未満","tb":1},{"d":4,"t":"ロ　十三・五八メートル以上十六・九七メートル未満｜九・〇五メートル以上","tb":1},{"d":3,"t":"（３）　ロ（２）の表に掲げるバルク貯槽イ及びロには、十六・九七メートル以内にある第一種保安物件若しくは十一・三一メートル以内にある第二種保安物件に対し鉄筋コンクリート障壁等を設け、又は当該バルク貯槽を地盤面下に埋設すること。"},{"d":3,"t":"（４）　第一種保安物件又は第二種保安物件が密集し、特に公共の安全を維持する必要がある地域であって、経済産業大臣が指定する地域においては、バルク貯槽を地盤面下に埋設すること。"},{"d":2,"t":"ハ　バルク貯槽は、その外面から火気（当該バルク貯槽に附属する気化装置内のものを除く。）を取り扱う施設に対し、貯蔵能力が三千キログラム未満のものにあっては五メートル以上、三千キログラム以上のものにあっては八メートル以上の距離を有し、又は当該バルク貯槽と火気を取り扱う施設との間に当該バルク貯槽から漏えいした液化石油ガスが当該火気を取り扱う施設に流動することを防止するための措置を講ずること。"},{"d":2,"t":"ニ　バルク貯槽には、その貯蔵能力が三千キログラム未満のものにあっては消火設備を、三千キログラム以上のものにあっては防消火設備を設けること。"},{"d":2,"t":"ホ　第十九条第三号ハ及び第四号から第六号までに掲げる基準に適合すること。"},{"d":2,"t":"ヘ　地盤面上に設置するバルク貯槽は、第十九条第三号ニ（１）（貯蔵能力が三千キログラム未満のものに限る。）、（２）、（３）（貯蔵能力が三千キログラム未満のものに限る。）、（４）（貯蔵能力が三千キログラム未満のものに限る。）及び（５）の基準に適合すること。"},{"d":2,"t":"ト　地盤面下に埋設するバルク貯槽（貯蔵能力が三千キログラム未満に限る。）は、第十九条第三号ホの基準に適合すること。"},{"d":2,"t":"チ　貯蔵能力が三千キログラム以上のバルク貯槽にあっては、次に定める基準に適合すること。"},{"d":3,"t":"（１）　地盤面下に埋設するバルク貯槽（附属機器を除く。）は、次に定める基準に適合するものであること。"},{"d":4,"t":"（ｉ）　バルク貯槽は、貯槽室に設置し、かつ、次の（イ）、（ロ）又は（ハ）に掲げる措置を講ずること。ただし、腐しょくを防止する措置を講じたバルク貯槽を地盤に固定し、かつ、地盤面上の重量物の荷重に耐えることができる措置を講じた場合には、当該バルク貯槽を貯槽室に設置しないことができる。"},{"d":5,"t":"（イ）　バルク貯槽（附属機器を除く。）の周囲に乾燥砂を詰めること。"},{"d":5,"t":"（ロ）　バルク貯槽（附属機器を除く。）を水没させること。"},{"d":5,"t":"（ハ）　貯槽室内を強制換気すること。"},{"d":4,"t":"（ｉｉ）　バルク貯槽（附属機器を除く。）の頂部は、三十センチメートル以上地盤面から下にあること。"},{"d":4,"t":"（ｉｉｉ）　バルク貯槽を二以上隣接して設置する場合には、その相互間に一メートル以上の間隔を保つこと。"},{"d":3,"t":"（２）　バルク貯槽（附属機器を除く。）は、その外面から他の貯槽、他のバルク貯槽又は酸素の貯蔵設備（地盤面に対して移動することができず、かつ、貯蔵能力が圧縮ガスにあっては三百立方メートル、液化ガスにあっては三千キログラム以上のものに限る。）に対し一メートル又は当該バルク貯槽及び当該他の貯槽、当該他のバルク貯槽又は当該酸素の貯蔵設備の最大直径の和の四分の一の長さのいずれか大なるものに等しい距離以上の距離を有すること。ただし、当該貯槽に水噴霧装置を設けた場合は、この限りでない。"},{"d":3,"t":"（３）　バルク貯槽の基礎は、不同沈下等により当該バルク貯槽に有害なひずみが生じないようなものであること。この場合において、バルク貯槽の支柱（支柱のないバルク貯槽にあっては、その底部）は、同一の基礎に緊結すること。"},{"d":3,"t":"（４）　地盤面上に設置するバルク貯槽及びその支柱は、不燃性の断熱材で被覆すること等により耐熱性の構造とし、又は当該バルク貯槽及びその支柱にその外面から五メートル以上離れた位置において操作することができる冷却用散水装置その他の有効な冷却装置を設けること。"},{"d":3,"t":"（５）　バルク貯槽には、当該バルク貯槽に生ずる静電気を除去する措置を講ずること。"},{"d":3,"t":"（６）　バルク貯槽、受入管及び供給管（液状の液化石油ガスが通る地盤面上の配管であって、バルク貯槽から地震防災遮断弁までの間のものをいう。）並びにこれらの支持構造物及び基礎は、経済産業大臣が定める耐震に関する性能を有すること。"},{"d":1,"t":"三　第十八条第四号から第七号まで、第八号の二、第十号及び第十九号から第二十一号までの基準に適合すること。"},{"d":1,"t":"四　供給管には、次に定める基準に適合する管を使用すること。"},{"d":2,"t":"イ　バルク容器又はバルク貯槽と調整器（二段式減圧用二次側のものを除く。）の間に設置される管にあっては、二・六メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":2,"t":"ロ　二段式減圧用一次側調整器と二次側調整器の間に設置される管にあっては、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するもの"}],"del":false},{"id":"規則-55","law":"規則","num":"55","title":"第五十五条","cap":"（危険のおそれのない場合の特則）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"前三条に規定する基準について、経済産業大臣が貯蔵施設又は特定供給設備の規模、周囲の状況等から判断して保安上支障がないと認めた場合においては、当該規定にかかわらず、経済産業大臣が認める基準をもって法第三十七条の技術上の基準とする。","p":1}],"del":false},{"id":"規則-56","law":"規則","num":"56","title":"第五十六条","cap":"（貯蔵施設等の変更の許可申請）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の二第一項の規定により貯蔵施設又は特定供給設備の変更の許可の申請をしようとする者は、様式第二十九による申請書を法第三十六条第一項の許可をした都道府県知事に提出しなければならない。","p":1},{"d":0,"t":"２　前項の申請書には、貯蔵施設又は特定供給設備の位置（他の施設との関係位置を含む。）、構造及び付近の状況を示す図面並びに当該貯蔵施設又は特定供給設備の所在地を管轄する消防長（消防本部を置かない市町村にあっては、市町村長。）又は消防署長の意見書を添付しなければならない。","p":1}],"del":false},{"id":"規則-57","law":"規則","num":"57","title":"第五十七条","cap":"（軽微な変更）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の二第一項ただし書の経済産業省令で定める軽微な変更は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　貯蔵施設又は特定供給設備の消火設備の変更"},{"d":1,"t":"二　貯蔵施設又は特定供給設備に係る換気孔の増設"},{"d":1,"t":"三　特定供給設備の廃止"}],"del":false},{"id":"規則-58","law":"規則","num":"58","title":"第五十八条","cap":"（貯蔵施設等の軽微な変更の届出）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の二第二項の規定により貯蔵施設等の軽微な変更の届出をしようとする者は、様式第三十による届書を法第三十六条第一項の許可をした都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-59","law":"規則","num":"59","title":"第五十九条","cap":"（貯蔵施設等の完成検査の申請等）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の三第一項本文の規定により貯蔵施設又は特定供給設備について都道府県知事が行う完成検査を受けようとする者は、様式第三十一による申請書を当該貯蔵施設又は特定供給設備の所在地を管轄する都道府県知事に提出しなければならない。","p":1},{"d":0,"t":"２　都道府県知事は、法第三十七条の三第一項本文の完成検査において、貯蔵施設又は特定供給設備が法第三十七条の経済産業省令で定める技術上の基準に適合していると認めるときは、様式第三十二による貯蔵施設等完成検査証を交付するものとする。","p":1}],"del":false},{"id":"規則-60","law":"規則","num":"60","title":"第六十条","cap":"（協会等が行う完成検査の申請等）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"前条の規定は、協会又は指定完成検査機関が行う完成検査について準用する。この場合において、同条中「法第三十七条の三第一項本文」とあるのは「法第三十七条の三第一項ただし書」と、同条第一項中「当該貯蔵施設又は特定供給設備の所在地を管轄する都道府県知事」とあるのは「協会又は指定完成検査機関」と読み替えるものとする。","p":1},{"d":0,"t":"２　法第三十七条の三第一項ただし書の規定により、協会又は指定完成検査機関が行う完成検査を受け、法第三十七条の技術上の基準に適合すると認められた旨を都道府県知事に届け出ようとする者は、様式第三十三による届書を完成検査を受けた貯蔵施設又は特定供給設備の所在地を管轄する都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-61","law":"規則","num":"61","title":"第六十一条","cap":"（協会等の完成検査の報告）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の三第二項の規定により、協会又は指定完成検査機関が報告をしようとするときは、様式第三十四による報告書に完成検査の記録を添付して完成検査をした貯蔵施設又は特定供給設備の所在地を管轄する都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-62","law":"規則","num":"62","title":"第六十二条","cap":"（貯蔵施設等の完成検査の方法）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"貯蔵施設について行う法第三十七条の三第三項の経済産業省令で定める完成検査の方法は、別表第一のとおりとする。","p":1},{"d":0,"t":"２　特定供給設備（バルク供給に係るものを除く。）について行う法第三十七条の三第三項の経済産業省令で定める完成検査の方法は、別表第二のとおりとする。","p":1},{"d":0,"t":"３　特定供給設備（バルク供給に係るものに限る。）について行う法第三十七条の三第三項の経済産業省令で定める完成検査の方法は、別表第三のとおりとする。","p":1}],"del":false},{"id":"規則-63","law":"規則","num":"63","title":"第六十三条","cap":"（充てん設備の許可申請）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第一項の経済産業省令で定める所在地は、充てん設備の使用の本拠の所在地とする。","p":1},{"d":0,"t":"２　法第三十七条の四第一項の規定により充てん設備の許可の申請をしようとする者は、様式第三十五による申請書に次の書類を添付して前項の所在地を管轄する都道府県知事に提出しなければならない。","p":1},{"d":1,"t":"一　充てん設備の構造並びに設備及び装置に関する事項を記載した書類"},{"d":1,"t":"二　充てん設備の使用の本拠の所在地の付近の状況を示す図面"}],"del":false},{"id":"規則-64","law":"規則","num":"64","title":"第六十四条","cap":"（充てん設備の技術上の基準）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第二項の経済産業省令で定める充てん設備の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　貯蔵設備は、容器であること。"},{"d":1,"t":"二　液化石油ガスの通る部分（容器及び高圧ガス保安法第四十九条の二第一項の附属品を除く。以下この条において同じ。）は、告示で定めるところにより行う耐圧試験に合格するものであること。"},{"d":1,"t":"三　液化石油ガスの通る部分は、告示で定めるところにより行う気密試験に合格するものであること。"},{"d":1,"t":"四　液化石油ガスの通る部分は、告示で定める肉厚を有するものであること。"},{"d":1,"t":"五　充てんのためのポンプ又は圧縮機の起動及び停止のスイッチは、遠隔操作ができるものであること。"},{"d":1,"t":"六　充てんのためのポンプ又は圧縮機を駆動させる発電機は、火花を発生しない構造であること。"},{"d":1,"t":"七　充てんホースは、日本産業規格Ｋ六三四七（一九九五）に規定される鋼線編組式ホースとすること。"},{"d":1,"t":"八　充てんホースには、告示で定めるところにより、安全継手を設けること。"},{"d":1,"t":"九　充てんホースには、告示で定めるところにより、カップリング用液流出防止装置を設けること。"},{"d":1,"t":"十　均圧ホースを取り付ける場合にあっては、当該均圧ホースは、日本産業規格Ｋ六三四七（一九九五）に規定される鋼線編組式ホースとし、かつ、告示で定めるところにより、安全継手及び脱着用のカップリングを設けること。"},{"d":1,"t":"十一　容器に取り付けられた配管（液化石油ガスを送り出し、又は受け入れるために用いられるものに限り、かつ、容器と配管との接続部を含む。）には、緊急遮断装置を設けること。ただし、容器に緊急遮断装置が設けられている場合は、この限りでない。"},{"d":1,"t":"十二　前号の規定により設けられた緊急遮断装置（容器に設けられた緊急遮断装置を含む。）は、液封による配管又は充てんホースの破損を防止する機能を有する構造であること。ただし、液封が生じるおそれのある配管又は充てんホースに逃がし弁等を設置した場合は、この限りでない。"},{"d":1,"t":"十三　容器には、告示で定めるところにより、液面計を設けること。"},{"d":1,"t":"十四　容器には、告示で定めるところにより、温度計を設けること。"},{"d":1,"t":"十五　告示で定めるところにより、圧力計を設けること。"},{"d":1,"t":"十六　告示で定めるところにより、誤発進防止装置を設けること。"},{"d":1,"t":"十七　告示で定めるところにより、緊急停止スイッチを設けること。"},{"d":1,"t":"十八　充てん作業中に、次に掲げる異常を検知した場合に、緊急遮断弁の閉止、車両のエンジンの停止、ポンプ又は圧縮機の停止及び発電機を使用しているものにあっては発電機の停止を同時に行う機能を有し、かつ、その場合に警報を発し又は表示する装置を設けること。"},{"d":2,"t":"イ　容器元弁及び緊急遮断装置に係るバルブその他主要な付属品が収納されている操作箱（以下この号において「操作箱」という。）内に設置された設備であって告示で定める機能を有するものによりガス漏れを検知した場合"},{"d":2,"t":"ロ　自動車の衝突等異常な衝撃を告示で定める機器により検知した場合"},{"d":2,"t":"ハ　充てん中に操作箱の扉が開いた場合"},{"d":1,"t":"十九　充てん設備の使用の本拠の所在地は、第十四条（第四号及び第六号を除く。）の基準に適合すること。この場合において、「貯蔵施設」とあるのは「充てん設備の使用の本拠の所在地」と読み替えるものとする。"},{"d":0,"t":"２　法第三十七条の四第一項の充てん設備が液化石油ガス保安規則（昭和四十一年通商産業省令第五十二号）第二条第九号に定める移動式製造設備である場合には、前項の規定にかかわらず、液化石油ガス保安規則第九条第一項の基準をもって法第三十七条の四第二項の基準とする。","p":1}],"del":false},{"id":"規則-65","law":"規則","num":"65","title":"第六十五条","cap":"（充てん設備の変更許可の申請）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第三項で準用する法第三十七条の二第一項の規定により充てん設備の変更の許可の申請をしようとする者は、様式第三十六による申請書を法第三十七条の四第一項の許可をした都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-66","law":"規則","num":"66","title":"第六十六条","cap":"（軽微な変更）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第三項で準用する法第三十七条の二第一項ただし書の経済産業省令で定める軽微な変更は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　液化石油ガスの通る部分の取替え（同型式のものに限る。）"},{"d":1,"t":"二　液化石油ガスが通る部分の充塡設備に係る設備の取替え（液化石油ガス保安規則第十六条第一項第一号の規定に基づき製造することが適切であると経済産業大臣が認める者が製造したものその他の保安上特段の支障がないものとして認められたものへの取替えに限る。）であって、当該設備の処理能力（同規則第二条第一項第十五号に定める処理能力をいう。）の変更を伴わないもの（前号に掲げるものを除く。）"},{"d":1,"t":"三　液化石油ガスの通る部分以外の充てん設備に係る設備の取替え"},{"d":1,"t":"四　充てん設備の廃止"}],"del":false},{"id":"規則-67","law":"規則","num":"67","title":"第六十七条","cap":"（充てん設備の軽微な変更の届出）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第三項で準用する法第三十七条の二第二項の規定により充てん設備の軽微な変更の届出をしようとする者は、様式第三十七による届書を法第三十七条の四第一項の許可をした都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-68","law":"規則","num":"68","title":"第六十八条","cap":"（充てん設備の完成検査の申請等）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第四項において準用する法第三十七条の三第一項本文の規定により充てん設備について都道府県知事が行う完成検査を受けようとする者は、様式第三十八による申請書を充てん設備の使用の本拠の所在地を管轄する都道府県知事に提出しなければならない。","p":1},{"d":0,"t":"２　都道府県知事は、法第三十七条の四第四項において準用する法第三十七条の三第一項本文の完成検査において、充てん設備が法第三十七条の四第二項の経済産業省令で定める技術上の基準に適合していると認めるときは、様式第三十九による充てん設備完成検査証を交付するものとする。","p":1}],"del":false},{"id":"規則-69","law":"規則","num":"69","title":"第六十九条","cap":"（協会等が行う完成検査の申請等）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"前条の規定は、協会又は指定完成検査機関が行う完成検査について準用する。この場合において、同条中「法第三十七条の三第一項本文」とあるのは「法第三十七条の三第一項ただし書」と、「充てん設備の使用の本拠の所在地を管轄する都道府県知事」とあるのは「協会又は指定完成検査機関」と読み替えるものとする。","p":1},{"d":0,"t":"２　法第三十七条の四第四項において準用する法第三十七条の三第一項ただし書の規定により、協会又は指定完成検査機関が行う完成検査を受け、法第三十七条の四第二項の技術上の基準に適合していると認められた旨を都道府県知事に届け出ようとする者は、様式第四十による届書を充てん設備の使用の本拠の所在地を管轄する都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-70","law":"規則","num":"70","title":"第七十条","cap":"（協会等の完成検査の報告）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第四項において準用する法第三十七条の三第二項の規定により、協会又は指定完成検査機関が報告をしようとするときは、様式第四十一による報告書に完成検査の記録を添付して充てん設備の使用の本拠の所在地を管轄する都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"規則-71","law":"規則","num":"71","title":"第七十一条","cap":"（充てん設備の完成検査の方法）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の四第四項で準用する法第三十七条の三第三項の完成検査の方法は、別表第四のとおりとする。","p":1}],"del":false},{"id":"規則-72","law":"規則","num":"72","title":"第七十二条","cap":"（液化石油ガスの充てん作業の技術上の基準）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の五第二項の経済産業省令で定める技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　第六十四条第一項の充てん設備によりバルク容器又はバルク貯槽に充てんする場合"},{"d":2,"t":"イ　液化石油ガスを最初に充てんする場合は、バルク容器又はバルク貯槽内が不活性ガスで置換されていること又は残留空気による爆発等のおそれのないように措置されていること並びにバルク容器又はバルク貯槽に係る気密試験並びに液面計及び過充てん防止装置の作動試験が行われていることを確認すること。"},{"d":2,"t":"ロ　充てんするときは、あらかじめ、充てん設備（充てん口を含む。）の外面から第一種保安物件に対し一・五メートル以上、第二種保安物件に対し一メートル以上の距離があることを確認すること。ただし、第十九条第三号ロの構造壁若しくはこれと同等以上の性能を有する壁を設けた場合等においては、この限りでない。"},{"d":2,"t":"ハ　充てんするときは、あらかじめ、充てん設備とバルク容器又はバルク貯槽との接続部分において液化石油ガスの漏えいがないことを確認すること。"},{"d":2,"t":"ニ　充てんホースの上を車両が通過しないようにすること。"},{"d":2,"t":"ホ　充てん作業中は、充てん設備の周囲から見やすい場所に、充てん作業中及び火気厳禁の標識を掲げること。"},{"d":2,"t":"ヘ　充てん作業中は、駐車ブレーキをかけ、非常点滅表示灯を点灯すること。"},{"d":2,"t":"ト　充てん作業中は、車止めを設けること等により車両を固定すること。"},{"d":2,"t":"チ　充てん作業中は、液面計により常時液面を監視し、充てんした液化石油ガスの容量がバルク容器又はバルク貯槽の内容積の八十五パーセント（地盤面下に埋設されたバルク容器又はバルク貯槽であって、内容積が二千リットル以上のものにあっては九十パーセント）を超えないようにすること。"},{"d":2,"t":"リ　充てんホース先端のカップリング用液流出防止装置及びバルク容器又はバルク貯槽のカップリング用液流出防止装置からキャップを取り外すときは、ブリーダ弁を開いてから行うこと。"},{"d":2,"t":"ヌ　充てん作業終了後は、カップリング用液流出防止装置から液化石油ガスの漏えいのないことを確認した後、キャップを装着し、ブリーダ弁を閉じること。"},{"d":2,"t":"ル　バルク容器の液取入バルブ又はバルク貯槽の液取入弁は、液封を防止するため常時開放しておくこと。"},{"d":2,"t":"ヲ　充てんするときは、あらかじめ、バルク容器が基礎に確実に設置され、安全な充てんが可能であることを確認すること。"},{"d":2,"t":"ワ　充てん設備の使用の本拠の所在地は、第十六条第七号の基準に適合すること。この場合において、「貯蔵施設」とあるのは「充てん設備の使用の本拠の所在地」と読み替えるものとする。"},{"d":1,"t":"二　第六十四条第一項の充てん設備により容器（バルク容器を除く。以下この号において同じ。）又は貯槽に充てんする場合"},{"d":2,"t":"イ　液化石油ガスを最初に充てんする場合は、容器又は貯槽内が不活性ガスで置換されていること又は残留空気による爆発等のおそれのないように措置されていること並びに容器又は貯槽に係る気密試験並びに液面計及び過充てん防止装置の作動試験が行われていることを確認すること。"},{"d":2,"t":"ロ　充てんするときは、あらかじめ、充てん設備（充てん口を含む。）の外面から第一種保安物件に対し十五メートル以上、第二種保安物件に対し十メートル以上の距離があることを確認すること。"},{"d":2,"t":"ハ　内容積千リットルを超える容器又は貯槽に充てんするときは、あらかじめ、充てんを受ける容器又は貯槽に、液面計又は過充てん防止装置が設けられていることを確認すること。"},{"d":2,"t":"ニ　内容積千リットル以下の容器又は貯槽に充てんするときは、あらかじめ、充てんを受ける容器又は貯槽に、液面計及び過充てん防止装置が設けられていることを確認すること。"},{"d":2,"t":"ホ　貯槽に充てんするときは、液面計により常時液面を監視し、充てんした液化石油ガスの容量が貯槽の内容積の九十パーセントを超えないようにすること。"},{"d":2,"t":"ヘ　充てん設備と容器又は貯槽との接続部分において液化石油ガスの漏えいがないことを確認すること。"},{"d":2,"t":"ト　充てんホース先端のカップリング用液流出防止装置からキャップを取り外すときは、ブリーダ弁を開いてから行うこと。"},{"d":2,"t":"チ　前号ニからトまで及びワの基準に適合すること。"},{"d":1,"t":"三　第六十四条第二項の充てん設備により充てんする場合"},{"d":2,"t":"イ　液化石油ガスを最初に充てんする場合は、容器、貯槽又はバルク貯槽内が不活性ガスで置換されていること又は残留空気による爆発等のおそれのないよう措置されていること並びに容器、貯槽又はバルク貯槽に係る気密試験並びに液面計及び過充てん防止装置の作動試験が行われていることを確認すること。"},{"d":2,"t":"ロ　充てん設備の停止場所は、他の車両と接触事故等を起こすおそれのない場所であって、液化石油ガスを供給する者又は供給を受ける者の所有又は占有する土地内であること。"},{"d":2,"t":"ハ　充てんするときは、あらかじめ、充てん設備（充てん口を含む。）の外面から第一種保安物件に対し十五メートル以上、第二種保安物件に対し十メートル以上の距離があることを確認すること。"},{"d":2,"t":"ニ　内容積千リットルを超える容器又は貯槽に充てんするときは、あらかじめ、充てんを受ける容器又は貯槽に、液面計又は過充てん防止装置が設けられていることを確認すること。"},{"d":2,"t":"ホ　内容積千リットル以下の容器又は貯槽に充てんするときは、あらかじめ、充てんを受ける容器又は貯槽に、液面計及び過充てん防止装置が設けられていることを確認すること。"},{"d":2,"t":"ヘ　貯槽に充てんするときは、液面計により常時液面を監視し、充てんした液化石油ガスの容量が当該貯槽の内容積の九十パーセントを超えないようにすること。"},{"d":2,"t":"ト　充てんするときは、充てん設備の原動機からの火花の放出を防止する措置を講じてすること。"},{"d":2,"t":"チ　充てんするときは、充てん設備に生ずる静電気を除去する措置を講じてすること。"},{"d":1,"t":"四　充てんするときは、あらかじめ、充てんのためのポンプ又は圧縮機の液化石油ガスの漏えいの有無を点検し、漏えいのあるときは、補修その他の危険を防止するための措置を講ずること。ただし、次号に規定する場合並びに当該ポンプ又は圧縮機が軸シール部のない構造のものにあっては、この限りでない。"},{"d":1,"t":"五　操作箱内に設置されたガス漏れ検知器等によって、充てんのためのポンプ又は圧縮機の液化石油ガスの漏えいの検知が可能な場合は、充てん設備の移動を開始するとき及び移動を終了したときに、当該ポンプ又は圧縮機の液化石油ガスの漏えいの有無を点検し、漏えいのあるときは、補修その他の危険を防止するための措置を講ずること。ただし、当該ポンプ又は圧縮機が軸シール部のない構造のものにあっては、この限りでない。"}],"del":false},{"id":"規則-73","law":"規則","num":"73","title":"第七十三条","cap":"（危険のおそれのない場合の特則）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"第六十四条及び前条に規定する基準について、経済産業大臣が充てん設備の規模、周囲の状況、充てんの方法等から判断して保安上支障がないと認めた場合においては、当該規定にかかわらず、経済産業大臣が認める基準をもって、当該規定に係る法第三十七条の四第二項及び法第三十七条の五第二項の技術上の基準とする。","p":1}],"del":false},{"id":"規則-74","law":"規則","num":"74","title":"第七十四条","cap":"（充てんを行う者の講習）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の五第四項の経済産業省令で定める講習（以下「充てん作業者講習」という。）は、次の表の上欄に掲げる科目に応じ、それぞれ同表の下欄に掲げる範囲について行うものとする。","p":1},{"d":1,"t":"科目｜範囲","tb":1},{"d":1,"t":"充てんに関する基礎知識｜一　液化石油ガスの物性","tb":1},{"d":1,"t":"二　貯蔵設備及び充てん作業の定義、形態、種類","tb":1},{"d":1,"t":"充てん設備に関する知識｜一　充てん設備の構造","tb":1},{"d":1,"t":"二　充てん設備の貯蔵設備","tb":1},{"d":1,"t":"三　付属機器","tb":1},{"d":1,"t":"四　充てん設備の安全対策","tb":1},{"d":1,"t":"充てん設備の管理方法｜定期検査","tb":1},{"d":1,"t":"バルク供給に係る設備に関する知識｜一　バルク供給に係る設備の構造","tb":1},{"d":1,"t":"二　附属機器","tb":1},{"d":1,"t":"三　バルク供給に係る設備の位置及び設置場所","tb":1},{"d":1,"t":"四　バルク供給に係る設備の設置方法","tb":1},{"d":1,"t":"バルク供給に係る設備の管理方法｜定期点検","tb":1},{"d":1,"t":"充てんに関する法令｜法、令及びこの省令並びにその他関係法令","tb":1},{"d":1,"t":"充てん作業実習｜一　充てん作業前の措置","tb":1},{"d":1,"t":"二　充てん作業","tb":1},{"d":1,"t":"三　充てん作業後の措置","tb":1},{"d":1,"t":"四　非常時における対応","tb":1},{"d":0,"t":"２　法第三十七条の五第四項の講習の課程を修了した者（以下「充てん作業者」という。）は、前項に規定する講習を受けた日の属する年度の翌年度の開始の日から三年以内に、第一回の再講習を受けなければならない。","p":1},{"d":0,"t":"３　充てん作業者は、前項の第一回の再講習を受けた日の属する年度の翌年度の開始の日から五年以内に第二回の再講習を受けなければならない。第三回以降の再講習についても同様とする。","p":1},{"d":0,"t":"４　前二項の規定にかかわらず、災害その他やむを得ない事由により前二項の期間内に再講習を受けることが困難である による報告書を経済産業大臣に提出しなければならない。","p":1},{"d":0,"t":"３　充てん作業者指定養成施設は、その指定を受けた者の氏名又は名称及び法人にあってはその代表者の氏名、充てん作業者講習を行う施設の名称及び所在地並びに第七十七条第二項第二号ハ及びニの事項を変更したときは、遅滞なく、様式第四十三の四による届書を経済産業大臣に提出しなければならない。","p":1},{"d":0,"t":"４　充てん作業者指定養成施設は、充てん作業者講習の廃止又は休止をしたときは、遅滞なく、様式第四十三の五による届書を経済産業大臣に提出しなければならない。","p":1}],"del":false},{"id":"規則-80","law":"規則","num":"80","title":"第八十条","cap":"（指定の取消し）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"経済産業大臣は、充てん作業者指定養成施設が第七十八条各号の基準に適合しなくなったときは、その指定を取り消すことができる。","p":1}],"del":false},{"id":"規則-81","law":"規則","num":"81","title":"第八十一条","cap":"（充てん設備の保安検査）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"法第三十七条の六第一項本文の規定により都道府県知事が行う保安検査は、一年に一回受けるものとする。ただし、災害その他やむを得ない事由によりその回数で保安検査を受けることが困難であるときは、経済産業大臣が当該事由を勘案して定める期間に一回受けるものとする。","p":1},{"d":0,"t":"２　使用を休止した充てん設備であって、当該充てん設備の許可をした都道府県知事にその旨を届け出たものであり、かつ、前回の保安検査（保安検査を受けたことのない充てん設備にあっては、完成検査）を受けた日から当該充てん設備を再び使用しようとする日までの期間が一年以上であるもの（以下「休止充てん設備」という。）にあっては、当該充てん設備を再び使用しようとするときまで行わないものとする。","p":1},{"d":0,"t":"３　前回の保安検査（保安検査を受けたことのない充てん設備にあっては、完成検査）を受けた日から一年を経過した日（以下この項において「基準日」という。）の前後一月以内に法第三十七条の六第一項本文の保安検査を受けた場合にあつては、基準日において当該検査を受けたものとみなす。","p":1},{"d":0,"t":"４　法第三十七条の六第一項本文の保安検査を受けようとする者は、前回の保安検査（保安検査を受けたことのない充てん設備にあっては、完成検査）を受けた日（前項の規定により保安検査を受けたものとみなされた日を含む。以下同じ。）から一年を超えない日（休止充てん設備にあっては、当該充てん設備を再び使用しようとする日の三十日前）までに様式第四十四による申請書を充てん設備の使用の本拠の所在地を管轄する都道府県知事に提出しなければならない。","p":1},{"d":0,"t":"５　都道府県知事は、法第三十七条の六第一項本文の保安検査において、充てん設備が法第三十七条の四第二項の経済産業省令で定める技術上の基準に適合していると認めるときは、様式第四十五による充てん設備保安検査証を交付するものとする。","p":1}],"del":false},{"id":"規則-82","law":"規則","num":"82","title":"第八十二条","cap":"（協会等が行う保安検査の申請等）","capInh":false,"path":"第五章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"前条の規定は、協会又は指定保安検査機関が行う保安検査について準用する。この場合において、同条中「法第三十七条の六第一項本文」とあるのは「法第三十七条の六第一項ただし書」と、同条第三項中「充てん設備の使用の本拠の所在地を管轄する都道府県知事」とあるのは「協会又は指定保安検査機関」と読み替えるものとする。","p":1},{"d":0,"t":"２　法第三十七条の六第一項ただし書の規定により、協会又は指定保安検査機関が行う保安検査を受けた旨を都道府県知事に届け出ようとする者は、様式第四十六による届書を充てん設備の使用の本拠の所在地を管轄する都道府県知事に提出しなければならない。","p":1}],"del":false},{ "t":"８　法第八十一条第二項の試験事務に係る帳簿は、試験事務を廃止するまで保存しなければならない。","p":1}],"del":false},{"id":"規則-131_2","law":"規則","num":"131_2","title":"第百三十一条の二","cap":"（電磁的方法による保存）","capInh":false,"path":"第八章　雑則","lines":[{"d":0,"t":"前条第七項に規定する事項が、電磁的方法により記録され、当該記録が必要に応じ電子計算機その他の機器を用いて直ちに表示されることができるようにして保存されるときは、当該記録の保存をもって法第八十一条第二項に規定する当該事項が記載された帳簿の保存に代えることができる。","p":1},{"d":0,"t":"２　前項の規定による保存をする場合には、経済産業大臣が定める基準を確保するよう努めなければならない。","p":1}],"del":false},{"id":"規則-132","law":"規則","num":"132","title":"第百三十二条","cap":"（報告）","capInh":false,"path":"第八章　雑則","lines":[{"d":0,"t":"次の表の上欄に掲げる者は、毎事業年度経過後三月以内に、同表の中欄に掲げる事項を、同表の下欄に掲げる者に報告しなければならない。ただし、災害その他やむを得ない事由により当該期間内に報告することが困難であるときは、経済産業大臣が当該事由を勘案して定める期間内に報告しなければならない。","p":1},{"d":1,"t":"液化石油ガス販売事業者｜その事業年度末における販売する一般消費者等の数及び保安機関への保安業務の委託状況｜法第三条第一項の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長","tb":1},{"d":1,"t":"保安機関｜その事業年度における法第二十七条第一項各号に掲げる保安業務の実施状況、その事業年度末における保安業務資格者の数及び保安業務に係る一般消費者等の数並びに法人にあっては、その事業年度中の役員又は第三十三条各号に掲げる構成員の構成の変更｜法第二十九条第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長","tb":1},{"d":1,"t":"充てん事業者｜その事業年度末における充塡に係る一般消費者等の数及び充塡の作業に従事している充てん作業者の数｜法第三十七条の四第一項の許可をした都道府県知事又は指定都市の長","tb":1}],"del":false},{"id":"規則-133","law":"規則","num":"133","title":"第百三十三条","cap":"（事故届）","capInh":false,"path":"第八章　雑則","lines":[{"d":0,"t":"保安機関は、自ら行っている保安業務の範囲内において当該一般消費者等の供給設備又は消費設備に災害が発生したときには、遅滞なく、その旨を警察官に届け出なければならない。","p":1}],"del":false},{"id":"規則-134","law":"規則","num":"134","title":"第百三十四条","cap":"（収去証）","capInh":false,"path":"第八章　雑則","lines":[{"d":0,"t":"法第八十三条第一項又は第三項の規定により経済産業大臣は、その職員に液化石油ガスを収去させるときは、被収去者に様式第六十による収去証を交付しなければならない。","p":1}],"del":false},{"id":"規則-135","law":"規則","num":"135","title":"第百三十五条","cap":"（証明書）","capInh":false,"path":"第八章　雑則","lines":[{"d":0,"t":"法第八十三条第八項の経済産業大臣、都道府県知事又は市長がその職員に携帯させる証明書は、様式第六十一によるものとする。","p":1},{"d":0,"t":"２　法第八十三条第十二項の機構がその職員に携帯させる証明書は、様式第六十二によるものとする。","p":1}],"del":false},{"id":"規則-136:139","law":"規則","num":"136:139","title":"第百三十六条から第百三十九条まで","cap":"（証明書）","capInh":true,"path":"第八章　雑則","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"規則-140","law":"規則","num":"140","title":"第百四十条","cap":"（経済産業大臣に対する都道府県知事又は市長の報告）","capInh":false,"path":"第八章　雑則","lines":[{"d":0,"t":"都道府県知事又は指定都市の長は、令第十六条第八項の規定により法第十六条の二第二項に規定する経済産業大臣の権限に属する事務の報告を行うときは、速やかに様式第六十四の供給設備技術基準適合命令実施報告書を当該都道府県又は指定都市の区域を管轄する産業保安監督部長に提出しなければならない。","p":1}],"del":false},{"id":"規則-141","law":"規則","num":"141","title":"第百四十一条","cap":"（経済産業大臣に対する都道府県知事又は市長の報告）","capInh":true,"path":"第八章　雑則","lines":[{"d":0,"t":"都道府県知事又は指定都市の長は、令第十六条第八項の規定により法第八十二条第一項に規定する経済産業大臣の権限に属する事務（液化石油ガス器具等の販売の事業を行う者に関するものを除く。次項において同じ。）の報告を行うときは、当該事務を行った年度の一年分の報告の徴収の結果を取りまとめて、翌年度の六月末日までに様式第六十五の報告徴収実施年報を次の各号に掲げる区分に応じ、当該各号に定める者に提出しなければならない。","p":1},{"d":1,"t":"一　液化石油ガスの取引の適正化に関する事項のみ　経済産業局長"},{"d":1,"t":"二　液化石油ガスの保安の確保に関する事項のみ　産業保安監督部長"},{"d":1,"t":"三　液化石油ガスの取引の適正化に関する事項及び液化石油ガスの保安の確保に関する事項　産業保安監督部長"},{"d":0,"t":"２　都道府県知事又は指定都市の長は、法第八十二条第一項に規定する経済産業大臣の権限に属する事務を行った場合であって、法令に違反する事実その他災害の発生につながるおそれのある重大な事実があると認めるときは、前項の規定にかかわらず、速やかに様式第六十六の報告徴収実施報告書を次の各号に掲げる区分に応じ、当該各号に定める者に提出しなければならない。","p":1},{"d":1,"t":"一　液化石油ガスの取引の適正化に関する事項のみ　経済産業局長"},{"d":1,"t":"二　液化石油ガスの保安の確保に関する事項のみ　産業保安監督部長"},{"d":1,"t":"三　液化石油ガスの取引の適正化に関する事項及び液化石油ガスの保安の確保に関する事項　産業保安監督部長"},{"d":0,"t":"３　都道府県知事は、法第八十二条第一項に規定する経済産業大臣の権限に属する事務（液化石油ガス器具等の販売の事業を行う者に関するものに限る。次項において同じ。）を行ったときは、速やかに、その旨を当該都道府県の区域を管轄する経済産業局長を経由して経済産業大臣に報告しなければならない。","p":1},{"d":0,"t":"４　市長は、法第八十二条第一項に規定する経済産業大臣の権限に属する事務を行ったときは、速やかに、その旨を当該市の区域を管轄する経済産業局長を経由して経済産業大臣に報告しなければならない。この場合において、当該市長は、その旨を当該市を包括する都道府県の知事に報告することができる。","p":1}],"del":false},{"id":"規則-142","law":"規則","num":"142","title":"第百四十二条","cap":"（経済産業大臣に対する都道府県知事又は市長の報告）","capInh":true,"path":"第八章　雑則","lines":[{"d":0,"t":"都道府県知事又は指定都市の長は、令第十六条第八項の規定により法第八十三条第一項又は第二項に規定する経済産業大臣の権限に属する事務（液化石油ガス器具等の販売の事業を行う者に関するものを除く。次項において同じ。）の報告を行うときは、当該事務を行った年度の一年分の立入検査、質問又は収去の結果を取りまとめて、翌年度の六月末日までに様式第六十七の立入検査等実施年報を次の各号に掲げる区分に応じ、当該各号に定める者に提出しなければならない。","p":1},{"d":1,"t":"一　液化石油ガスの取引の適正化に関する事項のみ　経済産業局長"},{"d":1,"t":"二　液化石油ガスの保安の確保に関する事項のみ　産業保安監督部長"},{"d":1,"t":"三　液化石油ガスの取引の適正化に関する事項及び液化石油ガスの保 del":false}]}],"wiki":[{"id":"lpgas-law-basics","title":"液石法の基本","md":"# 液石法の基本\n\n液化石油ガス法（正式名「液化石油ガスの保安の確保及び取引の適正化に関する法律」、昭和42年法律第149号）は、LPガスの**保安の確保**と**取引の適正化**を目的とする法律。小売店（LPガス販売事業者）に課される主な義務を、条番号付きでまとめたハブページ。細かい基準の多くは施行規則（省令）に委任されている。\n\n## 販売事業者の主な義務（法）\n\n| 条 | 内容 | 要点 |\n|---|---|---|\n| 第3条 | 事業の登録 | 販売所が1都道府県内なら知事（1指定都市内なら市長）、2都道府県以上なら経産大臣の登録 |\n| 第14条 | 書面の交付 | 契約締結時に遅滞なく交付。記載事項を変更したときも交付。消費者の承諾があれば電子交付も可 |\n| 第16条 | 基準適合義務等 | 貯蔵施設の技術基準（1項）／**販売の方法の基準**（2項 → 規則第16条）／違反時の基準適合命令（3項） |\n| 第16条の2 | 供給設備の維持 | 供給設備を技術基準に適合するように維持 |\n| 第18条 | 保安教育 | 従業者への保安教育 |\n| 第19〜22条 | 業務主任者 | 選任・職務・代理者・解任命令 |\n| 第27条 | 保安業務 | ①供給設備の点検 ②消費設備の調査 ③周知 ④緊急時対応。保安機関（第29条認定）へ委託可 |\n| 第38条の2〜 | 設備工事 | 液化石油ガス設備士でなければできない工事あり |\n\n## 商慣行是正（2024〜2025改正）\n\n規則第16条（販売の方法の基準）に追加された、営業に直結するルール → [[LPガス商慣行是正（2024〜2025改正）]]\n\n## 調べ方\n\n- 条文: e-Gov法令検索（法 342AC0000000149／規則 409M50000400011）\n- 運用・解釈: 経産省「液石法及び関係政省令の運用及び解釈の基準について」（いわゆる基本通達）、商慣行是正ガイドライン・Q&A\n- 所轄: 地域の産業保安監督部／都道府県の担当課\n\n## Related Pages\n\n- [[LPガス商慣行是正（2024〜2025改正）]]\n- [[液石法 Q&A ログ]]"},{"id":"lpgas-trade-practice-reform","title":"LPガス商慣行是正（2024〜2025改正）","md":"# LPガス商慣行是正（2024〜2025改正）\n\n2024年4月2日公布の施行規則改正。根拠は法第16条第2項の「販売の方法の基準」で、規則第16条に号が追加された。施行は2段階で、①過大な営業行為の制限と料金の情報提供が**2024年7月2日**、②三部料金制の徹底（設備費用の外出し表示・計上禁止）が**2025年4月2日**。違反すると基準適合命令（法第16条第3項）の対象になる。\n\n## 施行スケジュール\n\n| 施行日 | 内容 | 規則第16条 |\n|---|---|---|\n| 2024-07-02 | 入居前の料金表提示（努力義務） | 第15号の2 |\n| 2024-07-02 | 正常な商慣習を超えた利益供与の禁止 | 第15号の3（オーナー向け）／第15号の4（戸建て等） |\n| 2024-07-02 | 事業者の切替えを制限する条件付き契約の禁止 | 第15号の5（オーナーとの貸与契約等）／第15号の6（消費者との契約） |\n| 2025-04-02 | 三部料金制（基本料金・従量料金・設備料金に整理して算定根拠を通知） | 第15号の7 |\n| 2025-04-02 | 配管・ガス器具等以外の費用（エアコン、Wi-Fi等）を設備料金で請求しない | 第15号の8 |\n| 2025-04-02 | 賃貸では、オーナーが本来負担すべき消費設備費用を入居者に請求しない（入居者との合意があれば例外） | 第15号の9 |\n\n## 既存契約の扱い\n\n- 第15号の7（外出し表示）は既存契約にも適用（北海道庁の説明による）。\n- 第15号の8・9（計上禁止）は新規契約のみ。既存契約には早期移行の努力義務（北海道庁・兵庫県LPガス協会資料による）。\n\n## 卸として販売店をサポートするときのポイント\n\n- 「無償貸与」「オーナーへの協力金」は、**正常な商慣習を超えるかどうか**で判断する。何が該当するかの具体例は経産省ガイドラインで確認する。\n- 賃貸物件の料金表は、入居者が直接求めてきたら提示する。入居前の提示は努力義務。\n- 請求書・料金表が三部料金（基本・従量・設備）に整理されているかを確認する。\n\n## 出典\n\n- 条文: sources/lpgas-law-articles-2026-10-23.md（このアプリの条文検索で確認できます）（e-Gov）\n- 北海道庁 制度改正ページ: https://www.pref.hokkaido.lg.jp/kz/kke/207566.html\n- 経産省 省令公布（2024-04-02）: https://www.meti.go.jp/press/2024/04/20240402001/20240402001.html\n- 資源エネルギー庁 対応方針資料: https://hyogolpg.or.jp/wp-content/uploads/2024/05/3a8856a35858b4729ba6ae8eb5bb7d8f.pdf\n- 液化石油ガス流通WG ガイドライン資料: https://www.meti.go.jp/shingikai/enecho/shigen_nenryo/sekiyu_gas/ekika_sekiyu/pdf/009_04_00.pdf\n\n## Related Pages\n\n- [[液石法の基本]]\n- [[液石法 Q&A ログ]]"},{"id":"lpgas-law-qa-log","title":"液石法 Q&A ログ","md":"# 液石法 Q&A ログ\n\n業務で受けた質問（販売店から聞かれたことも含む）と、その回答の記録。1問ごとに「結論」「根拠条文」「出典」「日付」を残す。新しいものを上に追加する。\n\n## 記録の書式\n\n- **Q（日付・相談元）**: 質問\n  - 結論:\n  - 根拠: 法 第◯条／規則 第◯条第◯号／ガイドライン・Q&A\n  - 出典URL:\n  - 備考（確認先・未確定な点）:\n\n## 記録\n\n（まだありません）\n\n## Related Pages\n\n- [[液石法の基本]]\n- [[LPガス商慣行是正（2024〜2025改正）]]"}]};

const LAWNAME = {"法":"法","令":"施行令","規則":"施行規則"};
const KN = "〇一二三四五六七八九";
function kanji(n){ // 1..9999 → 漢数字（条文表記）
  n=+n; if(!n) return "";
  let s="", u=[[1000,"千"],[100,"百"],[10,"十"]];
  for(const [v,c] of u){ const d=Math.floor(n/v); if(d){ s+=(d>1?KN[d]:"")+c; n%=v; } }
  return s+(n?KN[n]:"");
}
const norm = s => s.normalize("NFKC").toLowerCase().replace(/\s+/g,"");
// クエリ中の算用数字を条文の漢数字に（16条→十六条、第3項→第三項）
const toKanjiNums = s => s.replace(/\d+/g, m => kanji(m));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- インデックス ----------
const ARTS=[], BYID={};
for(const law of DATA.laws){
  law.arts.forEach((a,i)=>{
    a.lawId=law.id; a.idx=i; a.lawObj=law;
    a.body=a.lines.map(l=>l.t).join("\n");
    a.n=norm(a.title+" "+a.cap+" "+a.path+" "+a.body);
    a.nh=norm(a.title+" "+a.cap+" "+a.path);
    ARTS.push(a); BYID[a.id]=a;
  });
}
const WIKI = DATA.wiki.map(w=>({...w, n:norm(w.title+" "+w.md), plain:w.md.replace(/[#*|`>-]+/g," ").replace(/\[\[([^\]]+)\]\]/g,"$1").replace(/\s+/g," ")}));

function artLabel(a){

}
function numToId(law, n1, n2, n3){
  return law+"-"+n1+(n2?"_"+n2:"")+(n3?"_"+n3:"");
}

// 条番号の直接指定：「16条の2」「規則16条」「法第27条」
function parseArticleRef(q){
  const m = q.normalize("NFKC").replace(/\s+/g,"").match(/^(法|施行令|令|施行規則|規則)?第?(\d+)条(?:の(\d+))?(?:の(\d+))?/);
  if(!m) return null;
  const law = m[1] ? ({"法":"法","施行令":"令","令":"令","施行規則":"規則","規則":"規則"})[m[1]] : null;
  const laws = law ? [law] : ["法","規則","令"];
  return laws.map(l=>BYID[numToId(l,m[2],m[3],m[4])]).filter(Boolean);
}

function expandTerms(q, useSyn){
  const terms = q.normalize("NFKC").split(/[\s、,，]+/).filter(Boolean);
  return terms.map(t=>{
    const base = norm(t), kj = norm(toKanjiNums(t));
    const own = [...new Set([base,kj])];
    const syn = new Set();
    if(useSyn){
      let keys = Object.keys(SYN).filter(k=>{ const nk=norm(k); return base.includes(nk) || (base.length>=2 && nk.includes(base)); });
      // 「三部料金」に含まれる「料金」のように、より長い一致語に含まれる短い語は使わない
      keys = keys.filter(k=>!keys.some(o=>o!==k && norm(o).includes(norm(k)) && base.includes(norm(o))));
      keys.forEach(k=>SYN[k].forEach(s=>syn.add(norm(s))));
      own.forEach(o=>syn.delete(o));
    }
    return {raw:t, own, syn:[...syn]};
  });
}
function countAll(hay, needle){
  if(!needle) return 0; let c=0, i=0;
  while((i=hay.indexOf(needle,i))!==-1){ c++; i+=needle.length; }
  return c;
}
function scoreText(n, nh, groups, mode){
  let total=0, matched=0;
  for(const g of groups){
    let gs=0;
    for(const o of g.own){ const c=countAll(n,o); gs+=c*3; if(nh && nh.includes(o)) gs+=12; }
    for(const s of g.syn){ const c=countAll(n,s); gs+=c; if(nh && nh.includes(s)) gs+=5; }
    if(gs>0) matched++;
    total+=gs;
  }
  if(mode==="and" && matched<groups.length) return 0;
  return total + matched*20;
}

}

function citers(t){
  const out=[];
  const re = new RegExp(t.title.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?!の[一二三四五六七八九十])","g");
  for(const a of ARTS){
    if(a===t || a.del) continue;
    let m, hit=false;
    while((m=re.exec(a.body))){
      const pre = a.body.slice(Math.max(0,m.index-3), m.index);
      const last = pre.slice(-1), before = pre.slice(-2,-1);
      const ideo = c => /[一-鿿]/.test(c);
      let ok;
      if(t.law===a.law) ok = !(last==="法"||last==="令"||pre.endsWith("規則")) || (t.law==="法"&&last==="法"&&!ideo(before));
      else if(t.law==="法") ok = last==="法" && !ideo(before);
      else if(t.law==="令") ok = last==="令" && !ideo(before);
      else ok = pre.endsWith("規則");
      if(ok){ hit=true; break; }
    }
    if(hit) out.push(a);
  }
  return out;
}

function search(q){
  const useSyn = document.getElementById("syn").checked;
  const laws = enabledLaws();
  const groups = expandTerms(q, useSyn);
  if(!groups.length) return null;
  const direct = (parseArticleRef(q)||[]).filter(a=>laws.has(a.law));
  // 条番号だけの検索 → その条と、その条を引用している条文
  if(direct.length && /^(法|施行令|令|施行規則|規則)?第?\d+条(の\d+){0,2}$/.test(q.normalize("NFKC").replace(/\s+/g,""))){
    const seen=new Set(direct.map(a=>a.id));
    const cites=[];
    direct.forEach(t=>citers(t).forEach(a=>{ if(!seen.has(a.id)&&laws.has(a.law)){ seen.add(a.id); cites.push({a, s:1, of:t}); } }));
    const g=[{raw:q, own:direct.map(t=>norm(t.title)), syn:[]}];
    return {groups:g, direct, mode:"ref", arts:cites, wiki:[]};
  }
  let mode="and";
  const run = () => {
    const arts = ARTS.filter(a=>laws.has(a.law)&&!a.del).map(a=>({a, s:scoreText(a.n,a.nh,groups,mode)})).filter(x=>x.s>0)
      .sort((x,y)=>y.s-x.s || (x.a.law===y.a.law?x.a.idx-y.a.idx:"法令規則".indexOf(x.a.law)-"法令規則".indexOf(y.a.law)));
    const wiki = laws.has("wiki") ? WIKI.map(w=>({w, s:scoreText(w.n,norm(w.title),groups,mode)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s) : [];
    return {arts, wiki};
  };
  let r = run();
  if(!r.arts.length && !r.wiki.length && groups.length>1){ mode="or"; r=run(); }
  return {groups, direct, mode, ...r};
}

// ---------- ハイライト ----------
function hlNeedles(groups){
  const set=new Set();
  groups.forEach(g=>{ g.own.forEach(x=>set.add(x)); g.syn.forEach(x=>set.add(x)); });
  return [...set].filter(x=>x.length>0).sort((a,b)=>b.length-a.length);
}
function highlight(text, needles){
  if(!needles.length) return esc(text);
  // NFKC 比較のため、表示用テキストも正規化（法令本文はほぼ全角のまま変わらない）
  const t = text.normalize("NFKC");
  const lower = t.toLowerCase();
  const marks = new Array(t.length).fill(false);
  for(const n of needles){ let i=0; while((i=lower.indexOf(n,i))!==-1){ for(let k=i;k<i+n.length;k++) marks[k]=true; i+=n.length; } }
  let out="", on=false;
  for(let i=0;i<t.length;i++){
    if(marks[i]&&!on){ out+="<mark>"; on=true; }
    if(!marks[i]&&on){ out+="</mark>"; on=false; }
    out+=esc(t[i]);
  }
  return out+(on?"</mark>":"");
}
function snippet(text, needles, len=90){
  const t=text.normalize("NFKC").replace(/\n/g," "), lower=t.toLowerCase();
  let pos=-1;
  for(const n of needles){ const i=lower.indexOf(n); if(i!==-1 && (pos===-1||i<pos)) pos=i; }
  if(pos===-1) return esc(t.slice(0,len))+(t.length>len?"…":"");
  const st=Math.max(0,pos-30), s=t.slice(st, st+len);
  return (st>0?"…":"")+highlight(s,needles)+(st+len<t.length?"…":"");
}

// ---------- 条文中の参照をリンク化 ----------
function linkRefs(html, defaultLaw){
  // 「法第十六条」「規則第16条第15号の3」「第二十七条第一項」など（同一法令内）
  return html.replace(/(施行規則|規則|施行令|法)?第([0-9一二三四五六七八九十百千]+)条(?:の([0-9一二三四五六七八九十]+))?(?:の([0-9一二三四五六七八九十]+))?/g, (m, lw, a, b, c, off, str)=>{
    // 他の法律名の直後（例：高圧ガス保安法第…、計量法（…）第…）はリンクしない
    const before = str.slice(Math.max(0,off-6), off);
    if(!lw && /(保安法|計量法|自治法|建築基準法|消防法|法律)$/.test(before)) return m;
    if(!lw && /）$/.test(before)) return m;
    const law = lw ? ({"施行規則":"規則","規則":"規則","施行令":"令","法":"法"})[lw] : defaultLaw;
    const id = numToId(law, k2n(a), b&&k2n(b), c&&k2n(c));
    return BYID[id] ? `<a class="ref" href="#a/${encodeURIComponent(id)}">${m}</a>` : m;
  });
}
function k2n(s){
  if(/^\d+$/.test(s)) return +s;
  let n=0, cur=0;
  for(const ch of s){
    const d=KN.indexOf(ch);
    if(d>0) cur=d;
    else if(ch==="十"){ n+=(cur||1)*10; cur=0; }
    else if(ch==="百"){ n+=(cur||1)*100; cur=0; }
    else if(ch==="千"){ n+=(cur||1)*1000; cur=0; }
  }
  return n+cur;
}

// ---------- 保存（★）と履歴 ----------
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const favs = () => LS.get("lp-favs",[]);
function toggleFav(id){ const f=favs(); const i=f.indexOf(id); i===-1?f.unshift(id):f.splice(i,1); LS.set("lp-favs",f); }
function pushHist(q){ const h=LS.get("lp-hist",[]).filter(x=>x!==q); h.unshift(q); LS.set("lp-hist",h.slice(0,10)); }

// ---------- 画面 ----------
const $main = document.getElementById("main");
const $q = document.getElementById("q");
let lastGroups = [];

function setTab(t){ document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.tab===t)); }

function viewHome(){
  setTab("home");
  const hist = LS.get("lp-hist",[]);
  const sample = ["無償貸与","三部料金","賃貸 料金表","切替","書面の交付","保安業務","業務主任者","設備士","撤去","帳簿","罰則","16条の2","規則16条"];
  $main.innerHTML = `
    <div class="card">
      <div class="ttl">調べたい言葉を入れてください</div>
      <div class="note">業務で使う言葉（無償貸与、オーナー、切替など）を入れると、条文で使われている言葉（利益を供与、所有者、変更を制限…）でも探します。「16条の2」「規則16条」のように条番号を入れるとその条に飛べます。スペースで区切ると全部を含む条文を探します。</div>
    </div>
    ${hist.length?`<h2 class="sec">最近の検索</h2><div class="chips">${hist.map(h=>`<a class="chip" href="#q/${encodeURIComponent(h)}">${esc(h)}</a>`).join("")}</div>`:""}
    <h2 class="sec">よく調べる言葉</h2>
    <div class="chips">${sample.map(h=>`<a class="chip" href="#q/${encodeURIComponent(h)}">${esc(h)}</a>`).join("")}</div>
    <h2 class="sec">まとめ</h2>
    ${WIKI.map(w=>`<a class="card" href="#w/${w.id}"><span class="tag t-wiki">まとめ</span><span class="ttl">${esc(w.title)}</span></a>`).join("")}
    <p class="note">条文は e-Gov 法令検索のデータ（${DATA.built} 時点）から作成しています。本則のみで、附則・様式は含みません。最新の条文や解釈は e-Gov と経済産業省の資料で確認してください。</p>`;
}

function viewSearch(q){
  setTab("home");
  $q.value=q;
  const r = search(q);
  if(!r){ viewHome(); return; }
  pushHist(q);
  lastGroups = r.groups;
  const needles = hlNeedles(r.groups);
  const syns = [...new Set(r.groups.flatMap(g=>g.syn))];
  const limit = 60;
  let h = "";
  if(syns.length) h += `<div class="meta">関連語でも検索しました：</div><div class="chips">${syns.map(s=>`<span class="chip syn">${esc(s)}</span>`).join("")}</div>`;
  if(r.mode==="or") h += `<div class="meta">全部の言葉を含む条文がなかったので、どれかを含む条文を表示しています。</div>`;
  if(r.direct.length){
    h += `<h2 class="sec">条番号で一致</h2>` + r.direct.map(a=>artCard(a,needles)).join("");
  }
  if(r.wiki.length){
    h += `<h2 class="sec">まとめ・Q&A（${r.wiki.length}）</h2>` + r.wiki.map(x=>`<a class="card" href="#w/${x.w.id}"><span class="tag t-wiki">まとめ</span><span class="ttl">${esc(x.w.title)}</span><div class="snip">${snippet(x.w.plain,needles,110)}</div></a>`).join("");
  }
  h += r.mode==="ref"
    ? `<h2 class="sec">この条を引用している条文（${r.arts.length}件）</h2>`
    : `<h2 class="sec">条文（${r.arts.length}件${r.arts.length>limit?"・上位"+limit+"件を表示":""}）</h2>`;
  h += r.arts.length ? r.arts.slice(0,limit).map(x=>artCard(x.a,needles)).join("") : `<div class="empty">見つかりませんでした。言葉を短くするか、「関連語も探す」をオンにしてください。</div>`;
  $main.innerHTML = h;
  window.scrollTo(0,0);
}

function artCard(a, needles){
  return `<a class="card" href="#a/${encodeURIComponent(a.id)}">
    <span class="tag t-${a.law}">${LAWNAME[a.law]}</span><span class="ttl">${esc(a.title)}</span>
    <span class="cap">${esc(a.cap||a.path.split(" / ").pop()||"")}</span>
    <div class="snip">${snippet(a.body,needles)}</div></a>`;
}

function viewArticle(id){
  const a = BYID[id];
  if(!a){ $main.innerHTML=`<div class="empty">条文が見つかりません</div>`; return; }
  setTab(location.hash.includes("from=toc")?"toc":"home");
  const needles = hlNeedles(lastGroups);
  const arts = a.lawObj.arts;
  const prev = arts[a.idx-1], next = arts[a.idx+1];
  const isFav = favs().includes(id);
  const egov = `https://laws.e-gov.go.jp/law/${a.lawId}`;
  const lines = a.lines.map(l=>{
    const pad = l.d*1.1;
    return `<div class="ln${l.p?" p":""}${l.tb?" tb":""}" style="padding-left:${pad}em;text-indent:${l.d?-1:0}em">${linkRefs(highlight(l.t,needles), a.law)}</div>`;
  }).join("");
  $main.innerHTML = `
    <div class="card art">
      <div class="path">${esc(a.lawObj.name)}${a.path?" ／ "+esc(a.path):""}</div>
      <h1><span class="tag t-${a.law}">${LAWNAME[a.law]}</span>${esc(a.title)} ${a.cap?`<span class="cap">${esc(a.cap)}</span>`:""}</h1>
      ${lines}
      <div class="bar">
        <button class="btn${isFav?" pri":""}" id="fav">${isFav?"★ 保存済み":"☆ 保存"}</button>
        <button class="btn" id="share">共有</button>
        <a class="btn" href="${egov}" target="_blank" rel="noopener">e-Govで見る</a>
      </div>
      <div class="bar">
        ${prev?`<a class="btn" href="#a/${encodeURIComponent(prev.id)}">‹ ${esc(prev.title)}</a>`:""}
        ${next?`<a class="btn" href="#a/${encodeURIComponent(next.id)}">${esc(next.title)} ›</a>`:""}
      </div>
    </div>
    ${a.capInh?`<p class="note">見出し「${esc(a.cap)}」は直前の条の見出しを引き継いで表示しています。</p>`:""}`;
  document.getElementById("fav").onclick=()=>{ toggleFav(id); viewArticle(id); };
  document.getElementById("share").onclick=async()=>{
    const text = `${a.lawObj.name}\n${a.title}${a.cap?" "+a.cap:""}\n\n${a.body}`;
    if(navigator.share){ try{ await navigator.share({title:artLabel(a), text}); }catch(e){} }
    else { try{ await navigator.clipboard.writeText(text); alert("条文をコピーしました"); }catch(e){} }
  };
  window.scrollTo(0,0);
}

function viewToc(law){
  setTab("toc");
  const L = DATA.laws.find(l=>l.key===law) || DATA.laws[0];
  let h = `<div class="seg">${DATA.laws.map(l=>`<a href="#toc/${l.key}" class="${l.key===L.key?"on":""}">${LAWNAME[l.key]}</a>`).join("")}</div>`;
  let curPath = null;
  h += `<div class="card toc" style="padding:4px 0">`;
  for(const a of L.arts){
    if(a.path!==curPath){ curPath=a.path; if(a.path) h+=`<div class="toc-ch" style="padding:0 10px">${esc(a.path)}</div>`; }
    h += `<a href="#a/${encodeURIComponent(a.id)}&from=toc" class="${a.del?"del":""}"><span>${esc(a.title)}</span><span>${a.del?"削除":esc(a.cap)}</span></a>`;
  }
  h += `</div>`;
  $main.innerHTML = h;
  window.scrollTo(0,0);
}

function viewFav(){
  setTab("fav");
  const f = favs().map(id=>BYID[id]).filter(Boolean);
  $main.innerHTML = `<h2 class="sec">保存した条文（${f.length}）</h2>` +
    (f.length ? f.map(a=>artCard(a,[])).join("") : `<div class="empty">条文の画面で「☆ 保存」を押すとここに並びます。<br>保存はこのスマホの中だけに残ります。</div>`);
}

// ---------- まとめ（Markdown） ----------
function inlineMd(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>WBYTITLE[t]?`<a href="#w/${WBYTITLE[t].id}">${t}</a>`:t);
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return linkRefs(s, "法");
}
function renderMd(md){
  const L = md.split("\n"); let out="", i=0;
  while(i<L.length){
    const l=L[i];
    if(/^#{1,3} /.test(l)){ const n=l.match(/^#+/)[0].length; out+=`<h${n}>${inlineMd(l.slice(n+1))}</h${n}>`; i++; continue; }
    if(/^\|/.test(l)){
      const rows=[]; while(i<L.length && /^\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      out+="<table><tr>"+cells(rows[0]).map(c=>`<th>${inlineMd(c)}</th>`).join("")+"</tr>";
      rows.slice(2).forEach(r=>{ out+="<tr>"+cells(r).map(c=>`<td>${inlineMd(c)}</td>`).join("")+"</tr>"; });
      out+="</table>"; continue;
    }
    if(/^\s*[-*] /.test(l)){
      let html="", depth=-1;
      while(i<L.length && /^\s*[-*] /.test(L[i])){
        const d=Math.floor(L[i].match(/^\s*/)[0].length/2);
        while(depth<d){ html+="<ul>"; depth++; }
        while(depth>d){ html+="</ul>"; depth--; }
        html+=`<li>${inlineMd(L[i].replace(/^\s*[-*] /,""))}</li>`; i++;
      }
      while(depth>=0){ html+="</ul>"; depth--; }
      out+=html; continue;
    }
    if(l.trim()===""){ i++; continue; }
    const para=[]; while(i<L.length && L[i].trim() && !/^(#{1,3} |\||\s*[-*] )/.test(L[i])){ para.push(L[i]); i++; }
    out+=`<p>${inlineMd(para.join(""))}</p>`;
  }
  return out;
}
function viewWiki(id){
  setTab("wiki");
  const w = WIKI.find(x=>x.id===id) || WIKI[0];
  if(!w){ $main.innerHTML=`<div class="empty">まとめはまだありません</div>`; return; }
  $main.innerHTML = `<div class="seg">${WIKI.map(x=>`<a href="#w/${x.id}" class="${x.id===w.id?"on":""}" style="font-size:12px">${esc(x.title.replace(/（.*?）/,""))}</a>`).join("")}</div>
    <div class="card md">${renderMd(w.md)}</div>`;
  window.scrollTo(0,0);
}

// ---------- ルーティング ----------
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("q/")) return viewSearch(h.slice(2));
  if(h.startsWith("a/")) return viewArticle(h.slice(2).split("&")[0]);
  if(h.startsWith("toc")) return viewToc(h.split("/")[1]||"法");
  if(h.startsWith("w/")) return viewWiki(h.slice(2));
  if(h==="fav") return viewFav();
  $q.value=""; lastGroups=[]; viewHome();
}
document.getElementById("sf").onsubmit = e => {
  e.preventDefault(); const q=$q.value.trim(); if(!q) return;
  $q.blur();
  const target = "#q/"+encodeURIComponent(q);
  if(location.hash===target) route(); else location.hash=target;
};
document.querySelectorAll(".filters input").forEach(c=>c.onchange=()=>{
  LS.set("lp-filters",[...document.querySelectorAll(".filters input")].map(x=>x.checked));
  if(location.hash.startsWith("#q/")) route();
});
LS.get("lp-filters",[]).forEach((v,i)=>{ const el=document.querySelectorAll(".filters input")[i]; if(el) el.checked=v; });
window.addEventListener("hashchange", route);
route();
</script>
