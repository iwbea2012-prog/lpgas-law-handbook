域（指定都市の区域を除く。）内に設置されている消費設備についての液化石油ガス設備工事の作業に従事した液化石油ガス設備士に対し、指定都市の長は、その登録を受けた液化石油ガス販売事業者の供給設備又は当該指定都市の区域内に設置されている消費設備についての液化石油ガス設備工事の作業に従事した液化石油ガス設備士に対し、それぞれ液化石油ガス設備工事の作業の方法その他その作業に関する事項について報告をさせることができる。","p":1},{"d":0,"t":"４　法第八十二条第一項の規定により、経済産業大臣は、その登録を受けた液化石油ガス販売事業者の供給設備について特定液化石油ガス設備工事をした特定液化石油ガス設備工事事業者に対し、都道府県知事は、当該都道府県の区域（指定都市の区域を除く。以下この項において同じ。）内に事業所を有する特定液化石油ガス設備工事事業者又はその登録を受けた液化石油ガス販売事業者の供給設備若しくは当該都道府県の区域内に設置されている消費設備について特定液化石油ガス設備工事をした特定液化石油ガス設備工事事業者に対し、指定都市の長は、当該指定都市の区域内に事業所を有する特定液化石油ガス設備工事事業者又はその登録を受けた液化石油ガス販売事業者の供給設備若しくは当該指定都市の区域内に設置されている消費設備について特定液化石油ガス設備工事をした特定液化石油ガス設備工事事業者に対し、それぞれ特定液化石油ガス設備工事の施工の方法その他その業務に関する事項について報告をさせることができる。","p":1},{"d":0,"t":"５　法第八十二条第一項の規定により、経済産業大臣は、液化石油ガス器具等の製造又は輸入の事業を行う者（届出事業者を除く。）に対し、その製造又は輸入に係る液化石油ガス器具等の種類、数量、製造又は保管若しくは販売の場所、検査記録の内容、主たる販売先並びに当該液化石油ガス器具等の使用に伴い発生した災害及びその再発の防止のために講じた措置に関する事項その他当該液化石油ガス器具等の製造又は輸入の業務に関する事項について報告をさせることができる。","p":1},{"d":0,"t":"６　法第八十二条第一項の規定により、経済産業大臣は、液化石油ガス器具等の販売の事業を行う者に対し、その販売に係る液化石油ガス器具等の種類、数量、保管又は販売の場所、購入先及び主たる販売先に関する事項その他当該液化石油ガス器具等の販売の業務に関する事項について報告をさせることができる。","p":1},{"d":0,"t":"７　法第八十二条第一項の規定により、経済産業大臣は、届出事業者に対し、その製造又は輸入に係る液化石油ガス器具等の型式、数量、製造又は保管若しくは販売の場所、検査記録の内容、主たる販売先並びに当該液化石油ガス器具等の使用に伴い発生した災害及びその再発の防止のために講じた措置に関する事項その他当該液化石油ガス器具等の製造又は輸入の業務に関する事項（特定輸入事業者である届出事業者にあつては、その国内管理人に関する事項を含む。）について報告をさせることができる。","p":1},{"d":0,"t":"８　法第八十二条第一項の規定により、経済産業大臣は、特定輸入事業者である届出事業者の国内管理人に対し、当該届出事業者の輸入に係る液化石油ガス器具等の検査記録の写しの内容その他当該国内管理人の業務に関する事項並びに当該液化石油ガス器具等の型式、数量、製造又は保管若しくは販売の場所、検査記録の内容、主たる販売先並びに当該液化石油ガス器具等の使用に伴い発生した災害及びその再発の防止のために講じた措置に関する事項その他当該液化石油ガス器具等の輸入の業務に関する届出事業者の業務に関する事項について報告をさせることができる。","p":1},{"d":0,"t":"９　法第八十二条第二項の規定により、都道府県知事又は指定都市の長は、それぞれその許可を受けた充てん事業者に対し、充てん設備、充塡の方法その他その業務に関する事項について報告をさせることができる。","p":1}],"del":false},{"id":"令-14","law":"令","num":"14","title":"第十四条","cap":"（関係行政機関への通報等）","capInh":false,"path":"","lines":[{"d":0,"t":"法第八十七条第一項の規定により、次の表の上欄に掲げる者は、同表の中欄に掲げる登録若しくは許可をし、届出を受理し、又は登録若しくは許可の取消しをしたときは、その旨をそれぞれ同表の下欄に掲げる者に通報しなければならない。","p":1},{"d":1,"t":"経済産業大臣｜法第三条第一項の登録、法第八条の規定による届出（法第三条第二項第二号及び第三号の事項の変更に係るものに限る。）、法第二十三条の規定による届出又は法第二十五条若しくは第二十六条の規定による登録の取消し｜当該登録、届出又は登録の取消しに係る者の販売所の所在地を管轄する都道府県知事（指定都市の区域内にあつては、指定都市の長）","tb":1},{"d":1,"t":"法第三条第一項の登録、法第八条の規定による届出（法第三条第二項第二号及び第三号の事項の変更に係るものであつて、販売所の新設に係るものに限る。）、法第二十三条の規定による届出又は法第二十六条の規定による登録の取消し｜国家公安委員会","tb":1},{"d":1,"t":"法第三条第一項の登録、法第六条の規定による届出、法第八条の規定による届出（法第三条第二項第二号、第三号及び第四号（法第二十七条第一項第四号に掲げる保安業務に係るものに限る。）の事項の変更に係るものに限る。）、法第十条第三項の規定による届出（同条第二項に規定する場合に係るものに限る。）、法第二十三条の規定による届出又は法第二十五条若しくは第二十六条の規定による登録の取消し｜消防庁長官","tb":1},{"d":1,"t":"都道府県知事又は指定都市の長｜法第三条第一項の登録、法第八条の規定による届出（法第三条第二項第二号及び第三号の事項の変更に係るものであつて、販売所の新設に係るものに限る。）、法第二十三条の規定による届出又は法第二十六条の規定による登録の取消し｜当該都道府県知事が所轄する都道府県公安委員会（指定都市の長にあつては、当該指定都市の区域を管轄する都道府県公安委員会）","tb":1},{"d":1,"t":"法第三条第一項の登録、法第三十六条第一項、第三十七条の二第一項（法第三十七条の四第三項において準用する場合を含む。）若しくは第三十七条の四第一項の許可、法第六条の規定による届出、法第八条の規定による届出（法第三条第二項第二号、第三号及び第四号（法第二十七条第一項第四号に掲げる保安業務に係るものに限る。）の事項の変更に係るものに限る。）、法第二十三条、第三十七条の二第二項（法第三十七条の四第三項において準用する場合を含む。この項の下欄において同じ。）若しくは第三十八条の三の規定による届出、法第二十五条若しくは第二十六条の規定による登録の取消し又は法第三十七条の七第一項の規定による許可の取消し｜当該登録、届出（法第三十七条の二第二項及び第三十八条の三の規定によるものを除く。）若しくは登録の取消しに係る者の販売所、当該許可、届出（法第三十七条の二第二項の規定によるものに限る。）若しくは許可の取消しに係る貯蔵施設、特定供給設備若しくは充てん設備又は当該届出（法第三十八条の三の規定によるものに限る。）に係る施設若しくは建築物の所在地を管轄する消防長（消防本部を置かない市町村にあつては、市町村長。以下同じ。）","tb":1},{"d":1,"t":"都道府県知事｜法第三条第一項の登録、法第八条の規定による届出（法第三条第二項第二号及び第三号の事項の変更に係るものに限る。）、法第二十三条の規定による届出又は法第二十五条若しくは第二十六条の規定による登録の取消し｜当該登録、届出又は登録の取消しに係る者の販売所の所在地を管轄する指定都市の長","tb":1}],"del":false},{"id":"令-15","law":"令","num":"15","title":"第十五条","cap":"（関係行政機関への通報等）","capInh":true,"path":"","lines":[{"d":0,"t":"法第八十七条第二項の規定による要請は、消防庁長官は経済産業大臣に対し、消防長は当該消防長の管轄区域を管轄する都道府県知事（指定都市の区域内にあつては、指定都市の長）に対してするものとする。","p":1}],"del":false},{"id":"令-16","law":"令","num":"16","title":"第十六条","cap":"（都道府県又は市が処理する事務）","capInh":false,"path":"","lines":[{"d":0,"t":"法第十六条の二第二項に規定する経済産業大臣の権限に属する事務は、供給設備を液化石油ガス販売事業の用に供する販売所の所在地を管轄する都道府県知事（指定都市の区域内にあつては、指定都市の長。次項から第六項までにおいて同じ。）が行うこととする。","p":1},{"d":0,"t":"２　法第八十二条第一項に規定する経済産業大臣の権限に属する事務であつて、液化石油ガス販売事業者の販売所に関するものは、当該販売所の所在地を管轄する都道府県知事が行うこととする。ただし、経済産業大臣が自らその事務を行うことを妨げない。","p":1},{"d":0,"t":"３　法第八十三条第一項に規定する経済産業大臣の権限に属する事務であつて、液化石油ガス販売事業者の販売所に関するものは、当該販売所の所在地を管轄する都道府県知事が行うこととする。ただし、経済産業大臣がその登録を受けた液化石油ガス販売事業者の販売所に関するものを自ら行うことを妨げない。","p":1},{"d":0,"t":"４　法第八十二条第一項及び第八十三条第二項に規定する経済産業大臣の権限に属する事務であつて、保安機関の事務所又は事業所に関するものは、当該保安機関の事務所又は事業所の所在地を管轄する都道府県知事が行うこととする。ただし、経済産業大臣が自らその事務を行うことを妨げない。","p":1},{"d":0,"t":"５　法第八十二条第一項に規定する経済産業大臣の権限に属する事務であつて、液化石油ガス設備士に関するものは、当該液化石油ガス設備士がその作業に従事した液化石油ガス設備工事に係る供給設備を液化石油ガス販売事業の用に供する販売所の所在地を管轄する都道府県知事が行うこととする。ただし、経済産業大臣が自らその事務を行うことを妨げない。","p":1},{"d":0,"t":"６　法第八十二条第一項に規定する経済産業大臣の権限に属する事務であつて、特定液化石油ガス設備工事事業者に関するものは、当該特定液化石油ガス設備工事事業者が特定液化石油ガス設備工事をした供給設備を液化石油ガス販売事業の用に供する販売所の所在地を管轄する都道府県知事が行うこととする。ただし、経済産業大臣が自らその事務を行うことを妨げない。","p":1},{"d":0,"t":"７　法第八十二条第一項、第八十三条第一項及び第八十三条の二第一項に規定する経済産業大臣の権限に属する事務であつて、液化石油ガス器具等の販売の事業を行う者に関するもの（以下この条において「立入検査等事務」という。）は、次の各号に掲げる場合の区分に応じ、当該各号に定める者が行うこととする。ただし、経済産業大臣が自らその事務を行うことを妨げない。","p":1},{"d":1,"t":"一　当該事務所、営業所、液化石油ガス器具等の保管場所その他その業務を行う場所が市の区域に属する場合　当該市の長（当該市の長の要請があり、かつ、当該市を包括する都道府県の知事が必要があると認める場合には、当該都道府県知事及び当該市長）"},{"d":1,"t":"二　当該事務所、営業所、液化石油ガス器具等の保管場所その他その業務を行う場所が町村の区域に属する場合　当該町村を包括する都道府県の知事"},{"d":0,"t":"８　前各項の規定により当該各項に規定する事務を行つた都道府県知事又は市長は、経済産業省令で定めるところにより、その結果を経済産業大臣に報告しなければならない。","p":1},{"d":0,"t":"９　第一項、第二項本文、第三項本文、第四項本文、第五項本文及び第六項本文の場合においては、法中第一項、第二項本文、第三項本文、第四項本文、第五項本文及び第六項本文に規定する事務に係る経済産業大臣に関する規定は、都道府県知事又は指定都市の長に関する規定としてそれぞれ都道府県知事又は指定都市の長に適用があるものとする。","p":1},{"d":0,"t":"１０　第七項の規定により都道府県知事又は市長が立入検査等事務を行う場合においては、法中立入検査等事務に係る経済産業大臣に関する規定は、都道府県知事又は市長に関する規定としてそれぞれ都道府県知事又は市長に適用があるものとする。","p":1}],"del":false},{"id":"令-17","law":"令","num":"17","title":"第十七条","cap":"（権限の委任）","capInh":false,"path":"","lines":[{"d":0,"t":"法第三条第一項、第三条の二第三項、第六条、第八条、第十条第三項、第十四条第二項、第二十三条、第二十五条、第二十六条、第二十六条の二、第八十七条第一項及び第九十条第一項の規定に基づく経済産業大臣の権限であつて、販売所が一の経済産業局の管轄区域内のみに設置されている者に関するものは、当該販売所の所在地を管轄する経済産業局長及び産業保安監督部長が行うものとする。","p":1},{"d":0,"t":"２　法第十三条第二項、第十九条第二項、第二十一条第二項、第二十二条、第三十五条の六第一項、第三十五条の七、第三十五条の十及び第八十七条第二項並びに前条第八項の規定に基づく経済産業大臣の権限（前条第八項の規定に基づく権限にあつては、法第十六条の二第二項の規定に基づく権限の行使に係る場合におけるものに限る。）であつて、販売所が一の産業保安監督部の管轄区域内のみに設置されている者に関するものは、当該販売所の所在地を管轄する産業保安監督部長が行うものとする。","p":1},{"d":0,"t":"３　法第十六条第三項及び前条第八項の規定に基づく経済産業大臣の権限（前条第八項の規定に基づく権限にあつては、法第十六条の二第二項の規定に基づく権限の行使に係る場合におけるものを除く。）であつて、販売所が一の経済産業局又は産業保安監督部の管轄区域内のみに設置されている者に関するものは、それぞれ当該販売所の所在地を管轄する経済産業局長又は産業保安監督部長が行うものとする。","p":1},{"d":0,"t":"４　法第二十九条第一項、第三十三条第一項及び第二項、第三十四条第三項、第三十五条第一項及び第三項、第三十五条の二、第三十五条の三並びに第三十五条の四において準用する法第六条、第八条、第十条第三項、第二十三条及び第二十四条並びに前条第八項の規定に基づく経済産業大臣の権限であつて、一の産業保安監督部の管轄区域内のみに設置されている販売所の事業として販売される液化石油ガスの一般消費者等についての保安業務を行う者に関するものは、当該販売所の所在地を管轄する産業保安監督部長が行うものとする。","p":1},{"d":0,"t":"５　法第三十九条第二項第一号の規定に基づく経済産業大臣の権限であつて、液化石油ガス器具等の製造の事業に係る工場又は事業場が一の経済産業局の管轄区域内のみにある者に関するものは、当該工場又は事業場の所在地を管轄する経済産業局長が行うものとする。","p":1},{"d":0,"t":"６　法第三十九条第二項第一号の規定に基づく経済産業大臣の権限であつて、液化石油ガス器具等の輸入又は販売の事業に係る事務所又は営業所が一の経済産業局の管轄区域内のみにある者に関するものは、当該事務所又は営業所の所在地を管轄する経済産業局長が行うものとする。","p":1},{"d":0,"t":"７　法第四十一条、第四十二条第二項、第四十三条、第四十四条及び第四十六条第一項第一号の規定に基づく経済産業大臣の権限であつて、一の届出区分（法第四十一条に規定する経済産業省令で定める液化石油ガス器具等の区分をいう。次項から第十項までにおいて同じ。）に属する液化石油ガス器具等の製造の事業に係る工場又は事業場が一の経済産業局の管轄区域内のみにある届出事業者（法第四十一条第四号に規定する経済産業省令で定める要件に該当する者を除く。）に関するものは、当該工場又は事業場の所在地を管轄する経済産業局長が行うものとする。","p":1},{"d":0,"t":"８　法第四十一条、第四十二条第二項、第四十三条、第四十四条及び第四十六条第一項第一号の規定に基づく経済産業大臣の権限であつて、一の届出区分に属する液化石油ガス器具等の輸入の事業に係る事務所又は営業所が一の経済産業局の管轄区域内のみにある届出事業者（法第四十一条第四号に規定する経済産業省令で定める要件に該当する者を除く。）に関するものは、当該事務所又は営業所の所在地を管轄する経済産業局長が行うものとする。","p":1},{"d":0,"t":"９　法第四十一条、第四十二条第二項、第四十三条、第四十四条及び第四十六条第一項第一号の規定に基づく経済産業大臣の権限であつて、一の届出区分に属する液化石油ガス器具等の輸入の事業に係る国内管理人の事務所又は営業所が一の経済産業局の管轄区域内のみにある当該国内管理人に係る届出事業者に関するものは、当該国内管理人の事務所又は営業所の所在地を管轄する経済産業局長が行うものとする。","p":1},{"d":0,"t":"１０　法第四十一条、第四十二条第二項、第四十三条、第四十四条及び第四十六条第一項第一号の規定に基づく経済産業大臣の権限であつて、一の届出区分に属する液化石油ガス器具等の製造又は輸入の事業に係る本店又は主たる事務所が一の経済産業局の管轄区域内のみにある届出事業者（法第四十一条第四号に規定する経済産業省令で定める要件に該当する者に限る。）に関するものは、その本店又は主たる事務所の所在地を管轄する経済産業局長が行うものとする。","p":1},{"d":0,"t":"１１　法第四十九条、第五十条及び第九十条第一項の規定に基づく経済産業大臣の権限（法第九十条第一項の規定に基づく権限にあつては、法第五十条の規定に基づく権限の行使に係る場合におけるものに限る。）は、届出事業者の事務所、営業所、工場、液化石油ガス器具等の保管場所その他その業務を行う場所（特定輸入事業者である届出事業者にあつては、その国内管理人の事務所、営業所、液化石油ガス器具等の保管場所その他その業務を行う場所）を管轄する経済産業局長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1},{"d":0,"t":"１２　法第八十二条第一項及び第八十三条第一項の規定に基づく経済産業大臣の権限であつて、液化石油ガス販売事業者の販売所に関するものは、当該販売所の所在地を管轄する経済産業局長又は産業保安監督部長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1},{"d":0,"t":"１３　法第八十二条第一項及び第八十三条第二項の規定に基づく経済産業大臣の権限であつて、保安機関の事務所又は事業所に関するものは、当該保安機関の事務所又は事業所の所在地を管轄する産業保安監督部長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1},{"d":0,"t":"１４　法第八十二条第一項の規定に基づく経済産業大臣の権限であつて、液化石油ガス設備士に関するものは、当該液化石油ガス設備士がその作業に従事した液化石油ガス設備工事に係る供給設備を液化石油ガス販売事業の用に供する販売所の所在地を管轄する産業保安監督部長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1},{"d":0,"t":"１５　法第八十二条第一項の規定に基づく経済産業大臣の権限であつて、特定液化石油ガス設備工事事業者に関するものは、当該特定液化石油ガス設備工事事業者が特定液化石油ガス設備工事をした供給設備を液化石油ガス販売事業の用に供する販売所の所在地を管轄する産業保安監督部長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1},{"d":0,"t":"１６　法第八十二条第一項、第八十三条第一項及び第八十三条の二第一項の規定に基づく経済産業大臣の権限であつて、液化石油ガス器具等の製造又は輸入の事業を行う者（特定輸入事業者である届出事業者を除く。）に関するものは、当該事務所、営業所、工場、液化石油ガス器具等の保管場所その他その業務を行う場所を管轄する経済産業局長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1},{"d":0,"t":"１７　法第八十二条第一項、第八十三条第一項及び第八十三条の二第一項の規定に基づく経済産業大臣の権限であつて、特定輸入事業者である届出事業者及びその国内管理人に関するものは、当該国内管理人の事務所、営業所、液化石油ガス器具等の保管場所その他その業務を行う場所を管轄する経済産業局長が行うものとする。ただし、経済産業大臣が自らその権限を行うことを妨げない。","p":1}],"del":false}]},{"key":"規則","id":"409M50000400011","name":"同 施行規則","arts":[{"id":"規則-1","law":"規則","num":"1","title":"第一条","cap":"（定義）","capInh":false,"path":"第一章　総則","lines":[{"d":0,"t":"この規則において使用する用語は、液化石油ガスの保安の確保及び取引の適正化に関する法律（昭和四十二年法律第百四十九号。以下「法」という。）において使用する用語の例による。","p":1},{"d":0,"t":"２　この規則において次の各号に掲げる用語の意義は、それぞれ当該各号に定めるところによる。","p":1},{"d":1,"t":"一　貯槽　液化石油ガスの貯蔵設備であって、地盤面に対して移動することができないもの（次号に掲げるものを除く。）"},{"d":1,"t":"二　バルク貯槽　第十九条第三号イ及びハ（１）から（８）まで又は第五十四条第二号イ及びホ（第十九条第三号ハ（１）から（８）までに係る部分に限る。）に規定する技術上の基準に適合するものであって、地盤面に対して移動することができないもの"},{"d":1,"t":"三　容器　高圧ガス保安法（昭和二十六年法律第二百四号）第四十一条第一項に規定するもの"},{"d":1,"t":"四　バルク容器　容器保安規則（昭和四十一年通商産業省令第五十号）第二条第二号に規定する溶接容器であって、第十九条第一号イからトまで又は第五十四条第一号（第十九条第二号ホ（第一号イからトまでに係る部分に限る。）に係る部分に限る。）に規定する技術上の基準に適合するもの"},{"d":1,"t":"五　貯蔵能力　貯蔵設備に貯蔵することができる液化石油ガスの数量であって、貯蔵設備が貯槽にあっては次のイの算式により、バルク貯槽にあっては次のロの算式（地盤面下に設置するものであって、内容積が二千リットル以上のものにあっては次のイの算式）により、容器である場合にあっては次のハの算式により得られたもの"},{"d":2,"t":"イ　Ｗ＝０．９ｗＶ"},{"d":2,"t":"ロ　Ｗ＝０．８５ｗＶ"},{"d":2,"t":"ハ　Ｗ＝Ｖ／Ｃ"},{"d":3,"t":"これらの式においては、Ｗ、ｗ、Ｖ及びＣは、それぞれ次の数値を表すものとする。"},{"d":3,"t":"Ｗ　貯蔵設備の貯蔵能力（単位　キログラム）の数値"},{"d":3,"t":"ｗ　貯槽又はバルク貯槽の常用の温度における液化石油ガスの比重の数値"},{"d":3,"t":"Ｖ　貯蔵設備の内容積（単位　リットル）の数値"},{"d":3,"t":"Ｃ　容器保安規則第二十二条に規定する定数"},{"d":1,"t":"六　第一種保安物件　次のイからチまでに掲げるもの"},{"d":2,"t":"イ　学校教育法（昭和二十二年法律第二十六号）第一条に定める学校のうち、小学校、中学校、義務教育学校、高等学校、中等教育学校、高等専門学校、特別支援学校又は幼稚園"},{"d":2,"t":"ロ　医療法（昭和二十三年法律第二百五号）第一条の五第一項に定める病院"},{"d":2,"t":"ハ　劇場、映画館、演芸場、公会堂その他これらに類する施設であって、収容定員三百人以上のもの"},{"d":2,"t":"ニ　児童福祉法（昭和二十二年法律第百六十四号）第七条の児童福祉施設、身体障害者福祉法（昭和二十四年法律第二百八十三号）第五条第一項の身体障害者社会参加支援施設、生活保護法（昭和二十五年法律第百四十四号）第三十八条第一項の保護施設（授産施設及び宿所提供施設を除く。）、老人福祉法（昭和三十八年法律第百三十三号）第五条の三の老人福祉施設若しくは同法第二十九条第一項の有料老人ホーム、母子及び父子並びに寡婦福祉法（昭和三十九年法律第百二十九号）第三十九条第一項の母子・父子福祉施設、職業能力開発促進法（昭和四十四年法律第六十四号）第十五条の七第一項第五号の障害者職業能力開発校、地域における医療及び介護の総合的な確保の促進に関する法律（平成元年法律第六十四号）第二条第四項（第四号を除く。）の特定民間施設、介護保険法（平成九年法律第百二十三号）第八条第二十八項の介護老人保健施設又は障害者の日常生活及び社会生活を総合的に支援するための法律（平成十七年法律第百二十三号）第五条第一項の障害福祉サービス事業（同条第七項の生活介護、同条第十二項の自立訓練、同条第十三項の就労選択支援、同条第十四項の就労移行支援又は同条第十五項の就労継続支援に限る。）を行う施設、同条第十一項の障害者支援施設、同条第二十八項の地域活動支援センター若しくは同条第二十九項の福祉ホームであって、収容定員二十人以上のもの"},{"d":2,"t":"ホ　文化財保護法（昭和二十五年法律第二百十四号）の規定によって重要文化財、重要有形民俗文化財、史跡名勝天然記念物若しくは重要な文化財として指定され、又は旧重要美術品等の保存に関する法律（昭和八年法律第四十三号）の規定によって重要美術品として認定された建築物"},{"d":2,"t":"ヘ　博物館法（昭和二十六年法律第二百八十五号）第二条に定める博物館及び同法第二十九条により博物館に相当する施設として指定された施設"},{"d":2,"t":"ト　一日に平均二万人以上の者が乗降する駅の母屋及びプラットホーム"},{"d":2,"t":"チ　百貨店、マーケット、公衆浴場、ホテル、旅館その他不特定かつ多数の者を収容することを目的とする建築物（仮設建築物を除く。）であって、その用途に供する部分の床面積の合計が千平方メートル以上のもの"},{"d":1,"t":"七　第二種保安物件　第一種保安物件以外の建築物であって、住居の用に供するもの（販売所の存する敷地と同一敷地内にあるものを除く。）"},{"d":1,"t":"八　第一種施設距離　次の図における貯蔵施設の面積（単位　平方メートル）に対応する距離（単位　メートル）であって、ｌ１によって表されるもの"},{"d":1,"t":"九　第二種施設距離　前号の図における貯蔵施設の面積（単位　平方メートル）に対応する距離（単位　メートル）であって、ｌ２によって表されるもの"},{"d":1,"t":"十　充てん容器　現に液化石油ガス（液化石油ガスが充てんされた後に当該ガスの質量が充てん時における質量の二分の一以上減少していないものに限る。）を充てんしてある容器"},{"d":1,"t":"十一　残ガス容器　現に液化石油ガスを充てんしてある容器であって、充てん容器以外のもの"},{"d":1,"t":"十二　バルク供給　バルク容器又はバルク貯槽に法第三十七条の四第一項に規定する充てん設備から直接液化石油ガスを充てんすることにより液化石油ガスを供給すること"}],"del":false},{"id":"規則-2","law":"規則","num":"2","title":"第二条","cap":"（経済産業省令で定める施設）","capInh":false,"path":"第一章　総則","lines":[{"d":0,"t":"液化石油ガスの保安の確保及び取引の適正化に関する法律施行令（昭和四十三年政令第十四号。以下「令」という。）第二条第一号の経済産業省令で定める施設は、鉄道車両及び航空機とする。","p":1}],"del":false},{"id":"規則-3","law":"規則","num":"3","title":"第三条","cap":"（供給設備）","capInh":false,"path":"第一章　総則","lines":[{"d":0,"t":"法第二条第四項の経済産業省令で定める供給設備は、貯蔵設備、気化装置、調整器及びガスメーター並びにこれらに準ずる設備（貯蔵設備とガスメーターの間に設けられるものに限る。）並びにこれらを接続する管（以下「供給管」という。）並びにこれらの設備に係る屋根、遮へい板及び障壁とする。","p":1}],"del":false},{"id":"規則-4","law":"規則","num":"4","title":"第四条","cap":"（販売事業の登録申請等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第三条第二項の規定により同条第一項の登録の申請をしようとする者は、次の表の上欄の区分に従い、それぞれ同表の下欄に掲げる者に様式第一による申請書を提出しなければならない。","p":1},{"d":1,"t":"申請者の区分｜申請書の提出先","tb":1},{"d":1,"t":"一の指定都市（地方自治法（昭和二十二年法律第六十七号）第二百五十二条の十九第一項に規定する指定都市をいう。以下同じ。）の区域内にのみ販売所を設置して液化石油ガス販売事業を行おうとする者｜当該販売所の所在地を管轄する指定都市の長","tb":1},{"d":1,"t":"一の都道府県の区域内にのみ販売所を設置して液化石油ガス販売事業を行おうとする者（一の指定都市の区域内にのみ販売所を設置して液化石油ガス販売事業を行おうとする者を除く。）｜当該販売所の所在地を管轄する都道府県知事","tb":1},{"d":1,"t":"一の経済産業局の管轄区域内であって二以上の都道府県の区域内に販売所を設置して液化石油ガス販売事業を行おうとする者｜当該販売所の所在地を管轄する産業保安監督部長","tb":1},{"d":1,"t":"二以上の経済産業局の管轄区域内に販売所を設置して液化石油ガス販売事業を行おうとする者｜経済産業大臣","tb":1},{"d":0,"t":"２　法第三条第四項の経済産業省令で定める書類は、次のとおりとする。","p":1},{"d":1,"t":"一　貯蔵施設（貯蔵量が三千キログラム未満のものに限る。）の位置（他の施設との関係位置を含む。）及び構造並びに付近の状況を示す図面（法第十一条ただし書に定める場合を除く。）"},{"d":1,"t":"二　法第十一条ただし書に定める場合においては、その適合内容を証する書面"},{"d":1,"t":"三　販売予定地域、販売予定戸数及び販売予定数量"},{"d":1,"t":"四　液化石油ガスによる災害により支払うことのある損害賠償の支払能力を証する書面"},{"d":1,"t":"五　申請者が法人である場合は、その法人の定款及び登記事項証明書"},{"d":1,"t":"六　申請者（申請者が法人である場合は、その法人及びその法人の業務を行う役員）が法第四条第一項各号に該当しないことを誓約した書面"}],"del":false},{"id":"規則-5","law":"規則","num":"5","title":"第五条","cap":"（登録簿）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第三条の二第一項の規定により登録する登録番号は、経済産業大臣が定めるものとする。","p":1},{"d":0,"t":"２　法第三条の二第三項の規定により登録簿の謄本の交付又は閲覧を請求しようとする者は、様式第二による請求書によりするものとする。","p":1}],"del":false},{"id":"規則-5_2","law":"規則","num":"5_2","title":"第五条の二","cap":"（法第四条第一項第三号の経済産業省令で定める者）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第四条第一項第三号の経済産業省令で定める者は、精神の機能の障害により液化石油ガス販売事業を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない者とする。","p":1},{"d":0,"t":"２　法第三条第一項の登録を受けた者若しくは法人であってその業務を行う役員又は法定代理人若しくは同居の親族は、当該登録を受けた者又は法人であってその業務を行う役員が精神の機能の障害を有する状態となり、液化石油ガス販売事業の適切な実施が著しく困難となったときは、法第三条第一項の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長にその旨を届け出るものとする。この場合においては、その病名、障害の程度、病因、病後の経過、治癒の見込みその他参考となる所見を記載した医師の診断書を添付しなければならない。","p":1}],"del":false},{"id":"規則-6","law":"規則","num":"6","title":"第六条","cap":"（損害賠償を行うべき場合に備えてとるべき措置）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第四条第一項第五号の経済産業省令で定める基準は、次の各号の要件に適合する損害賠償責任保険契約を、保険業法（平成七年法律第百五号）に基づき責任保険を営むことができる者と締結していることとする。","p":1},{"d":1,"t":"一　その販売した液化石油ガスにより一般消費者等の生命、身体又は財産について生じた損害を賠償することによって生ずる損失を告示に定める額以上を限度額としててん補することを内容とするものであること。"},{"d":1,"t":"二　法令違反が原因の事故について補償が免責となっていないこと。"},{"d":1,"t":"三　保険期間中の保険金支払額に制限がないこと。"},{"d":1,"t":"四　その他告示に定める要件に適合すること。"}],"del":false},{"id":"規則-7","law":"規則","num":"7","title":"第七条","cap":"（登録行政庁の変更の場合の届出）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第六条の規定により登録行政庁の変更の届出をしようとする者は、様式第三による届書を従前の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1}],"del":false},{"id":"規則-8","law":"規則","num":"8","title":"第八条","cap":"（標識の掲示）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第七条の規定による標識の掲示は、様式第四によりするものとする。","p":1}],"del":false},{"id":"規則-8_2","law":"規則","num":"8_2","title":"第八条の二","cap":"（公衆の閲覧に供する措置を要しない場合）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第七条に規定する経済産業省令で定める場合は、次の各号のいずれかに該当する場合とする。","p":1},{"d":1,"t":"一　常時雇用する従業員の数が五人以下である場合"},{"d":1,"t":"二　自ら管理するウェブサイトを有していない場合"}],"del":false},{"id":"規則-8_3","law":"規則","num":"8_3","title":"第八条の三","cap":"（公衆の閲覧の方法）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第七条の規定による公衆の閲覧は、液化石油ガス販売事業者のウェブサイトへの掲載により行うものとする。","p":1}],"del":false},{"id":"規則-9","law":"規則","num":"9","title":"第九条","cap":"（販売所等の変更の届出）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第八条の規定により販売所等の変更の届出をしようとする者は、様式第五による届書を法第三条第一項の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。ただし、法第三条第二項第三号に定める事項を変更した者であって法第三十六条に規定する都道府県知事（指定都市の区域内にあっては、指定都市の長。第五章、第八十八条、第百十二条及び第百十四条において同じ。）の許可を受けたものは、この限りでない。","p":1},{"d":0,"t":"２　前項の届書には、貯蔵施設の変更をした者にあっては第四条第二項第一号に掲げる書類を、貯蔵施設を保有又は占有しない理由を変更した者にあっては第四条第二項第二号に掲げる書類を、液化石油ガスによる災害により支払うことのある損害賠償の支払能力を変更した者にあっては第四条第二項第四号に掲げる書類を添付しなければならない。","p":1}],"del":false},{"id":"規則-10","law":"規則","num":"10","title":"第十条","cap":"（承継の届出）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十条第三項の規定により液化石油ガス販売事業者の地位の承継の届出をしようとする者は、法第十条第二項各号のいずれかに該当する場合は当該各号に定める者（当該届出をしようとする者が当該承継により一の経済産業局の管轄区域内であって二以上の都道府県の区域内に販売所を有することとなった場合は、当該販売所の所在地を管轄する産業保安監督部長。以下この項において「新登録行政庁」という。）に様式第六による届書を、当該届出をしようとする者の登録をした都道府県知事又は指定都市の長及び当該承継に係る液化石油ガス販売事業について法第三条第一項の登録をした都道府県知事又は指定都市の長（これらの者が新登録行政庁である場合を除く。）に様式第七による届書を、その他の場合は当該承継に係る液化石油ガス販売事業について法第三条第一項の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に様式第六による届書を提出しなければならない。","p":1},{"d":0,"t":"２　前項の届書には、次の書面を添付しなければならない。","p":1},{"d":1,"t":"一　法第十条第一項の規定により液化石油ガス販売事業者の事業の全部を譲り受けて液化石油ガス販売事業者の地位を承継した者にあっては、様式第七の二による書面及び事業の全部の譲渡しがあったことを証する書面"},{"d":1,"t":"二　法第十条第一項の規定により液化石油ガス販売事業者の地位を承継した相続人であって、二以上の相続人の全員の同意により選定されたものにあっては、様式第八による書面及び戸籍謄本"},{"d":1,"t":"三　法第十条第一項の規定により液化石油ガス販売事業者の地位を承継した相続人であって、前号の相続人以外のものにあっては、様式第九による書面及び戸籍謄本"},{"d":1,"t":"四　法第十条第一項の規定により合併によって液化石油ガス販売事業者の地位を承継した法人にあっては、その法人の登記事項証明書"},{"d":1,"t":"五　法第十条第一項の規定により分割によって液化石油ガス販売事業者の地位を承継した法人にあっては、様式第九の二による書面、事業の全部の承継があったことを証する書面及びその法人の登記事項証明書"}],"del":false},{"id":"規則-11","law":"規則","num":"11","title":"第十一条","cap":"（貯蔵施設）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十一条の規定により、液化石油ガス販売事業者は、一般消費者等に販売する液化石油ガスを貯蔵するため、販売所ごとに面積三平方メートル以上の貯蔵施設を所有し、又は占有しなければならない。","p":1},{"d":0,"t":"２　法第十一条ただし書の経済産業省令で定める場合は、販売所ごとに次の各号の一に掲げる場合とする。","p":1},{"d":1,"t":"一　当該液化石油ガス販売事業者が高圧ガス保安法第五条第一項の許可を受けた者（以下「第一種製造者」という。）であって、同法第八条第一号の技術上の基準に適合する貯蔵施設を所有し、又は占有している場合"},{"d":1,"t":"二　当該液化石油ガス販売事業者が高圧ガス保安法第十六条に規定する第一種貯蔵所（以下「第一種貯蔵所」という。）を所有し、又は占有している場合"},{"d":1,"t":"三　容器に充てんされている液化石油ガスを一般消費者等に現に引き渡すことにより液化石油ガスを販売する場合において、充てん容器及び残ガス容器の保管、引渡し及び引取りを次に掲げる者に全量委託している場合"},{"d":2,"t":"イ　第一種製造者であって、高圧ガス保安法第八条第一号の技術上の基準に適合する貯蔵施設を所有し、又は占有している者"},{"d":2,"t":"ロ　第一種貯蔵所を所有し、又は占有している者"},{"d":1,"t":"四　当該液化石油ガス販売事業者が法第三十七条の四第一項の充てん設備により液化石油ガスの全量を販売する場合において、自らが充てん事業者となり、又は他の充てん事業者に委託することによりその全量を供給している場合"},{"d":1,"t":"五　法第三条の登録を受けた農業協同組合法（昭和二十二年法律第百三十二号）第三条第一項の農業協同組合、同条第二項の農業協同組合連合会又は中小企業等協同組合法（昭和二十四年法律第百八十一号）第三条の事業協同組合又は協同組合連合会が液化石油ガスの貯蔵施設を所有しており、組合員たる液化石油ガス販売事業者が常に当該組合の貯蔵施設より仕入れができる場合"},{"d":1,"t":"六　当該液化石油ガス販売事業者の販売所に近接して第一種製造者の所有又は占有する高圧ガス保安法第八条第一号の技術上の基準に適合する貯蔵施設がある場合であって、当該第一種製造者との間に資本的結合があり、常に液化石油ガスの仕入れができる場合"}],"del":false},{"id":"規則-12","law":"規則","num":"12","title":"第十二条","cap":"（経済産業省令で定める液化石油ガスの規格）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十三条の経済産業省令で定める液化石油ガスの規格は、次のとおりとする。この場合において、次の表の名称の欄に掲げる液化石油ガスは、供給設備に腐しょくを生ずるおそれのある濃度以上の水銀を含有していないものでなければならない。","p":1},{"d":1,"t":"名称｜プロパン及びプロピレンの合計量の含有率｜エタン及びエチレンの合計量の含有率｜ブタジエンの含有率","tb":1},{"d":1,"t":"い号液化石油ガス｜八十パーセント以上｜五パーセント以下｜〇・五パーセント以下","tb":1},{"d":1,"t":"ろ号液化石油ガス｜六十パーセント以上八十パーセント未満｜五パーセント以下｜〇・五パーセント以下","tb":1},{"d":1,"t":"は号液化石油ガス｜六十パーセント未満｜五パーセント以下｜〇・五パーセント以下","tb":1},{"d":1,"t":"備考一　圧力は、温度四十度において一・五三メガパスカル以下とする。二　含有率は、モル比によるものとする。","tb":1},{"d":0,"t":"２　前項に規定する規格について、経済産業大臣が供給設備及び消費設備の状況並びに周囲の状況等から判断して保安上支障がないと認めた場合においては、当該規定にかかわらず、経済産業大臣が認める規格をもって、当該規定に係る規格とする。","p":1}],"del":false},{"id":"規則-13","law":"規則","num":"13","title":"第十三条","cap":"（書面の記載事項等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十四条第一項第六号の経済産業省令で定める事項は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　一般消費者等が液化石油ガスを消費する場合の液化石油ガス販売事業者及び保安機関の責任に関する事項"},{"d":1,"t":"二　液化石油ガスを消費する場合の一般消費者等の責任に関する事項"},{"d":1,"t":"三　液化石油ガスの計量の方法"},{"d":1,"t":"四　第十六条第十三号ただし書の規定に基づき質量により販売した液化石油ガスであって消費されないものの引取りの方法"},{"d":1,"t":"五　液化石油ガスの価格の算定方法、算定の基礎となる項目及び算定の基礎となる項目についての内容の説明"},{"d":1,"t":"六　供給設備及び消費設備の所有関係"},{"d":1,"t":"七　供給設備及び消費設備の設置、変更、修繕及び撤去に要する費用の負担の方法"},{"d":1,"t":"八　液化石油ガス販売事業者の所有する消費設備を一般消費者等が利用する場合において、当該一般消費者等が支払うべき費用の額及び徴収方法（当該消費設備の所有権が液化石油ガス販売事業者にある場合に限る。）"},{"d":1,"t":"九　消費設備に係る配管について、液化石油ガスの販売契約解除時に液化石油ガス販売事業者から一般消費者等に所有権を移転する場合の精算額の計算方法（当該配管の所有権が液化石油ガス販売事業者にある場合に限る。）"},{"d":1,"t":"十　保安機関の名称、住所及び連絡方法"},{"d":0,"t":"２　法第十四条第三項の経済産業省令で定める方法は、次に掲げるものとする。","p":1},{"d":1,"t":"一　電子メールを送信する方法であって、一般消費者等が当該電子メールの記録を出力することによる書面を作成することができるもの"},{"d":1,"t":"二　液化石油ガス販売事業者の使用に係る電子計算機（入出力装置を含む。以下同じ。）に備えられたファイルに記録された法第十四条第一項各号に掲げる事項又は当該各項に掲げる事項に該当するものの変更の内容（以下この条において「契約締結時交付事項等」という。）を電気通信回線を通じて一般消費者等の閲覧に供する方法（一般消費者等が当該ファイルの記録を出力することによる書面を作成することができない場合にあっては、当該ファイルに記録された契約締結時交付事項等を電気通信回線を通じて一般消費者等の閲覧に供する方法であって、当該ファイルに記録された契約締結時交付事項等を、その記録された日から起算して三月間、消去し、又は改変できないもの）"},{"d":1,"t":"三　電磁的記録媒体（電磁的記録に係る記録媒体をいう。以下同じ。）に契約締結時交付事項等を記録したものを交付する方法"},{"d":0,"t":"３　液化石油ガス販売事業者は、法第十四条第一項の規定により、前項各号に掲げる方法により契約締結時交付事項等を提供した場合においても、相手方からの求めがあったときは、その者に対し、契約締結時交付事項等を記載した書面を交付しなければならない。","p":1}],"del":false},{"id":"規則-13_2","law":"規則","num":"13_2","title":"第十三条の二","cap":"（一般消費者等に対して示すべき電磁的方法の種類及び内容）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"令第六条第一項の規定により示すべき電磁的方法の種類及び内容は、次に掲げるものとする。","p":1},{"d":1,"t":"一　第十三条第二項各号に掲げる方法のうち、液化石油ガス販売事業者が使用するもの"},{"d":1,"t":"二　ファイルへの記録の方法"}],"del":false},{"id":"規則-13_3","law":"規則","num":"13_3","title":"第十三条の三","cap":"（液化石油ガス販売事業者による情報通信の技術を利用した承諾の取得）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"令第六条第一項に規定する電子情報処理組織を利用する方法その他の情報通信の技術を利用する方法であって経済産業省令で定めるものは、次に掲げるものとする。","p":1},{"d":1,"t":"一　電子メールを送信する方法であって、液化石油ガス販売事業者が当該電子メールの記録を出力することによる書面を作成することができるもの"},{"d":1,"t":"二　液化石油ガス販売事業者の使用に係る電子計算機に備えられたファイルに記録された一般消費者等の承諾に関する事項を電気通信回線を通じて一般消費者等の閲覧に供し、当該液化石油ガス販売事業者の使用に係る電子計算機に備えられたファイルに当該一般消費者等の承諾に関する事項を記録する方法"},{"d":1,"t":"三　電磁的記録媒体に一般消費者等の承諾に関する事項を記録したものを得る方法"}],"del":false},{"id":"規則-14","law":"規則","num":"14","title":"第十四条","cap":"（貯蔵施設の技術上の基準）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十六条第一項の貯蔵施設の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　貯蔵施設は、明示され、かつ、その外部から見やすいように警戒標を掲げたものであること。"},{"d":1,"t":"二　貯蔵施設（次の表に掲げるものを除く。）は、その外面から、第一種保安物件に対し第一種施設距離以上、第二種保安物件に対し第二種施設距離以上の距離を有すること。"},{"d":2,"t":"貯蔵施設の区分｜貯蔵施設の外面から最も近い第一種保安物件までの距離｜貯蔵施設の外面から最も近い第二種保安物件までの距離","tb":1},{"d":2,"t":"貯蔵施設｜　｜　","tb":1},{"d":2,"t":"（イ）｜ｌ１以上｜ｌ４以上ｌ２未満","tb":1},{"d":2,"t":"（ロ）｜ｌ３以上ｌ１未満｜ｌ４以上","tb":1},{"d":2,"t":"備考　ｌ１、ｌ２、ｌ３及びｌ４は、それぞれ第一条第二項第八号に規定するｌ１、ｌ２、ｌ３及びｌ４を表すものとする。","tb":1},{"d":1,"t":"三　前号の表に掲げる貯蔵施設（イ）及び（ロ）には、第一種施設距離内にある第一種保安物件又は第二種施設距離内にある第二種保安物件に対し厚さ十二センチメートル以上の鉄筋コンクリート造り又はこれと同等以上の強度を有する障壁（以下「鉄筋コンクリート障壁等」という。）を設けること。"},{"d":1,"t":"四　充てん容器に係る貯蔵施設には、不燃性又は難燃性の材料を使用した軽量な屋根を設けること。"},{"d":1,"t":"五　貯蔵施設は、液化石油ガスが漏えいしたときに滞留しないような構造とすること。"},{"d":1,"t":"六　貯蔵施設には、消火設備を設けること。"}],"del":false},{"id":"規則-15","law":"規則","num":"15","title":"第十五条","cap":"（経済産業省令で定める貯蔵施設の貯蔵量）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十六条第一項の経済産業省令で定める量は、三千キログラムとする。","p":1}],"del":false},{"id":"規則-16","law":"規則","num":"16","title":"第十六条","cap":"（販売の方法の基準）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十六条第二項の経済産業省令で定める販売の方法の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　充てん容器を供給管若しくは配管又は集合装置に接続するときは、外面に容器の使用上支障のある腐しょく、割れ、すじ、しわ等がなく、かつ、液化石油ガスが漏えいしていないものをもってすること。"},{"d":1,"t":"二　充てん容器を供給管若しくは配管又は集合装置に接続するときは、高圧ガス保安法第四十八条第一項第五号の期間（同条第五項の許可に係る充てん容器にあっては、同項の規定により条件として付された期間。以下「充てん期間」という。）を六月以上経過していないものであり、かつ、その旨を明示したものをもってすること。"},{"d":1,"t":"三　充てん容器は、供給管若しくは配管又は集合装置に接続すること。ただし、次のいずれかに該当する場合は、この限りでない。"},{"d":2,"t":"イ　屋外において移動して使用される消費設備により液化石油ガスを消費する一般消費者等に販売する場合"},{"d":2,"t":"ロ　調整器が接続された内容積が八リットル以下の容器に充てんされた液化石油ガスを販売する場合"},{"d":2,"t":"ハ　内容積が二十五リットル以下の容器であって、カップリング付容器用弁を有するものに充てんされた液化石油ガスを販売する場合"},{"d":1,"t":"四　充てん容器及び残ガス容器（以下「充てん容器等」という。）を交換するとき（当該充てん容器等に係る消費設備の数が一である場合に限る。）は、液化石油ガスの供給が中断することにより使用中の燃焼器から液化石油ガスが漏えいすることのないよう末端ガス栓を閉止する等の措置を講じてすること。ただし、一般消費者等への液化石油ガスの供給を中断することなく充てん容器等の交換を行うことができる設備を設けている場合は、この限りでない。"},{"d":1,"t":"五　充てん容器等であって供給管若しくは配管又は集合装置に接続されていないものは、充てん容器及び残ガス容器にそれぞれ区分して貯蔵施設に置くこと。"},{"d":1,"t":"六　貯蔵施設には、充てん容器等及び計量器等作業に必要な物以外の物を置かないこと。"},{"d":1,"t":"七　貯蔵施設の周囲二メートル以内には、火気又は引火性若しくは発火性の物を置かないこと。ただし、貯蔵施設に厚さ九センチメートル以上の鉄筋コンクリート造り又はこれと同等以上の強度を有する障壁を設けた場合は、この限りでない。"},{"d":1,"t":"八　貯蔵施設に置かれる充てん容器等は、常に温度四十度以下に保つこと。"},{"d":1,"t":"九　貯蔵施設に置かれる充てん容器等（内容積が五リットル以下のものを除く。）には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしないこと。"},{"d":1,"t":"十　貯蔵施設には、携帯電灯以外の灯火を携えて立ち入らないこと。"},{"d":1,"t":"十一　液化石油ガス販売事業者の所有する消費設備を一般消費者等が利用する場合は、液化石油ガスの供給開始時までに、当該消費設備が液化石油ガス販売事業者の所有する設備であることを当該一般消費者等に確認すること。（当該消費設備の所有権が液化石油ガス販売事業者にある場合に限る。）"},{"d":1,"t":"十二　液化石油ガスの引渡しは、一般消費者等の継続的消費に支障を生じないよう遅滞なくすること。"},{"d":1,"t":"十三　液化石油ガスは、計量法（平成四年法律第五十一号）に規定する法定計量単位による体積により販売すること。ただし、内容積が二十リットル以下の容器により販売する場合、第三号ただし書に規定する場合、経済産業大臣が次条の規定により配管に接続することなく充てん容器を引き渡すことを認めた場合又は一般消費者等に対する液化石油ガスの販売であって、その販売が高圧ガス保安法の適用を受ける高圧ガスの販売と不可分なものとして行われるもの若しくは特別の事情により一定期間経過後行われなくなることが明らかであると認められるものである場合は、計量法に規定する法定計量単位による質量により販売することができる。"},{"d":1,"t":"十四　削除"},{"d":1,"t":"十五　第十三号ただし書の規定に基づき質量により販売した液化石油ガスであって消費されないものは、一般消費者等の不在その他やむを得ない事情がある場合を除き一般消費者等の立会いの下に質量により計り、その質量に応じた適正な価格で引き取ること。"},{"d":1,"t":"十五の二　液化石油ガスの販売契約を締結しようとする一般消費者等と消費設備が設置された又は設置される施設又は建築物の所有者とが異なる場合において、当該一般消費者等と当該施設又は建築物の所有者等との間で賃貸借契約が締結される前に、当該一般消費者等に対し、直接液化石油ガスの供給に係る料金表等を提示し、又は当該施設又は建築物の所有者等を通じて当該料金表等を提示するよう努めること。"},{"d":1,"t":"十五の三　液化石油ガスの販売契約を締結しようとする一般消費者等と消費設備が設置された又は設置される施設又は建築物の所有者とが異なる場合において、当該一般消費者等と液化石油ガスの販売契約を自己と締結させることを目的として、当該施設又は建築物の所有者等に対し、正常な商慣習を超えた利益を供与しないこと。"},{"d":1,"t":"十五の四　液化石油ガスの販売契約を締結しようとする一般消費者等と消費設備が設置された又は設置される施設又は建築物の所有者とが同一である場合において、当該一般消費者等と液化石油ガスの販売契約を自己と締結させることを目的として、当該一般消費者等に対し、正常な商慣習を超えた利益を供与しないこと。"},{"d":1,"t":"十五の五　液化石油ガスの販売契約を締結しようとする一般消費者等と消費設備が設置された又は設置される施設又は建築物の所有者とが異なる場合において、当該施設又は建築物の所有者等との間で、当該施設又は建築物の入居者である一般消費者等が液化石油ガス販売事業者を変更することを制限するような条件を付した貸与契約等を締結しないこと。"},{"d":1,"t":"十五の六　液化石油ガスの販売契約を締結しようとする一般消費者等と消費設備が設置された又は設置される施設又は建築物の所有者とが同一である場合において、当該一般消費者等との間で、液化石油ガス販売事業者を変更することを制限するような条件を付した液化石油ガスの販売契約等を締結しないこと。"},{"d":1,"t":"十五の七　一般消費者等に対して液化石油ガスの供給に係る料金その他の一般消費者等の負担となる費用を請求するときは、当該費用を当該一般消費者等が消費した液化石油ガスの量にかかわらず生ずる費用及び当該量に応じて生ずる費用並びに消費設備の貸与等に係る費用に整理し、その料金その他の一般消費者等の負担となる費用の算定根拠を通知すること。"},{"d":1,"t":"十五の八　一般消費者等に対し、消費設備に係る配管及び液化石油ガス器具等の設置等に係る費用以外の費用を消費設備の貸与等に係る費用として請求しないこと。"},{"d":1,"t":"十五の九　液化石油ガスの販売契約を締結している一般消費者等と消費設備が設置された施設又は建築物の所有者とが異なる場合において、液化石油ガスの販売契約を締結している一般消費者等に対し液化石油ガスの供給に係る料金を請求するときは、当該施設又は建築物の所有者が本来負担すべき消費設備の貸与等に係る費用を請求しないこと。ただし、液化石油ガス販売事業者と当該一般消費者等との間で消費設備の貸与等に係る費用の負担方法について合意がある場合は、この限りでない。"},{"d":1,"t":"十五の十　新たに一般消費者等に対し液化石油ガスを供給する場合において、当該一般消費者等に液化石油ガスを供給する他の液化石油ガス販売事業者の所有する供給設備が既に設置されているときは、一般消費者等から当該液化石油ガス販売事業者に対して液化石油ガス販売契約の解除の申し出があってから相当期間が経過するまでは、当該供給設備を撤去しないこと。ただし、当該供給設備を撤去することについて当該液化石油ガス販売事業者の同意を得ているときは、この限りでない。"},{"d":1,"t":"十六　一般消費者等から液化石油ガス販売契約の解除の申し出があった場合において、当該一般消費者等から要求があった場合には、液化石油ガス販売事業者はその所有する供給設備を遅滞なく撤去すること。ただし、撤去が著しく困難である場合その他正当な事由があると認められる場合は、この限りでない。"},{"d":1,"t":"十七　一般消費者等から液化石油ガス販売契約の解除の申し出があった場合において、消費設備に係る配管であって液化石油ガス販売事業者が所有するものについては、当該一般消費者等が別段の意思表示をする場合その他やむを得ない事情がある場合を除き、適正な対価で一般消費者等に所有権を移転すること。（当該配管の所有権が液化石油ガス販売事業者にある場合に限る。）"},{"d":1,"t":"十八　貯槽又はバルク貯槽（以下この条及び第二十一条において「貯槽等」という。）であって販売所内に設置されているものの周囲二メートル以内には、火気又は引火性若しくは発火性の物を置かないこと。"},{"d":1,"t":"十九　貯槽等の修理又は清掃（以下この号において「修理等」という。）は、次のイからヘまでに掲げる基準によることにより保安上支障のない状態で行うこと。"},{"d":2,"t":"イ　修理等をするときは、あらかじめ、修理等の作業計画及び当該作業の責任者を定め、修理等は、当該作業計画に従い、かつ、当該責任者の監督の下に行うこと。"},{"d":2,"t":"ロ　修理等をするときは、あらかじめ、その内部の液化石油ガスを液化石油ガスと反応しにくい不燃性のガス又は液体で置換する等の危険を防止する措置を講ずること。"},{"d":2,"t":"ハ　修理等のため作業員が貯槽等内に入るときは、ロの規定による置換に使用されたガス又は液体を空気で再置換すること。"},{"d":2,"t":"ニ　貯槽等を開放して修理等をするときは、当該貯槽等に他の部分から液化石油ガスが漏えいすることのないよう当該貯槽等の前後のバルブを閉止するとともに、仕切板を施す等の措置を講ずること。"},{"d":2,"t":"ホ　ニの規定により閉止されたバルブ（操作ボタン等により当該バルブを開閉する場合にあっては、当該操作ボタン等）又は仕切板には、誤操作を防止するため、操作してはならない旨を表示するとともに施錠をする等の措置を講ずること。"},{"d":2,"t":"ヘ　修理等が終了したときは、当該貯槽等から液化石油ガスの漏えいのないことを確認した後でなければ使用しないこと。"},{"d":1,"t":"十九の二　供給管若しくは配管又は集合装置を修理するため液化石油ガスを遮断するときは、次のイ及びロに掲げる基準によることにより保安上支障のない状態で行うこと。"},{"d":2,"t":"イ　修理をするときは、あらかじめ、修理の作業計画及び当該作業の責任者を定め、修理は、当該作業計画に従い、かつ、当該責任者の監督の下に行うこと。"},{"d":2,"t":"ロ　修理が終了したときは、当該供給管若しくは配管又は集合装置から液化石油ガスの漏えいのないことを確認した後でなければ使用しないこと。"},{"d":1,"t":"二十　貯槽等（貯蔵能力が三千キログラム以上のものに限る。）は、告示で定めるところにより、その沈下状況を測定し、沈下していた場合には、その沈下の程度に応じ適切な措置を講ずること。"},{"d":1,"t":"二十一　貯槽等に設けたバルブの操作は、当該バルブの材質、構造及び状態に応じ過大な力を加えないようにしてすること。"},{"d":1,"t":"二十二　バルク貯槽は、告示で定めるところにより検査を行うこと。"},{"d":1,"t":"二十二の二　第十九号の規定は、前号の規定による検査について準用する。この場合において、第十九号中「貯槽等の修理又は清掃（以下この条において「修理等」という。）」とあるのは「第二十二号の検査」と、同号イからヘまでの規定中「修理等」とあるのは「当該検査」と、「貯槽等」とあるのは「バルク貯槽」と読み替えるものとする。"},{"d":1,"t":"二十三　バルク容器に設けるカップリング用液流出防止装置、ガス放出防止器、緊急遮断装置（内容積が四千リットル未満のバルク容器に係るものに限る。）、カップリング、液面計及び過充てん防止装置は、告示で定めるところにより検査を行うこと。"}],"del":false},{"id":"規則-17","law":"規則","num":"17","title":"第十七条","cap":"（危険のおそれのない場合の特則）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"第十四条第二号から第四号まで並びに前条第三号、第五号及び第十三号に規定する基準について、経済産業大臣が貯蔵施設又は供給設備の規模、周囲の状況等から判断して保安上支障がないと認めた場合においては、当該規定にかかわらず、経済産業大臣が認める基準をもって、当該規定に係る法第十六条第一項及び第二項の基準とする。","p":1}],"del":false},{"id":"規則-18","law":"規則","num":"18","title":"第十八条","cap":"（供給設備の技術上の基準）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十六条の二第一項の経済産業省令で定める供給設備（バルク供給に係るものを除く。以下この条において同じ。）の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　貯蔵設備（貯槽であるものを除き、貯蔵能力が千キログラム未満のものに限る。）は、次に定める基準に適合すること。"},{"d":2,"t":"イ　充てん容器等（内容積が二十リットル以上のものに限る。以下イにおいて同じ。）には、当該容器を置く位置から二メートル以内にある火気をさえぎる措置を講じ、かつ、屋外に置くこと。ただし、屋外に置くことが著しく困難な場合（告示で定める場合に限る。）において、充てん容器等及びこれらの附属品から漏えいした液化石油ガスが屋内に滞留しないような措置を講じ、かつ、漏えいした液化石油ガスが火気に触れないような措置を講じたときは、屋内に置くことができる。"},{"d":2,"t":"ロ　充てん容器等（当該容器に取り付けたスカートを含む。）には、湿気、水滴等による腐しょくを防止する措置を講ずること。"},{"d":2,"t":"ハ　充てん容器等は、常に温度四十度以下に保つこと。"},{"d":2,"t":"ニ　充てん容器等（内容積が五リットル以下のものを除く。以下ニにおいて同じ。）には、転落、転倒等による衝撃及びバルブ等の損傷を防止する措置を講ずるとともに、浸水のおそれのある地域においては、充てん容器等が浸水によって流されることを防止する措置を講ずること。"},{"d":1,"t":"二　貯蔵設備（貯槽であるものを除き、貯蔵能力が千キログラム以上三千キログラム未満のものに限る。以下この号において同じ。）は、次に定める基準に適合すること。"},{"d":2,"t":"イ　貯蔵設備は、その外面から、第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離を有すること。ただし、第一種保安物件又は第二種保安物件に対し、鉄筋コンクリート障壁等を設けた場合は、この限りでない。"},{"d":2,"t":"ロ　貯蔵設備は、その外面から火気（当該貯蔵設備に附属する気化装置内のものを除く。以下ロにおいて同じ。）を取り扱う施設に対し五メートル以上の距離を有し、又は当該貯蔵設備と火気を取り扱う施設との間に当該貯蔵設備から漏えいした液化石油ガスが当該火気を取り扱う施設に流動することを防止するための措置を講ずること。"},{"d":2,"t":"ハ　貯蔵設備には、液化石油ガスが漏えいしたとき滞留しないような措置を講ずること。"},{"d":2,"t":"ニ　貯蔵設備（販売所内に設置されているものを除く。）には、さく、へい等を設けること。"},{"d":2,"t":"ホ　貯蔵設備には、その外部から見やすいように警戒標を掲げてあること。"},{"d":2,"t":"ヘ　貯蔵設備には、消火設備を設けること。"},{"d":2,"t":"ト　貯蔵設備には、不燃性又は難燃性の材料を使用した軽量な屋根又は遮へい板を設けること。"},{"d":2,"t":"チ　充てん容器等には、転落、転倒等による衝撃及びバルブ等の損傷を防止する措置を講ずること。"},{"d":2,"t":"リ　充てん容器等（当該容器に取り付けたスカートを含む。）には、湿気、水滴等による腐しょくを防止する措置を講ずること。"},{"d":1,"t":"三　貯槽（貯蔵能力が千キログラム未満のものに限る。）は、次に定める基準に適合すること。"},{"d":2,"t":"イ　貯槽は、その外面から、第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離を有すること。ただし、第一種保安物件又は第二種保安物件に対し、鉄筋コンクリート障壁等を設け、又は当該貯槽を地盤面下に埋設した場合には、この限りでない。"},{"d":2,"t":"ロ　第一種保安物件又は第二種保安物件が密集し、特に公共の安全を維持する必要がある地域であって、経済産業大臣が指定する地域においては、貯槽を地盤面下に埋設すること。"},{"d":2,"t":"ハ　地盤面下に埋設する貯槽は、次に定める基準に適合するものであること。"},{"d":3,"t":"（１）　貯槽は、ふた、壁及び底の厚さがそれぞれ三十センチメートル以上の防水措置を施した鉄筋コンクリート造りの室（以下「貯槽室」という。）に設置し、かつ、次の（イ）、（ロ）又は（ハ）に掲げる措置を講ずること。ただし、腐しょくを防止する措置を講じた貯槽を地盤に固定し、かつ、地盤面上の重量物の荷重に耐えることができる措置を講じた場合には、当該貯槽を貯槽室に設置しないことができる。"},{"d":4,"t":"（イ）　貯槽の周囲に乾燥砂を詰めること。"},{"d":4,"t":"（ロ）　貯槽を水没させること。"},{"d":4,"t":"（ハ）　貯槽室内を強制換気すること。"},{"d":3,"t":"（２）　貯槽の頂部は、三十センチメートル以上地盤面から下にあること。"},{"d":3,"t":"（３）　貯槽を二以上隣接して設置する場合には、その相互間に一メートル以上の間隔を保つこと。"},{"d":2,"t":"ニ　貯槽は、その外面から火気（当該貯槽に附属する気化装置内のものを除く。以下ニにおいて同じ。）を取り扱う施設に対し、五メートル以上の距離を有し、又は当該貯槽と火気を取り扱う施設との間に当該貯槽から漏えいした液化石油ガスが当該火気を取り扱う施設に流動することを防止するための措置を講ずること。"},{"d":2,"t":"ホ　貯槽（販売所内に設置されているもの又は地盤面下に埋設されているものを除く。）には、さく、へい等を設けること。"},{"d":2,"t":"ヘ　貯槽には、その外部から見やすいように液化石油ガスの貯槽である旨を朱書すること。"},{"d":2,"t":"ト　貯槽の材料は、その使用条件等に照らし適切なものであること。"},{"d":2,"t":"チ　貯槽には、使用上支障のある腐しょく、割れ等の欠陥がないものであること。"},{"d":2,"t":"リ　貯槽には、腐しょくを防止する措置を講ずること。"},{"d":2,"t":"ヌ　貯槽の基礎は、不同沈下等により当該貯槽に有害なひずみが生じないようなものであること。"},{"d":2,"t":"ル　貯槽は、常用の圧力の一・五倍以上（特定設備検査規則（昭和五十一年通商産業省令第四号）第二条第十七号に規定する第二種特定設備（以下単に「第二種特定設備」という。）にあっては、常用の圧力の一・三倍以上）の圧力で水その他の安全な液体を使用して行う耐圧試験（その構造により液体を使用することが困難であると認められるときは、常用の圧力の一・二五倍以上（第二種特定設備にあっては、常用の圧力の一・一倍以上）の圧力で空気、窒素等の気体を使用して行う耐圧試験）及び常用の圧力以上の圧力で行う気密試験に合格するものであること。"},{"d":2,"t":"ヲ　貯槽は、常用の圧力の二倍以上の圧力で降伏を起こさないような肉厚を有するものであること。"},{"d":2,"t":"ワ　貯槽には、告示で定めるところにより、圧力計を設け、かつ、当該貯槽内の圧力が許容圧力を超えた場合に、直ちにその圧力を許容圧力以下に戻すことができる安全弁を設けること。"},{"d":2,"t":"カ　ワの規定により設けた安全弁には、放出管を設けること。この場合において、放出管の開口部の位置は、周囲に着火源等のない安全な位置であって、地盤面から五メートルの高さ又は貯槽の頂部から二メートルの高さのいずれか高い位置以上の高さであること。"},{"d":2,"t":"ヨ　貯槽には、液面計（丸形ガラス管液面計を除く。）を設けること。この場合において、ガラス管液面計を使用するときは、当該ガラス管液面計には、その破損を防止するための措置を講じ、貯槽とガラス管液面計とを接続する管には、自動式及び手動式の止め弁を設けること。"},{"d":2,"t":"タ　貯槽に取り付けられた受入管（液化石油ガスを受け入れるための管をいい、当該管と貯槽との接続部を含む。以下ナにおいて同じ。）及び供給管（当該管と貯槽との接続部を含む。以下ナにおいて同じ。）には、二以上のバルブを設け、当該二以上のバルブの一は、当該貯槽の直近に設けること。この場合において、当該貯槽の直近に設けたバルブは、液化石油ガスを送り出し又は受け入れるとき以外のときは、閉止しておくこと。"},{"d":2,"t":"レ　地盤面上に設置する貯槽及びその支柱は、不燃性の断熱材で被覆すること等により耐熱性の構造とし、又は当該貯槽及びその支柱にその外面から五メートル以上離れた位置において操作することができる冷却用散水装置その他の有効な冷却装置を設けること。"},{"d":2,"t":"ソ　貯槽（販売所内に設置されているものに限る。）から漏えいする液化石油ガスが滞留するおそれのある場所には、当該液化石油ガスの漏えいを検知し、かつ、警報するための設備を設けること。"},{"d":2,"t":"ツ　貯槽には、当該貯槽に生ずる静電気を除去する措置を講ずること。"},{"d":2,"t":"ネ　貯槽には、消火設備を設けること。"},{"d":2,"t":"ナ　受入管及び供給管に設けたバルブ（操作ボタン等により当該バルブを開閉する場合にあっては、当該操作ボタン等。以下ナにおいて同じ。）には、次の（１）及び（２）に掲げる基準により、作業員が当該バルブを適切に操作することができるような措置を講ずること。"},{"d":3,"t":"（１）　バルブには、当該バルブの開閉方向（操作することにより当該バルブに係る貯槽に保安上重大な影響を与えるバルブにあっては、当該バルブの開閉状態を含む。）を明示すること。"},{"d":3,"t":"（２）　バルブ（操作ボタン等により開閉するものを除く。）に係る受入管及び供給管には、当該バルブに近接する部分に、容易に識別することができる方法により、当該管内の液化石油ガスの流れの方向を表示すること。"},{"d":1,"t":"四　貯蔵設備、気化装置及び調整器は、一般消費者等の液化石油ガスの最大消費数量に適応する数量の液化石油ガスを供給しうるものであること。"},{"d":1,"t":"五　バルブ、集合装置、供給管及びガス栓は、使用上支障のある腐しょく、割れ等の欠陥がないものであること。"},{"d":1,"t":"六　バルブ、集合装置及び供給管には、腐しょくを防止する措置を講ずること。"},{"d":1,"t":"七　バルブ、集合装置及び供給管の材料は、その使用条件等に照らし適切なものであること。"},{"d":1,"t":"八　集合装置及び供給管には、次に定める基準に適合する管を使用すること。"},{"d":2,"t":"イ　充てん容器等又は貯槽と調整器（二段式減圧用二次側のものを除く。ロにおいて同じ。）の間に設置される管にあっては、二・六メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":2,"t":"ロ　調整器とガスメーターの間に設置される管にあっては、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":2,"t":"ハ　二段式減圧用一次側調整器と二次側調整器の間に設置される管にあっては、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":2,"t":"ニ　充てん容器等と集合装置に係る集合管若しくは調整器を接続する管又は調整器と硬質管を接続する硬質管以外の管にあっては、接続された状態で一キロニュートン以上の力で行う引張試験に合格するもの"},{"d":1,"t":"八の二　集合装置又は供給管（以下この号において「集合装置等」という。）は、次に定める基準に適合するよう修理し、又は取り外すこと。"},{"d":2,"t":"イ　集合装置等には、当該集合装置等から液化石油ガスが漏えいすることを防止するための措置を講ずること。"},{"d":2,"t":"ロ　集合装置等には、当該集合装置等から漏えいする液化石油ガスが滞留するおそれのある場所において、当該液化石油ガスが漏えいしていないことを確認するための措置を講ずること。"},{"d":2,"t":"ハ　集合装置等には、当該集合装置等の修理又は取り外しが終了したときは、当該集合装置等から液化石油ガスの漏えいのないことを確認するための措置を講ずること。"},{"d":1,"t":"九　調整器とガスメーターの間の供給管は、その設置又は変更（硬質管以外の管の交換を除く。）の工事の終了後に行う次に定める圧力による気密試験に合格するものであること。"},{"d":2,"t":"イ　二段式減圧用一次側調整器と二次側調整器の間の供給管にあっては、〇・一五メガパスカル以上"},{"d":2,"t":"ロ　イ以外の供給管にあっては、八・四キロパスカル以上"},{"d":1,"t":"十　バルブ、集合装置、気化装置及び供給管は、漏えい試験に合格するものであること。"},{"d":1,"t":"十一　調整器（二段式減圧用一次側のものを除く。）とガスメーターの間の供給管その他の設備（ガスメーターを含む。）は、燃焼器の入口における液化石油ガスの圧力を次に定める範囲に保持するものであること。"},{"d":2,"t":"イ　生活の用に供する液化石油ガスに係るものにあっては、二・〇キロパスカル以上三・三キロパスカル以下"},{"d":2,"t":"ロ　イ以外のものにあっては、使用する燃焼器に適合した圧力"},{"d":1,"t":"十二　建物の自重及び土圧により損傷を受けるおそれのある供給管には、損傷を防止する措置を講ずること。"},{"d":1,"t":"十三　供給管は、地くずれ、山くずれ、地盤の不同沈下等のおそれのある場所又は建物の基礎面下に設置しないこと。"},{"d":1,"t":"十四　供給管を地盤面上に設置する場合においてその周辺に危害を及ぼすおそれのあるときは、その見やすい箇所に液化石油ガスの供給管である旨、供給管に異常を認めたときの連絡先その他必要な事項を明瞭に記載した危険標識を設けること。"},{"d":1,"t":"十五　供給管（貯蔵能力が千キログラム以上の貯蔵設備に係るものに限り、地盤面下に埋設されているものを除く。）には、温度の変化による供給管の長さの変化を吸収する措置を講ずること。"},{"d":1,"t":"十六　内部に液化物の滞留するおそれのある供給管（貯蔵能力が五百キログラム以上の貯蔵設備に係るものに限る。）には、液化物を排除することができる措置を講ずること。"},{"d":1,"t":"十七　一の供給設備により二以上の消費設備に供給する場合は、一般消費者等への液化石油ガスの供給を中断することなく充てん容器等の交換を行うことができる設備を設けること。"},{"d":1,"t":"十八　一の供給設備により二以上の消費設備に供給する場合は、ガスメーターの入口側の供給管に、ガス栓を設けること。"},{"d":1,"t":"十九　気化装置は、次に定める基準に適合すること。"},{"d":2,"t":"イ　気化装置は、使用上支障のある腐しょく、割れ等の欠陥がないものであること。"},{"d":2,"t":"ロ　気化装置は、二・六メガパスカル以上の圧力で行う耐圧試験に合格するものであること。"},{"d":2,"t":"ハ　気化装置は、直火で直接液化石油ガスを加熱する構造のものでないこと。"},{"d":2,"t":"ニ　気化装置には、液状の液化石油ガスの流出を防止する措置を講ずること。"},{"d":2,"t":"ホ　温水により液化石油ガスを加熱する構造の気化装置であって寒冷地に設置するものには、温水部に凍結を防止するための措置を講ずること。"},{"d":1,"t":"二十　調整器は、次に定める基準に適合すること。"},{"d":2,"t":"イ　調整器は、使用上支障のある腐しょく、割れ、ねじのゆるみ等の欠陥がなく、かつ、消費する液化石油ガスに適合したものであること。"},{"d":2,"t":"ロ　調整器は、次に定める耐圧性能及び気密性能を有するものであること。"},{"d":3,"t":"（１）　調整器（二段式減圧用二次側のものを除く。）の高圧側の耐圧性能及び気密性能は、二・六メガパスカル以上の圧力で行う耐圧試験及び一・五六メガパスカル以上の圧力で行う気密試験に合格するものであること。"},{"d":3,"t":"（２）　調整器（二段式減圧用二次側のものに限る。）の高圧側の耐圧性能及び気密性能は、〇・八メガパスカル以上の圧力で行う耐圧試験及び〇・一五メガパスカル以上の圧力で行う気密試験に合格するものであること。"},{"d":2,"t":"ハ　調整器（二段式減圧用一次側のものを除く。）の調整圧力及び閉そく圧力は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　調整器（生活の用に供する液化石油ガスに係るものに限る。）の調整圧力は、二・三キロパスカル以上三・三キロパスカル以下であり、かつ、閉そく圧力は、三・五キロパスカル以下であること。"},{"d":3,"t":"（２）　調整器（（１）に規定するものを除く。）の調整圧力及び閉そく圧力は、使用する燃焼器に適合したものであること。"},{"d":1,"t":"二十一　地下室、地下街その他の地下であって液化石油ガスが充満するおそれがある場所のうち告示で定めるもの（以下「地下室等」という。）に係る供給管（貯蔵能力が三百キログラム以上の貯蔵設備に接続されたものに限る。）には、当該地下室等の保安状況を常時監視できる場所において、直ちに液化石油ガスの供給を停止することができる緊急遮断装置を、当該供給管と接続された貯蔵設備ごとに、これに近接して設けること。ただし、告示で定める地下室等にあっては、当該供給管と接続された貯蔵設備ごとに、これに近接した一のバルブによって液化石油ガスの供給を停止することができる場合は、この限りでない。"},{"d":1,"t":"二十二　第十六条第十三号に基づき液化石油ガスを体積により販売する場合にあっては、次のイ又はロに掲げるもの及びハに掲げるものが告示で定める方法により設置されていること。ただし、その設置場所又は一般消費者等の液化石油ガスの消費の形態に特段の事情があるとき（ロに掲げるものにあっては、告示で定める場合を含む。）若しくは消費設備の所有者又は占有者からその設置の承諾を得ることができないときは、この限りでない。"},{"d":2,"t":"イ　異常なガス流量を検知したときに自動的にガスの供給を停止する機能及びその旨の表示を行う機能を有するガスメーター"},{"d":2,"t":"ロ　液化石油ガス器具等の技術上の基準等に関する省令（昭和四十三年通商産業省令第二十三号。以下「器具省令」という。）別表第一第十四号に規定する液化石油ガス用ガス漏れ警報器（器具省令別表第三の技術上の基準に適合するものに限る。）を用いた機器であって、ガス漏れを検知したときに自動的にガスの供給を停止するもの"},{"d":2,"t":"ハ　器具省令別表第一第十六号に規定する液化石油ガス用対震自動ガス遮断器（器具省令別表第三の技術上の基準に適合するものに限る。）"},{"d":1,"t":"二十三　供給管若しくは集合装置又は調整器から充てん容器等を取り外すときは、その取り外す充てん容器等について、バルブを確実に閉止し、かつ、安全な場所に移す措置を講ずること。"}],"del":false},{"id":"規則-19","law":"規則","num":"19","title":"第十九条","cap":"（バルク供給に係る供給設備の技術上の基準）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十六条の二第一項の経済産業省令で定める供給設備（バルク供給に係るものに限る。）の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　バルク容器（貯蔵能力が千キログラム未満のものに限る。以下この号において同じ。）は、次に掲げる基準に適合すること。"},{"d":2,"t":"イ　告示で定めるところにより、カップリング用液流出防止装置を取り付けた液取入バルブを設けること。"},{"d":2,"t":"ロ　告示で定めるところにより、ガス放出防止器又は緊急遮断装置を取り付けたガス取出バルブを設けること。ただし、告示で定めるところにより、地震による震動及び地盤の液状化に伴う供給管の損傷を防止する措置が講じられている場合は、この限りでない。"},{"d":2,"t":"ハ　液取出バルブを設ける場合の当該液取出バルブは、告示で定めるところにより、ガス放出防止器又は緊急遮断装置を取り付けたものとすること。ただし、当該液取出バルブを供給管若しくは配管又は集合装置に接続しない場合は、この限りでない。"},{"d":2,"t":"ニ　均圧バルブを設ける場合の当該均圧バルブは、告示で定めるところにより、先端にカップリングを取付けたものとすること。"},{"d":2,"t":"ホ　告示で定めるところにより、液面計（ガラス管液面計を除く。）を設けること。"},{"d":2,"t":"ヘ　告示で定めるところにより、過充てん防止装置を設けること。"},{"d":2,"t":"ト　イからヘに掲げる機器は、ふた付きのプロテクターで保護すること。ただし、ホ又はヘに掲げる機器については、液化石油ガスの漏えいのおそれがない場合においては、この限りでない。"},{"d":2,"t":"チ　バルク容器には、バルク容器又は当該バルク容器の周囲の見やすい箇所に、液化石油ガス又はＬＰガス及び火気厳禁と朱書すること。"},{"d":2,"t":"リ　バルク容器には、バルク容器又は当該バルク容器の周囲の見やすい箇所に、緊急連絡先を表示すること。ただし、当該バルク容器に係る容器保安規則第十条第三号に規定する表示の内容が、法第二十七条第一項第四号の保安業務の認定を受けた事業所と同じ場合は、この限りでない。"},{"d":2,"t":"ヌ　バルク容器（当該バルク容器に取り付けられた機器等を含む。）には、腐しょくを防止する措置を講ずること。"},{"d":2,"t":"ル　転落、転倒等を防止するため、スカート又はサドル等を基礎に設置すること。"},{"d":2,"t":"ヲ　基礎は、平坦なコンクリート盤等による水平、かつ、地盤面から五センチメートル以上高いものとする。"},{"d":2,"t":"ワ　自動車等車両が接触しない措置を講ずること。"},{"d":2,"t":"カ　安全弁には、告示で定めるところにより、放出管等を設けること。"},{"d":2,"t":"ヨ　バルク容器は、その外面から二メートル以内にある火気をさえぎる措置を講じ、かつ、屋外に置くこと。"},{"d":2,"t":"タ　バルク容器は、常に温度四十度以下に保つこと。"},{"d":1,"t":"二　バルク容器（貯蔵能力が千キログラム以上三千キログラム未満のものに限る。以下この号において同じ。）は、次に掲げる基準に適合すること。"},{"d":2,"t":"イ　バルク容器は、その外面から、第一種保安物件に対し十六・九七メートル以上、第二種保安物件に対し十一・三一メートル以上の距離を有すること。ただし、第一種保安物件又は第二種保安物件に対し、鉄筋コンクリート障壁等を設けた場合は、この限りでない。"},{"d":2,"t":"ロ　バルク容器は、その外面から火気（当該バルク容器に附属する気化装置内のものを除く。以下ロにおいて同じ。）を取り扱う施設に対し五メートル以上の距離を有し、又は当該バルク容器と火気を取り扱う施設との間に当該バルク容器から漏えいした液化石油ガスが当該火気を取り扱う施設に流動することを防止するための措置を講ずること。"},{"d":2,"t":"ハ　バルク容器には、不燃性又は難燃性の材料を使用した軽量な屋根又は遮へい板を設けること。"},{"d":2,"t":"ニ　バルク容器には、消火設備を設けること。"},{"d":2,"t":"ホ　前号イからカまでの基準に適合すること。"},{"d":1,"t":"三　バルク貯槽（貯蔵能力が千キログラム未満のものに限る。）は、次に掲げる基準に適合すること。"},{"d":2,"t":"イ　バルク貯槽（ハ（１）から（８）までのものを除く。）は、高圧ガス保安法第五十六条の四第一項で定める特定設備検査合格証又は同法第五十六条の六の十四第二項に定める特定設備基準適合証を有するものであること。"},{"d":2,"t":"ロ　バルク貯槽は、その外面から、第一種保安物件に対し一・五メートル以上、第二種保安物件に対し一メートル以上の距離を有すること。ただし、告示で定めるところにより、第一種保安物件及び第二種保安物件に対し、加熱試験に合格する構造壁若しくはこれと同等以上の性能を有する壁を設け、又は当該バルク貯槽を地盤面下に埋設した場合には、この限りでない。"},{"d":2,"t":"ハ　次に定める基準に適合すること。"},{"d":3,"t":"（１）　告示で定めるところにより、内部の圧力が許容圧力を超えた場合に、直ちにその圧力を許容圧力以下に戻すことができる安全弁を設けること。"},{"d":3,"t":"（２）　告示で定めるところにより、液面計（ガラス管液面計を除く。）を設けること。"},{"d":3,"t":"（３）　告示で定めるところにより、過充てん防止装置を設けること。"},{"d":3,"t":"（４）　告示で定めるところにより、カップリング用液流出防止装置を取り付けた液取入弁を設けること。"},{"d":3,"t":"（５）　告示で定めるところにより、ガス放出防止器又は緊急遮断装置を取り付けたガス取出弁を設けること。ただし、告示で定めるところにより、地震による震動及び地盤の液状化に伴う供給管の損傷を防止する措置が講じられている場合は、この限りでない。"},{"d":3,"t":"（６）　告示で定めるところにより、ガス放出防止器又は緊急遮断装置を取り付けた液取出弁を設けること。ただし、当該液取出弁を供給管若しくは配管又は集合装置に接続しない場合は、この限りでない。"},{"d":3,"t":"（７）　均圧弁を設ける場合の当該均圧弁は、告示で定めるところにより、先端にカップリングを取り付けたものとすること。"},{"d":3,"t":"（８）　（１）から（７）までに掲げる機器（以下「附属機器」という。）は、告示で定めるところにより、ふた付きのプロテクターで保護すること。ただし、（２）又は（３）に掲げる機器については、液化石油ガスの漏えいのおそれがない場合においては、この限りでない。"},{"d":3,"t":"（９）　バルク貯槽には、バルク貯槽又は当該バルク貯槽の周囲の見やすい箇所に、液化石油ガス又はＬＰガス及び火気厳禁と朱書すること。"},{"d":3,"t":"（１０）　バルク貯槽には、バルク貯槽又は当該バルク貯槽の周囲の見やすい箇所に、緊急連絡先を表示すること。"},{"d":3,"t":"（１１）　バルク貯槽には、告示で定めるところにより、腐しょくを防止する措置を講ずること。"},{"d":3,"t":"（１２）　バルク貯槽には、底部の腐しょく及び転倒を防止するための適当な材質及び構造を有する支柱又はサドル等を取り付けること。"},{"d":2,"t":"ニ　地盤面上に設置するバルク貯槽は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　基礎は、平坦なコンクリート盤等による水平、かつ、地盤面から五センチメートル以上高いものとし、かつ、不同沈下等によりバルク貯槽に有害なひずみが生じないようなものであること。"},{"d":3,"t":"（２）　自動車等車両が接触しない措置を講ずること。"},{"d":3,"t":"（３）　バルク貯槽の支柱又はサドル等を基礎にアンカーボルト等で固定すること。"},{"d":3,"t":"（４）　告示で定めるところにより、大地と電気的に接続すること。"},{"d":3,"t":"（５）　第三号ハ（１）の規定により設けた安全弁には、告示で定めるところにより、放出管等を設けること。"},{"d":2,"t":"ホ　地盤面下に埋設するバルク貯槽は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　バルク貯槽の頂部は、三十センチメートル以上地盤面から下にあること。"},{"d":3,"t":"（２）　バルク貯槽を埋設した場所に自動車等車両が乗り入れることのないような措置を講ずること。"},{"d":3,"t":"（３）　告示で定めるところにより、地下水による浮き上がりを防止する措置を講ずること。"},{"d":3,"t":"（４）　バルク貯槽の埋設には、石塊等のない土又は砂を用いること。"},{"d":3,"t":"（５）　バルク貯槽の周囲には、告示で定めるところにより、ガス検知用の孔あき管を設置すること。"},{"d":3,"t":"（６）　バルク貯槽の水平投影面の四隅に、埋設後の貯槽の位置を示すための標識杭を設置すること。"},{"d":3,"t":"（７）　プロテクターのふたは、厚さ五センチメートル以上の不燃性の断熱材を裏当てすること。"},{"d":2,"t":"ヘ　バルク貯槽は、その外面から二メートル以内にある火気をさえぎる措置を講じ、かつ、屋外に置くこと。"},{"d":1,"t":"四　バルク容器及びバルク貯槽は、液化石油ガスの漏えいがないものであること。"},{"d":1,"t":"五　バルク容器及びバルク貯槽のプロテクター内に、告示で定めるところにより、ガス漏れ検知器を設け、液化石油ガスの漏えい情報等を常時監視するシステムと接続すること。ただし、告示に定める場合にあっては、この限りでない。"},{"d":1,"t":"六　告示で定めるところにより、バルク容器又はバルク貯槽と調整器の間で液状の液化石油ガスが滞留しにくい措置を講ずること。"},{"d":1,"t":"七　前条第四号から第七号まで、第八号の二から第十六号まで及び第十八号から第二十三号までの基準に適合すること。この場合において、「充てん容器等」とあるのは、「バルク容器又はバルク貯槽」と読み替えるものとする。"},{"d":1,"t":"八　供給管には、次に定める基準に適合する管を使用すること。"},{"d":2,"t":"イ　バルク容器又はバルク貯槽と調整器（二段式減圧用二次側のものを除く。ロにおいて同じ。）の間に設置される管にあっては、二・六メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":2,"t":"ロ　調整器とガスメーターの間に設置される管にあっては、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":2,"t":"ハ　二段式減圧用一次側調整器と二次側調整器の間に設置される管にあっては、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するもの"}],"del":false},{"id":"規則-20","law":"規則","num":"20","title":"第二十条","cap":"（危険のおそれのない場合の特則）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"前二条に規定する基準について、経済産業大臣が供給設備の規模、周囲の状況等から判断して保安上支障がないと認めた場合においては、当該規定にかかわらず、経済産業大臣が認める基準をもって、法第十六条の二第一項の技術上の基準とする。","p":1}],"del":false},{"id":"規則-21","law":"規則","num":"21","title":"第二十一条","cap":"（特定供給設備）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十六条の二第一項の経済産業省令で定める供給設備は、貯蔵設備（貯蔵設備が容器である場合にあっては、その貯蔵能力が三千キログラム以上のもの、貯蔵設備に貯槽等が含まれる場合にあっては、その貯蔵能力が千キログラム以上のものに限る。以下この条において同じ。）、気化装置及び調整器（貯蔵設備に近接するものに限る。以下この条において同じ。）並びにこれらに準ずる設備（貯蔵設備と調整器の間に設けられるものに限る。）並びに貯蔵設備と調整器の間の供給管並びにこれらの設備に係る屋根、遮へい板及び障壁とする。","p":1},{"d":0,"t":"２　貯蔵能力が千キログラム未満の貯槽等の修理、清掃、検査又は撤去を行うために当該貯槽等に現に貯蔵されている液化石油ガスをできる限り多く消費する必要がある場合において、当該貯槽等の見やすい箇所に液化石油ガスを充塡してはならない旨を表示し、かつ、液化石油ガスを充塡できないように当該貯槽等に封印をするときは、当該貯槽等に現に貯蔵されている液化石油ガスの数量を当該貯槽等の貯蔵能力として前項の規定を適用する。","p":1}],"del":false},{"id":"規則-22","law":"規則","num":"22","title":"第二十二条","cap":"（業務主任者の選任等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十九条第一項の規定により、液化石油ガス販売事業者は、その販売する一般消費者等の数が千未満の販売所にあっては一、千以上の販売所にあっては二に一般消費者等の数が千以上で二千を増すごとに一を加算した数以上の業務主任者を選任しなければならない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者は、前項の規定にかかわらず、次の各号に掲げる要件に適合する場合には、その販売する一般消費者等の数が千未満の販売所において選任した業務主任者を当該液化石油ガス販売事業者の他の二以内の販売所の業務主任者に選任することができる。","p":1},{"d":1,"t":"一　当該販売所が相互に六十分以内に到達できる範囲にあること。"},{"d":1,"t":"二　当該販売所の一般消費者等の数を合計した数が千未満であること。"},{"d":0,"t":"３　法第十九条第一項の経済産業省令で定める種類の高圧ガス販売主任者免状は、高圧ガス保安法第二十九条第一項の第二種販売主任者免状とする。","p":1},{"d":0,"t":"４　法第十九条第一項の経済産業省令で定める液化石油ガスの販売に関する経験は、液化石油ガスの販売の実務に六月以上従事した経験とする。","p":1},{"d":0,"t":"５　法第十九条第二項又は法第二十一条第二項の規定により、業務主任者又は業務主任者の代理者の選任又は解任の届出をしようとする者は、様式第十による届書を法第三条第一項の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1}],"del":false},{"id":"規則-23","law":"規則","num":"23","title":"第二十三条","cap":"（業務主任者の講習）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第十九条第三項の規定により、液化石油ガス販売事業者は、業務主任者が高圧ガス保安法第二十九条第一項の第二種販売主任者免状の交付を受けた日の属する年度の翌年度の開始の日から三年以内に、その者に第一回の法第十九条第三項の講習（以下この条において単に「講習」という。）を受けさせなければならない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者は、業務主任者の前項の第一回の講習を受けさせた日の属する年度の翌年度の開始の日から五年以内にその者に第二回の講習を受けさせなければならない。第三回以降の講習についても、同様とする。","p":1},{"d":0,"t":"３　液化石油ガス販売事業者は、業務主任者に選任した日に前二項の期間が経過している場合又は業務主任者に選任した日から前二項の期間が経過するまでの期間が六月未満の場合は、その者に、前二項の規定にかかわらず、選任の日から六月以内に講習を受けさせなければならない。","p":1},{"d":0,"t":"４　前三項の規定にかかわらず、災害その他やむを得ない事由により前三項の期間内に講習を受けさせることが困難であるときは、経済産業大臣が当該事由を勘案して定める期間内に講習を受けさせなければならない。","p":1}],"del":false},{"id":"規則-24","law":"規則","num":"24","title":"第二十四条","cap":"（業務主任者の職務）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第二十条第一項の経済産業省令で定める業務主任者の職務は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　法第三条第二項第三号から第五号までの事項を変更したときは、遅滞なく、法第八条の届出がなされるよう監督すること。"},{"d":1,"t":"二　法第十四条の書面を作成し、又はその作成を指導すること。"},{"d":1,"t":"三　液化石油ガスの販売の方法が法第十六条第二項の基準に適合し、又は適合して維持されるよう監督すること。"},{"d":1,"t":"四　貯蔵施設が法第十六条第一項又は法第三十七条の基準に適合し、又は適合して維持されるよう監督すること。"},{"d":1,"t":"五　供給設備が法第十六条の二第一項の基準（特定供給設備にあっては、法第三十七条の基準）に適合し、又は適合して維持されるよう監督すること。"},{"d":1,"t":"六　法第十八条第一項の規定による保安教育の計画の立案、実施又はその監督を行うこと。"},{"d":1,"t":"七　法第二十七条第一項の保安業務の実施及びその結果を確認すること。"},{"d":1,"t":"八　法第三十六条第一項に規定する貯蔵施設又は特定供給設備が、法第三十七条の二第一項の許可を受けないで変更されること及び法第三十七条の三第一項の完成検査を受けないで使用されることがないよう監督すること。"},{"d":1,"t":"九　法第三十七条の四第一項に規定する充てん設備が、法第三十七条の四第三項において準用する法第三十七条の二第一項の許可を受けないで変更されること、法第三十七条の四第四項において準用する法第三十七条の三第一項の完成検査を受けないで使用されること及び法第三十七条の六第一項の保安検査を受けないで使用されることがないよう監督すること。"},{"d":1,"t":"十　帳簿の記載及び報告の内容について監督すること。"}],"del":false},{"id":"規則-25","law":"規則","num":"25","title":"第二十五条","cap":"（業務主任者の代理者）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"法第二十一条第一項の規定により、液化石油ガス販売事業者は、販売所ごとに一人以上の業務主任者の代理者を選任しなければならない。","p":1},{"d":0,"t":"２　法第二十一条第一項の経済産業省令で定める液化石油ガスの販売に関する経験は、液化石油ガスの販売の実務に六月以上従事した経験とする。","p":1},{"d":0,"t":"３　法第二十一条第一項の経済産業省令で定める条件は、高圧ガス保安協会（以下「協会」という。）の行う液化石油ガスによる災害の発生の防止に関する講習の課程を修了し、液化石油ガスの販売の実務に六月以上従事した経験を有し、かつ、十八歳以上であることとする。","p":1}],"del":false},{"id":"規則-26","law":"規則","num":"26","title":"第二十六条","cap":"（廃止の届出）","capInh":fal した日（以下この号において「基準日」という。）前四月以内の期間に行った場合にあっては、基準日において当該調査を行ったものとみなす。"},{"d":2,"t":"イ　前号の表イ（１）又はロ（２）に掲げる事項に係る調査　一年"},{"d":2,"t":"ロ　前号の表イ（２）又はロ（３）に掲げる事項に係る調査　四年"},{"d":1,"t":"三　第一号の表イ又はロ（２）若しくは（３）に定める調査の結果、法第二十七条第一項第二号の通知をしたときは、その通知に係る消費設備について、次のイ及びロに掲げる措置を行わなければならない。"},{"d":2,"t":"イ　一年に一回以上、当該消費設備の技術上の基準に適合するようにするためにとるべき措置及びその措置をとらなかった場合に生ずべき結果をその所有者又は占有者に通知すること。ただし、その所有者又は占有者が技術上の基準に適合するようにするためにとるべき措置をとった場合は、この限りでない。"},{"d":2,"t":"ロ　その通知の日から一月を経過した日以後五月以内に、再び当該通知に係る事項について第一号の表イ又はロ（２）若しくは（３）に定める調査を行うこと。ただし、直近の当該調査がこのロの規定によるものである場合は、この限りでない。"},{"d":1,"t":"四　経済産業大臣が消費設備を使用する者の生命又は身体について当該消費設備の使用による災害が発生するおそれがあると認める場合において、当該災害の拡大を防止するため特に必要があると認めるときは、第一号及び前号の規定にかかわらず、経済産業大臣の定めるところにより、調査を行わなければならない。"},{"d":1,"t":"五　調査は、保安業務資格者（液化石油ガス設備士、高圧ガス保安法第二十七条の二第三項の製造保安責任者免状若しくは同法第二十八条第一項の販売主任者免状の交付を受けている者、業務主任者の代理者の資格を有する者又は前条第二項に定める要件に適合する者をいう。）が行うこととする。ただし、第一号の表中ロ（１）の調査にあっては、調査員も行うことができることとする。"}],"del":false},{"id":"規則-38","law":"規則","num":"38","title":"第三十八条","cap":"（周知に係る基準）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第二十七条第一項第三号に規定する保安業務に係る法第三十四条第一項の経済産業省令で定める基準については、次条から第三十八条の四までに規定するところによる。","p":1}],"del":false},{"id":"規則-38_2","law":"規則","num":"38_2","title":"第三十八条の二","cap":"（周知の方法）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"周知を行う保安機関（以下この条から第三十八条の四までにおいて単に「保安機関」という。）は、その周知に係る一般消費者等に対し、供給開始時及び二年に一回以上の回数で第二十七条各号の事項を記載した書面を配布し、当該事項を周知させなければならない。ただし、災害その他やむを得ない事由によりその回数で周知させることが困難であるときは、経済産業大臣が当該事由を勘案して定める期間に一回以上周知させなければならない。","p":1},{"d":0,"t":"２　保安機関は、その周知に係る一般消費者等が、次の各号に掲げる消費設備を所有し、又は占有する場合にあっては、前項の規定にかかわらず、当該一般消費者等に対し、供給開始時及び一年に一回以上の回数で第二十七条各号の事項を記載した書面を配布し、当該事項を周知させなければならない。ただし、災害その他やむを得ない事由によりその回数で周知させることが困難であるときは、経済産業大臣が当該事由を勘案して定める期間に一回以上周知させなければならない。","p":1},{"d":1,"t":"一　令別表第一に掲げる液化石油ガス用瞬間湯沸器（開放燃焼式のものに限る。）"},{"d":1,"t":"二　次に掲げる消費設備（パイロットバーナー等に点火しなかった場合及びパイロットバーナー等の炎が立ち消えた場合に自動的にバーナーへの液化石油ガスの通路を閉ざす装置（パイロットバーナー等に自動的に再点火し、一定期間経過後も再点火しないときに、バーナーへの液化石油ガスの通路を自動的に閉ざす装置を含む。）並びに不完全燃焼する状態に至った場合に当該燃焼器へのガスの供給を自動的に遮断し、燃焼を停止する機能を有するものを除く。）"},{"d":2,"t":"イ　令別表第一に掲げる液化石油ガス用瞬間湯沸器（前号に掲げるもの、密閉燃焼式のもの及び屋外式のものを除く。）"},{"d":2,"t":"ロ　令別表第一に掲げる液化石油ガス用バーナー付ふろがま（密閉燃焼式のもの及び屋外式のものを除く。）"},{"d":2,"t":"ハ　令別表第一に掲げるふろがま"},{"d":0,"t":"３　次の各号に掲げる周知を、前回の周知の日から当該各号に定める期間を経過した日（以下この項において「基準日」という。）前四月以内の期間に行った場合にあっては、基準日において当該周知を行ったものとみなす。","p":1},{"d":1,"t":"一　第一項に規定する周知　二年"},{"d":1,"t":"二　前項に規定する周知　一年"}],"del":false},{"id":"規則-38_3","law":"規則","num":"38_3","title":"第三十八条の三","cap":"（保安機関による情報通信の技術を利用する方法を用いた周知事項の提供の方法）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"保安機関は、前条第一項及び第二項の規定による書面の配布に代えて、当該一般消費者等の承諾を得て、当該書面に記載すべき事項（以下この条及び次条において「周知事項」という。）を電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であって次に掲げるもの（以下この条及び次条において「電磁的方法」という。）により提供することができる。この場合において、保安機関は、当該書面を配布したものとみなす。","p":1},{"d":1,"t":"一　電子メールを送信する方法であって、一般消費者等が当該電子メールの記録を出力することによる書面を作成することができるもの"},{"d":1,"t":"二　当該保安機関の使用に係る電子計算機に備えられたファイルに記録された周知事項を電気通信回線を通じて一般消費者等の閲覧に供し、当該一般消費者等の使用に係る電子計算機に備えられたファイルに周知事項を記録する方法"},{"d":1,"t":"三　電磁的記録媒体に周知事項を記録したものを交付する方法"},{"d":0,"t":"２　保安機関は、前項の規定により、電磁的方法により周知事項を提供した場合においても、一般消費者等からの求めがあったときは、その者に対し、周知事項を記載した書面を配布しなければならない。","p":1}],"del":false},{"id":"規則-38_4","law":"規則","num":"38_4","title":"第三十八条の四","cap":"（保安機関による情報通信の技術を利用した承諾の取得）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"保安機関は、前条第一項の規定により周知事項を提供しようとするときは、次項に定めるところにより、あらかじめ、当該事項の提供の相手方に対し、その用いる電磁的方法の種類及び内容を示し、書面又は電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であって次の各号に掲げるもの（第三項において「書面等」という。）による承諾を得なければならない。","p":1},{"d":1,"t":"一　電子メールを送信する方法であって、当該保安機関が当該電子メールの記録を出力することによる書面を作成することができるもの"},{"d":1,"t":"二　当該保安機関の使用に係る電子計算機に備えられたファイルに記録された一般消費者等の承諾に関する事項を電気通信回線を通じて一般消費者等の閲覧に供し、当該保安機関の使用に係る電子計算機に備えられたファイルに当該一般消費者等の承諾に関する事項を記録する方法"},{"d":1,"t":"三　電磁的記録媒体に一般消費者等の承諾に関する事項を記録したものを得る方法"},{"d":0,"t":"２　前項の規定により示すべき電磁的方法の種類及び内容は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　前条第一項各号に掲げる方法のうち、保安機関が使用するもの"},{"d":1,"t":"二　ファイルへの記録の方式"},{"d":0,"t":"３　第一項の承諾を得た保安機関は、当該相手方から書面等について電磁的方法による提供を受けない旨の申出があったときは、当該相手方に対し、周知事項の提供を電磁的方法によってしてはならない。ただし、当該相手方が再び同項の承諾をした場合は、この限りでない。","p":1}],"del":false},{"id":"規則-39","law":"規則","num":"39","title":"第三十九条","cap":"（保安業務規程）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第三十五条第一項前段の規定により保安業務規程の認可を受けようとする保安機関は、様式第十七による申請書に保安業務規程を添付して法第二十九条第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1},{"d":0,"t":"２　法第三十五条第二項の保安業務規程で定めるべき事項は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　事業所の所在地"},{"d":1,"t":"二　各事業所ごとの保安業務を行うことのできる保安業務区分ごとの一般消費者等の数"},{"d":1,"t":"三　保安業務を行うことのできる者の数及びその事業所ごとの配置に関する事項"},{"d":1,"t":"四　保安業務用機器の種類及び数並びにその事業所ごとの配置に関する事項"},{"d":1,"t":"五　保安業務区分ごとの保安業務の実施の方法"},{"d":1,"t":"六　保安業務の結果を液化石油ガス販売事業者に連絡する方法"},{"d":1,"t":"七　前各号に掲げるもののほか、保安業務に関し必要な事項"},{"d":0,"t":"３　法第三十五条第一項後段の規定により保安業務規程の変更の認可を受けようとする保安機関は、様式第十八による申請書を法第二十九条第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1}],"del":false},{"id":"規則-40","law":"規則","num":"40","title":"第四十条","cap":"（認定行政庁の変更の場合の届出）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第三十五条の四において準用する法第六条の規定により法第二十九条第一項の認定を受けた者は、様式第十九による届書を従前の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1}],"del":false},{"id":"規則-41","law":"規則","num":"41","title":"第四十一条","cap":"（保安機関の変更の届出）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第三十五条の四において準用する法第八条の規定により保安機関の変更の届出をしようとする者は、様式第二十による届書を法第二十九条第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1},{"d":0,"t":"２　前項の届書には、保安業務を行う事業所（緊急時対応を行う事業所に限る。）の所在地を変更した者にあっては、第三十条第二項第二号の図面を添付しなければならない。","p":1}],"del":false},{"id":"規則-42","law":"規則","num":"42","title":"第四十二条","cap":"（承継の届出）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第三十五条の四において準用する法第十条第三項の規定により保安機関の地位の承継の届出をしようとする者は、法第三十五条の四において準用する法第十条第二項各号のいずれかに該当する場合は当該各号に定める者（当該届出をしようとする者が当該承継により一の産業保安監督部の管轄区域内であって二以上の都道府県の区域内に設置される販売所の事業として販売される液化石油ガスの一般消費者等についての保安業務を行うこととなった場合は、当該販売所の所在地を管轄する産業保安監督部長。以下この項において「新認定行政庁」という。）に様式第二十一による届書を、当該届出をしようとする者の認定をした都道府県知事又は指定都市の長及び当該承継に係る保安機関について法第二十九条第一項の認定をした都道府県知事又は指定都市の長（これらの者が新認定行政庁である場合を除く。）に様式第二十二による届書を、その他の場合は当該承継に係る保安機関について法第二十九条第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に様式第二十一による届書を提出しなければならない。","p":1},{"d":0,"t":"２　前項の届書には、次の書面を添付しなければならない。","p":1},{"d":1,"t":"一　法第三十五条の四において準用する法第十条第一項の規定により保安機関の事業の全部を譲り受けて保安機関の地位を承継した者にあっては、様式第二十二の二による書面及び事業の全部の譲渡しがあったことを証する書面"},{"d":1,"t":"二　法第三十五条の四において準用する法第十条第一項の規定により保安機関の地位を承継した相続人であって、二以上の相続人の全員の同意により選定されたものにあっては、様式第二十三による書面及び戸籍謄本"},{"d":1,"t":"三　法第三十五条の四において準用する法第十条第一項の規定により保安機関の地位を承継した相続人であって、前号の相続人以外のものにあっては、様式第二十四による書面及び戸籍謄本"},{"d":1,"t":"四　法第三十五条の四において準用する法第十条第一項の規定により合併によって保安機関の地位を承継した法人にあっては、その法人の登記事項証明書"},{"d":1,"t":"五　法第三十五条の四において準用する法第十条第一項の規定により分割によって保安機関の地位を承継した法人にあっては、様式第二十四の二による書面、事業の全部の承継があったことを証する書面及びその法人の登記事項証明書"}],"del":false},{"id":"規則-43","law":"規則","num":"43","title":"第四十三条","cap":"（廃止の届出）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第三十五条の四において準用する法第二十三条の規定により保安業務の廃止の届出をしようとする保安機関は、様式第二十五による届書を法第二十九条第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1}],"del":false},{"id":"規則-44","law":"規則","num":"44","title":"第四十四条","cap":"（消費設備の技術上の基準）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"法第三十五条の五の経済産業省令で定める消費設備の技術上の基準は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　次号に掲げるもの以外の消費設備は、次に定める基準に適合すること。"},{"d":2,"t":"イ　配管、ガス栓及び末端ガス栓と燃焼器の間の管は、使用上支障のある腐しょく、割れ等の欠陥がないものであること。"},{"d":2,"t":"ロ　配管には、腐しょくを防止する措置を講ずること。"},{"d":2,"t":"ハ　配管に使用する材料は、その使用条件等に照らし適切なものであること。この場合において、告示で定める材料は、使用しないこと。"},{"d":2,"t":"ニ　配管は、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するものであること。"},{"d":2,"t":"ホ　配管は、その設置又は変更（硬質管以外の管の交換を除く。）の工事の終了後に行う八・四キロパスカル以上の圧力による気密試験に合格するものであること。"},{"d":2,"t":"ヘ　配管は、漏えい試験に合格するものであること。"},{"d":2,"t":"ト　ガスメーターと燃焼器の間の配管その他の設備は、燃焼器の入口における液化石油ガスの圧力を次に定める範囲に保持するものであること。"},{"d":3,"t":"（１）　生活の用に供する液化石油ガスに係るものにあっては、二・〇キロパスカル以上三・三キロパスカル以下"},{"d":3,"t":"（２）　（１）以外のものにあっては、使用する燃焼器に適合した圧力"},{"d":2,"t":"チ　建物の自重及び土圧により損傷を受けるおそれのある配管には、損傷を防止する措置を講ずること。"},{"d":2,"t":"リ　配管は、地くずれ、山くずれ、地盤の不同沈下等のおそれのある場所又は建物の基礎面下に設置しないこと。"},{"d":2,"t":"ヌ　電源により操作される気化装置により発生する液化石油ガスが通る配管には、手動復帰式自動ガス遮断器を設けること。ただし、停電の際に自動的に作動する自家発電機その他操作用電源が停止したとき液化石油ガスの供給を維持するための装置が設けられている場合は、この限りでない。"},{"d":2,"t":"ル　末端ガス栓と燃焼器とを硬質管、液化石油ガス用継手金具付低圧ホース、ゴム管等を用いて接続する場合は、その使用条件に照らし適切なものを用いること。"},{"d":2,"t":"ヲ　末端ガス栓は、告示で定める燃焼器の区分に応じ、告示で定める方法により、燃焼器と接続されていること。ただし、告示で定めるところにより、燃焼器と接続されないで設置されている場合は、この限りでない。"},{"d":2,"t":"ワ　燃焼器は、消費する液化石油ガスに適合したものであること。"},{"d":2,"t":"カ　燃焼器（第八十六条各号に掲げる施設若しくは建築物又は地下室等に設置されているものに限り、告示で定めるものを除く。）は、告示で定めるところにより、令別表第一第十号に掲げる液化石油ガス用ガス漏れ警報器（告示で定める地下室等に設置する場合にあっては、保安状況を常時監視できる場所において液化石油ガスの漏えいを知ることができるものに限る。）の検知区域（当該液化石油ガス用ガス漏れ警報器が液化石油ガスの漏れを検知することができる区域をいう。）に設置されていること。"},{"d":2,"t":"ヨ　次に掲げる燃焼器（屋内に設置するものに限り、密閉式のものを除く。）には、当該燃焼器に接続して排気筒が設けられていること。ただし、当該燃焼器の構造上その他の理由によりこれによることが困難な場合において、当該燃焼器の排気のための排気フードが設けられているときは、この限りでない。"},{"d":3,"t":"（１）　ガス湯沸器（暖房兼用のものを含み、ガス瞬間湯沸器にあっては液化石油ガスの消費量が十二キロワットを超えるもの。その他のものにあっては液化石油ガスの消費量が七キロワットを超えるもの）"},{"d":3,"t":"（２）　ガスバーナー付きふろがま及びその他のふろがまでガスバーナーを使用することができる構造のもの（以下「ガスふろがま」という。）"},{"d":2,"t":"タ　ヨの燃焼器（以下タからソまでにおいて単に「燃焼器」という。）の排気筒は、次の（１）又は（２）に定める基準に適合すること。"},{"d":3,"t":"（１）　自然排気式の燃焼器の排気筒（排気扇が接続されているものを除く。）は、次に定める基準に適合すること。"},{"d":4,"t":"（ｉ）　排気筒の材料は、金属、その他の不燃性のものであること。"},{"d":4,"t":"（ｉｉ）　排気筒には、当該燃焼器と同一室内にある部分の当該燃焼器に近接した箇所に逆風止めが取り付けられていること。ただし、当該燃焼器に逆風止めが取り付けられている場合は、この限りでない。"},{"d":4,"t":"（ｉｉｉ）　排気筒の有効断面積は、当該燃焼器の排気部との接続部の有効断面積より小さくないこと。"},{"d":4,"t":"（ｉｖ）　排気筒の先端は、屋外に出ていること。"},{"d":4,"t":"（ｖ）　排気筒の先端は、障害物又は外気の流れによって排気が妨げられない位置にあること。"},{"d":4,"t":"（ｖｉ）　排気筒の先端は、鳥、落葉及び雨水その他の異物の侵入又は風雨等の圧力により排気が妨げられるおそれのない構造であること。"},{"d":4,"t":"（ｖｉｉ）　排気筒の高さ（逆風止め開口部の下端からの排気筒の先端の開口部（逆風止め開口部の下端から排気筒の先端の開口部までの排気筒の長さが八メートルを超えるときは、逆風止め開口部の下端から八メートル以内にある部分）の高さをいう。以下同じ。）は、次の式により算出した値以上であること。"},{"d":5,"t":"ｈ＝（０．５＋０．４ｎ＋０．１ｌ）／〔ＡＶ／５．１６Ｗ〕２"},{"d":5,"t":"この式において、ｈ、ｎ、ｌ、ＡＶ及びＷは、それぞれ次の値を表すものとする。"},{"d":5,"t":"ｈ　排気筒の高さ（単位　メートル）"},{"d":5,"t":"ｎ　排気筒の曲りの数"},{"d":5,"t":"ｌ　逆風止め開口部の下端から排気筒の先端の開口部までの排気筒の長さ（単位　メートル）"},{"d":5,"t":"ＡＶ　排気筒の有効断面積（単位　平方センチメートル）"},{"d":5,"t":"Ｗ　燃焼器の液化石油ガスの消費量（単位　キロワット）"},{"d":4,"t":"（ｖｉｉｉ）　排気筒の天井裏、床裏等にある部分は、金属以外の不燃性の材料で覆われていること。ただし、燃焼器出口の排気ガスの温度が百度以下の場合は、この限りでない。"},{"d":4,"t":"（ｉｘ）　排気筒は、自重、風圧、振動等に対して、十分耐え、かつ、当該排気筒を構成する各部の接続部及び当該排気筒と当該燃焼器の排気部との接続部が容易に外れないよう堅固に取り付けられていること。"},{"d":4,"t":"（ｘ）　排気筒は、凝縮水等がたまりにくい構造であること。"},{"d":4,"t":"（ｘｉ）　排気筒は、十分な耐食性を有するものであること。"},{"d":3,"t":"（２）　自然排気式の燃焼器の排気筒であって排気扇が接続されているもの及び強制排気式の燃焼器の排気筒は、次に定める基準に適合すること。"},{"d":4,"t":"（ｉ）　排気筒は（１）（ｉ）、（ｉｖ）、（ｖ）（障害物に係る部分に限る。）、（ｖｉ）（鳥、落葉及び雨水その他の異物の侵入に係る部分に限る。）、（ｖｉｉ）、（ｘ）及び（ｘｉ）の基準に適合すること。ただし、強制排気式の燃焼器の排気筒は、これらの基準に加え、（１）（ｉｘ）の基準に適合すること。"},{"d":4,"t":"（ｉｉ）　排気筒が外壁を貫通する箇所には、当該排気筒と外壁との間に排気ガスが屋内に流れ込む隙間がないこと。"},{"d":4,"t":"（ｉｉｉ）　自然排気式の燃焼器の排気筒であって排気扇を接続するものは、自重、風圧、振動等に対して、十分耐え、かつ、当該排気筒を構成する各部の接続部、当該燃焼器の排気部との接続部及び当該排気扇との接続部が容易に外れないよう堅固に取り付けられていること。"},{"d":4,"t":"（ｉｖ）　排気筒の形状は、排気ガスが当該燃焼器の給気口（当該燃焼器又は当該排気筒に逆風止めを取り付ける場合にあっては、当該逆風止め開口部）から流出しないよう風量が十分に確保されるものであること。"},{"d":2,"t":"レ　燃焼器の排気筒に接続される排気扇は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　排気扇（排気ガスに触れる部分に限る。）の材料は、不燃性のものであること。"},{"d":3,"t":"（２）　燃焼器と直接接続する排気扇は、当該燃焼器の排気部との接続部が容易に外れないよう堅固に取り付けられていること。"},{"d":3,"t":"（３）　排気扇には、これが停止した場合に当該燃焼器への液化石油ガスの供給を自動的に遮断する装置が設けられていること。"},{"d":2,"t":"ソ　燃焼器であって、ヨの規定により排気筒が設けられているものは、当該排気筒の有効断面積以上の有効断面積を有する給気口その他給気上有効な開口部が設けられた室に設置されていること。"},{"d":2,"t":"ツ　ガス湯沸器（暖房兼用のものを含み、ガス瞬間湯沸器にあっては液化石油ガスの消費量が十二キロワット以下のもの。その他のものにあっては液化石油ガスの消費量が七キロワット以下のもの）は、換気扇又は有効な給排気のための開口部が設けられた室に設置されていること。ただし、排気フードが設けられているもの並びに排気筒が設けられているものであって、タからソまでの基準に適合するものを除く。"},{"d":2,"t":"ネ　屋内に設置されているガス湯沸器（暖房兼用のものを含む。）及びガスふろがまであって、密閉式のものは、次に定める基準に適合すること。"},{"d":3,"t":"（１）　給排気部（給気に係る部分を除く。）の材料は、金属その他の不燃性のものであること。"},{"d":3,"t":"（２）　給排気部が外壁を貫通する箇所は、当該給排気部と外壁との間に排気ガスが屋内に流れ込む隙間がないこと。"},{"d":3,"t":"（３）　給排気部の先端は、屋外に出ていること。"},{"d":3,"t":"（４）　給排気部の先端は、障害物又は外気の流れによって給排気が妨げられない位置にあること。"},{"d":3,"t":"（５）　給排気部の先端は、鳥、落葉、雨水その他の異物の侵入又は自然給排気式の燃焼器の場合にあっては風雨等の圧力により給排気が妨げられるおそれのない構造であること。"},{"d":3,"t":"（６）　給排気部は、自重、風圧、振動等に対して、十分耐え、かつ、当該給排気部を構成する各部の接続部並びに当該燃焼器のケーシングとの接続部が容易に外れないよう堅固に取り付けられていること。"},{"d":3,"t":"（７）　給排気部は、十分な耐食性を有するものであること。"},{"d":3,"t":"（８）　給排気部は、凝縮水等がたまりにくいよう取り付けられていること。"},{"d":3,"t":"（９）　給排気部の天井裏、床裏等にある部分（給気に係る部分を除く。）は、金属以外の不燃性の材料で覆われていること。ただし、燃焼器出口の排気ガスの温度が百度以下の場合は、この限りでない。"},{"d":3,"t":"（１０）　給排気部の形状は、当該燃焼器の燃焼が妨げられないよう風量が十分に確保されるものであること。"},{"d":2,"t":"ナ　屋外に設置する燃焼器の排気筒又はその給排気部は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　自然排気式の燃焼器の排気筒（排気扇が接続されているものを除く。）であって、屋内に設置する部分を有するものは、タ（１）（ｉｖ）の基準に適合し、かつ、屋内に設置される当該部分は、タ（１）（ｉ）、（ｖｉｉｉ）、（ｉｘ）（燃焼器に係る部分を除く。）、（ｘ）及び（ｘｉ）の基準に適合すること。"},{"d":3,"t":"（２）　自然排気式の燃焼器の排気筒（排気扇が接続されているものに限る。）及び強制排気式の燃焼器の排気筒であって、屋内に設置する部分を有するものは、タ（１）（ｉｖ）、（ｖ）（障害物に係る部分に限る。）及び（ｖｉ）（鳥、落葉、雨水その他の異物の侵入に係る部分に限る。）の基準に適合し、かつ、屋内に設置される当該部分は、タ（１）（ｉ）、（ｖｉｉｉ）、（ｘ）及び（ｘｉ）並びにタ（２）（ｉｉ）及び（ｉｉｉ）の基準に適合すること。"},{"d":3,"t":"（３）　給排気部であって、屋内に設置する部分を有するものは、ネ（２）から（５）まで及び（１０）の基準に適合し、かつ、屋内に設置される当該部分は、ネ（１）及び（６）から（９）までの基準に適合すること。"},{"d":2,"t":"ラ　配管は、次に定める基準に適合するよう修理し、又は取り外すこと。"},{"d":3,"t":"（１）　配管には、当該配管から液化石油ガスが漏えいすることを防止するための措置を講ずること。"},{"d":3,"t":"（２）　配管には、当該配管から漏えいする液化石油ガスが滞留するおそれのある場所において、当該液化石油ガスが漏えいしていないことを確認するための措置を講ずること。"},{"d":3,"t":"（３）　配管には、当該配管の修理又は取り外しが終了したときは、当該配管から液化石油ガスの漏えいのないことを確認するための措置を講ずること。"},{"d":2,"t":"ム　強制排気式の燃焼器であって告示で定めるものは、ガスを燃焼した場合において正常に当該燃焼器から排気が排出されること。"},{"d":1,"t":"二　第十六条第十三号ただし書の規定により質量により液化石油ガスを販売する場合における消費設備は、次のイ又はロに定める基準に適合すること。"},{"d":2,"t":"イ　ロに掲げる消費設備以外の消費設備は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　配管には、次に定める基準に適合する管を使用すること。"},{"d":4,"t":"（ｉ）　充てん容器等と調整器の間に設置される管にあっては、二・六メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":4,"t":"（ｉｉ）　調整器と末端ガス栓の間に設置される管にあっては、〇・八メガパスカル以上の圧力で行う耐圧試験に合格するもの"},{"d":3,"t":"（２）　調整器と末端ガス栓の間の配管は、その設置又は変更（硬質管以外の管の交換を除く。）の工事の終了後に行う八・四キロパスカル以上の圧力による気密試験に合格するものであること。"},{"d":3,"t":"（３）　調整器と燃焼器の間の配管その他の設備は、当該燃焼器の入口における液化石油ガスの圧力を次に定める範囲に保持するものであること。"},{"d":4,"t":"（ｉ）　生活の用に供する液化石油ガスに係るものにあっては、二・〇キロパスカル以上三・三キロパスカル以下"},{"d":4,"t":"（ｉｉ）　（ｉ）以外のものにあっては、使用する燃焼器に適合した圧力"},{"d":3,"t":"（４）　充てん容器等は、第十八条第一号の基準に適合すること。"},{"d":3,"t":"（５）　気化装置は、第十八条第十号（気化装置に係る部分に限る。）及び第十九号の基準に適合すること。"},{"d":3,"t":"（６）　調整器は、第十八条第二十号の基準に適合すること。"},{"d":3,"t":"（７）　配管は、前号ロ、ハ、ヘ、チ及びリの基準に適合すること。"},{"d":3,"t":"（８）　末端ガス栓は、前号ヲの基準に適合すること。"},{"d":3,"t":"（９）　燃焼器は、前号ワ、カ、ヨ、ソ、ツ、ネ及びムの基準に適合すること。"},{"d":3,"t":"（１０）　燃焼器の排気筒は、前号タ及びナ（排気筒に係る部分に限る。）の基準に適合すること。"},{"d":3,"t":"（１１）　燃焼器の排気筒に接続される排気扇は前号レの基準に適合すること。"},{"d":3,"t":"（１２）　内容積が二十リットルを超え二十五リットル以下の容器であって、カップリング付容器用弁を有し、かつ、硬質管に接続されているものは、次の（ｉ）又は（ｉｉ）に掲げるもの及び（ｉｉｉ）に掲げるものが告示で定める方法により設置されていること。ただし、その設置場所又は一般消費者等の液化石油ガスの消費の形態に特段の事情があるとき（（ｉｉ）に掲げるものにあっては、告示で定める場合を含む。）は、この限りでない。"},{"d":4,"t":"（ｉ）　第十八条第二十二号イに定めるガスメーターと同等の保安を確保するための機能を有する機器"},{"d":4,"t":"（ｉｉ）　器具省令別表第一第十四号に規定する液化石油ガス用ガス漏れ警報器（器具省令別表第三の技術上の基準に適合するものに限る。）を用いた機器であって、ガス漏れを検知したときに自動的にガスの供給を停止するもの"},{"d":4,"t":"（ｉｉｉ）　器具省令別表第一第十六号に規定する液化石油ガス用対震自動ガス遮断器（器具省令別表第三の技術上の基準に適合するものに限る。）"},{"d":3,"t":"（１３）　その他前号イ、ヌ及びラの基準に適合すること。"},{"d":3,"t":"（１４）　配管又は調整器から充てん容器等を取り外すときは、その取り外す充てん容器等について、バルブを確実に閉止し、かつ、安全な場所に移す措置を講ずること。"},{"d":2,"t":"ロ　内容積が二十リットル以下の容器に係る消費設備、内容積が二十リットルを超え二十五リットル以下の容器であって、カップリング付容器用弁を有するものに係る消費設備（容器が硬質管に接続されている場合を除く。）又は屋外において移動して使用される消費設備は、次に定める基準に適合すること。"},{"d":3,"t":"（１）　充てん容器等は、第十八条第一号ロからニまでの基準に適合すること。"},{"d":3,"t":"（２）　調整器は、第十八条第二十号の基準に適合すること。"},{"d":3,"t":"（３）　燃焼器は、前号ワの基準に適合すること。"}],"del":false},{"id":"規則-45","law":"規則","num":"45","title":"第四十五条","cap":"（保安確保機器の種類）","capInh":false,"path":"第四章　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"法第三十五条の六第一項の経済産業省令で定める保安確保機器は、次の各号に掲げるものとする。","p":1},{"d":1,"t":"一　一定のガス流量を検知したときに自動的にガスの供給を停止する機能を有する機器であって、告示で定めるもの"},{"d":1,"t":"二　前号の機器によりガス供給を停止したことその他一般消費者等の保安に係る情報（以下「特定保安情報」という。）を電話回線等により自動的に伝達する機器"},{"d":1,"t":"三　前号の機器から伝達された特定保安情報を直ちに示す機器であって、第一号の機器によりガスの供給を停止させることができるもの"},{"d":1,"t":"四　令別表第一第一号の調整器、同表第四号の液化石油ガス用継手金具付高圧ホース、同表第十号の液化石油ガス用ガス漏れ警報器（第四十四条第一号カに規定される場合に限る。）及び同表第十一号の液化石油ガス用継手金具付低圧ホース（調整器とガスメーターの間に設置されるものに限る。）であって、告示で定める基準に適合するもの"}],"del":false},{"id":"規則-46","law":"規則","num":"46","title":"第四十六条","cap":"（保安確保機器の設置及び管理の方法）","capInh":false,"path":"第四章　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"法第三十五条の六第一項の経済産業省令で定める基準は、次に掲げる設置及び管理の方法に応じて、それぞれ次に掲げるものとする。","p":1},{"d":1,"t":"一　第四十九条及び第五十条に規定する特例によることができる設置及び管理の方法"},{"d":2,"t":"イ　前条第一号から第三号までの機器にあっては告示で定める方法により設置していること。"},{"d":2,"t":"ロ　液化石油ガス販売事業者が液化石油ガスの販売契約を締結している一般消費者等のうち、イの方法に基づき保安確保機器が設置されている一般消費者等（以下「認定対象消費者」という。）の割合（以下「認定対象消費者割合」という。）が七十パーセント以上であること。ただし、液化石油ガス販売事業者であって、合併その他の事由による事業の承継により、当該承継の日に認定対象消費者割合が、七十パーセントを下回った場合には、当該承継の日から一年以内は、これを適用しない。"},{"d":2,"t":"ハ　前条第三号の機器を設置している者は常時当該機器を監視する者を配置することにより、特定保安情報を監視していること。"},{"d":2,"t":"ニ　認定対象消費者の供給設備及び消費設備に設置される前条第一号及び第四号の保安確保機器には告示に定めるものが設置されていること。"},{"d":2,"t":"ホ　告示に定める事項を記載した運営管理規程を定め、これにより管理を行うこと。"},{"d":2,"t":"ヘ　保安確保機器を設置する場合は、保安確保機器に係る第十八条、第十九条、第四十四条第一号カ、第五十三条及び第五十四条に掲げる技術上の基準に適合すること。"},{"d":1,"t":"二　第五十条の二に規定する特例によることができる設置及び管理の方法"},{"d":2,"t":"イ　前号イ及びハからヘまでに掲げるもの"},{"d":2,"t":"ロ　認定対象消費者割合が五十パーセント以上であること。ただし、液化石油ガス販売事業者であって、合併その他の事由による事業の承継により、当該承継の日に認定対象消費者割合が、五十パーセントを下回った場合には、当該承継の日から一年以内は、これを適用しない。"}],"del":false},{"id":"規則-47","law":"規則","num":"47","title":"第四十七条","cap":"（液化石油ガス販売事業者の認定申請）","capInh":false,"path":"第四章　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"法第三十五条の六第二項の規定により、同条第一項の認定を受けようとする者は、様式第二十六による申請書に前条第一号ホに掲げる運営管理規程を添付して法第三条第一項の登録をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に提出しなければならない。","p":1}],"del":false},{"id":"規則-47_2","law":"規則","num":"47_2","title":"第四十七条の二","cap":"（認定の失効）","capInh":false,"path":"第四章　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"第四十六条第二号に掲げる基準による認定（以下「第二号認定」という。）を受けた液化石油ガス販売事業者（以下「第二号認定液化石油ガス販売事業者」という。）が同条第一号に掲げる基準による認定（以下「第一号認定」という。）を受けたときは、第二号認定は、その効力を失う。","p":1}],"del":false},{"id":"規則-48","law":"規則","num":"48","title":"第四十八条","cap":"（認定液化石油ガス販売事業者の報告義務）","capInh":false,"path":"第四章　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"法第三十五条の七の規定により、認定液化石油ガス販売事業者は、毎事業年度経過後三月以内にその事業年度末における販売所ごとの液化石油ガスの販売契約を締結している一般消費者等の数及び認定対象消費者の数を様式第二十七により、法第三十五条の六第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に報告しなければならない。ただし、当該事業年度経過後三月以内に次項（第三項において準用する場合を含む。）の規定により報告した場合における当該事業年度については、この限りでない。","p":1},{"d":0,"t":"２　前項において災害その他やむを得ない事由により同項の期間内に報告することが困難であるときは、経済産業大臣が当該事由を勘案して定める期間内に報告しなければならない。","p":1},{"d":0,"t":"３　第一号認定を受けた液化石油ガス販売事業者（以下「第一号認定液化石油ガス販売事業者」という。）は、合併その他の事由による事業の承継により、当該承継の日に認定対象消費者割合が七十パーセントを下回った場合には、遅滞なく、様式第二十七の二に当該承継の事実を証する書面を添えて、当該承継の日における販売所ごとの液化石油ガスの販売契約を締結している一般消費者等の数及び認定対象消費者の数を、法第三十五条の六第一項の認定をした経済産業大臣、産業保安監督部長、都道府県知事又は指定都市の長に報告しなければならない。","p":1},{"d":0,"t":"４　前項の規定は、第二号認定液化石油ガス販売事業者について準用する。この場合において、同項中「七十パーセント」とあるのは、「五十パーセント」と読み替えるものとする。","p":1}],"del":false},{"id":"規則-49","law":"規則","num":"49","title":"第四十九条","cap":"（第一号認定液化石油ガス販売事業者に係る業務主任者の選任の方法等の特例
