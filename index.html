<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--sub:#5d6777;--line:#e2e6ec;--acc:#0f5c8c;--acc2:#e8f1f8;--mark:#ffe58a;--law:#0f5c8c;--rei:#7a4fb0;--kis:#1d7a52}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--ink:#e6e9ee;--sub:#9aa4b3;--line:#2c3440;--acc:#5fb0e8;--acc2:#1d3242;--mark:#7a6420;--law:#5fb0e8;--rei:#b591e6;--kis:#5cc79a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px}
@media (prefers-color-scheme:dark){header{background:#0b3a58}}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.brand small{font-weight:400;opacity:.8;font-size:11px}
.sbox{display:flex;gap:6px}
.sbox input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:0;border-radius:10px;outline:none;background:#fff;color:#1d2430}
.sbox button{border:0;border-radius:10px;padding:0 14px;font-size:15px;background:#fff;color:var(--acc);font-weight:700}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.filters label{flex:none;font-size:12px;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:99px;display:flex;align-items:center;gap:4px}
.filters input{margin:0;accent-color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav a{flex:1;text-align:center;padding:8px 0 6px;font-size:11px;color:var(--sub);text-decoration:none}
nav a b{display:block;font-size:19px;line-height:1.2;font-weight:400}
nav a.on{color:var(--acc);font-weight:700}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
a.card{display:block;color:inherit;text-decoration:none}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.t-法{background:var(--law)}.t-令{background:var(--rei)}.t-規則{background:var(--kis)}.t-wiki{background:#c0762a}
.ttl{font-weight:700}
.cap{color:var(--sub);font-size:13px}
.snip{font-size:14px;color:var(--sub);margin-top:4px;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.meta{font-size:12px;color:var(--sub);margin:4px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;text-decoration:none}
.chip.syn{background:var(--acc2);border-color:transparent;color:var(--acc);font-size:12px;padding:2px 10px}
h2.sec{font-size:14px;color:var(--sub);margin:16px 2px 8px;font-weight:700}
.art .ln{margin:2px 0;overflow-wrap:anywhere}
.art .ln.p{margin-top:10px}
.art .tb{font-size:13px;background:var(--bg);padding:2px 6px;border-radius:4px}
.art .path{font-size:12px;color:var(--sub)}
.art h1{font-size:19px;margin:4px 0 0}
.bar{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.md h1{font-size:20px;margin:4px 0 8px}.md h2{font-size:17px;margin:20px 0 6px;border-left:4px solid var(--acc);padding-left:8px}.md h3{font-size:15px}
.md table{border-collapse:collapse;width:100%;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;min-width:70px}
.md th{background:var(--acc2)}
.md ul{padding-left:20px;margin:6px 0}
.md a{color:var(--acc)}
a.ref{color:var(--acc);text-decoration:underline dotted}
.toc-ch{font-weight:700;font-size:14px;margin:14px 2px 6px;color:var(--sub)}
.toc a{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}
.toc a span:first-child{flex:none;min-width:6.5em;font-weight:700}
.toc a.del{opacity:.45}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg a{flex:1;text-align:center;padding:7px 0;font-size:14px;color:var(--ink);text-decoration:none}
.seg a.on{background:var(--acc);color:#fff;font-weight:700}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
.note{font-size:12px;color:var(--sub);line-height:1.6}
</style>
</head>

<script>
const DATA = {"built":"2026-10-24","laws":[{"key":"法","id":"342AC0000000149","name":"液化石油ガスの保安の確保及び取引の適正化に関する法律","arts":[{"id":"法-1","law":"法","num":"1","title":"第一条","cap":"（目的）","capInh":false,"path":"第一章　総則","lines":[{"d":0,"t":"この法律は、一般消費者等に対する液化石油ガスの販売、液化石油ガス器具等の製造及び販売等を規制することにより、液化石油ガスによる災害を防止するとともに液化石油ガスの取引を適正にし、もつて公共の福祉を増進することを目的とする。","p":1}],"del":false},{"id":"法-2","law":"法","num":"2","title":"第二条","cap":"（定義）","capInh":false,"path":"第一章　総則","lines":[{"d":0,"t":"この法律において「液化石油ガス」とは、プロパン、ブタンその他政令で定める炭化水素を主成分とするガスを液化したもの（その充てんされた容器内又はその容器に附属する気化装置内において気化したものを含む。）をいう。","p":1},{"d":0,"t":"２　この法律において「一般消費者等」とは、液化石油ガスを燃料（自動車用のものを除く。以下この項において同じ。）として生活の用に供する一般消費者及び液化石油ガスの消費の態様が一般消費者が燃料として生活の用に供する場合に類似している者であつて政令で定めるものをいう。","p":1},{"d":0,"t":"３　この法律において「液化石油ガス販売事業」とは、液化石油ガスを一般消費者等に販売する事業（ガス事業法（昭和二十九年法律第五十一号）第二条第二項のガス小売事業及び同条第五項の一般ガス導管事業を除く。）をいう。","p":1},{"d":0,"t":"４　この法律において「供給設備」とは、液化石油ガス販売事業の用に供する液化石油ガスの供給のための設備（船舶内のものを除く。）及びその附属設備であつて、経済産業省令で定めるものをいう。","p":1},{"d":0,"t":"５　この法律において「消費設備」とは、液化石油ガス販売事業を行うことについて次条第一項の登録を受けた者が一般消費者等に販売する液化石油ガスに係る消費のための設備（供給設備に該当するもの及び船舶内のものを除く。）をいう。","p":1},{"d":0,"t":"６　この法律において「液化石油ガス設備士」とは、液化石油ガス設備士免状の交付を受けている者をいう。","p":1},{"d":0,"t":"７　この法律において「液化石油ガス器具等」とは、主として一般消費者等が液化石油ガスを消費する場合に用いられる機械、器具又は材料（一般消費者等が消費する液化石油ガスの供給に用いられるものを含む。）であつて、政令で定めるものをいう。","p":1},{"d":0,"t":"８　この法律において「特定液化石油ガス器具等」とは、構造、使用条件、使用状況等からみて特に液化石油ガスによる災害の発生のおそれが多いと認められる液化石油ガス器具等であつて、政令で定めるものをいう。","p":1},{"d":0,"t":"９　この法律において「取引デジタルプラットフォーム」とは、特定デジタルプラットフォームの透明性及び公正性の向上に関する法律（令和二年法律第三十八号）第二条第一項に規定するデジタルプラットフォームのうち、当該デジタルプラットフォームにより提供される場が次の各号のいずれかの機能を有するものをいう。","p":1},{"d":1,"t":"一　当該デジタルプラットフォームを利用する一般消費者等が、その使用に係る電子計算機の映像面に表示される手続に従つて当該電子計算機を用いて送信することによつて、液化石油ガス器具等の製造、輸入又は販売の事業を行う者（自らが提供する当該デジタルプラットフォームを利用して液化石油ガス器具等の販売を行う場合におけるものを除く。次号において同じ。）に対し、液化石油ガス器具等の通信販売（特定商取引に関する法律（昭和五十一年法律第五十七号）第二条第二項に規定する通信販売をいう。同号及び第六十六条において同じ。）に係る売買契約の申込みの意思表示を行うことができる機能"},{"d":1,"t":"二　当該デジタルプラットフォームを利用する一般消費者等が、その使用に係る電子計算機の映像面に表示される手続に従つて当該電子計算機を用いて送信することによつて、競りその他の政令で定める方法により液化石油ガス器具等の製造、輸入又は販売の事業を行う者の液化石油ガス器具等の通信販売に係る売買契約の相手方となるべき一般消費者等を決定する手続に参加することができる機能（前号に該当するものを除く。）"},{"d":0,"t":"１０　この法律において「取引デジタルプラットフォーム提供者」とは、事業として、取引デジタルプラットフォームを単独で又は共同して提供する者をいう。","p":1},{"d":0,"t":"１１　この法律において、輸入する行為には、外国にある者が外国から日本国内に他人をして持ち込ませ、一般消費者等に引き取らせる行為が含まれるものとする。","p":1}],"del":false},{"id":"法-3","law":"法","num":"3","title":"第三条","cap":"（事業の登録）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業を行おうとする者は、二以上の都道府県の区域内に販売所を設置してその事業を行おうとする場合にあつては経済産業大臣の、一の都道府県の区域内にのみ販売所を設置してその事業を行おうとする場合にあつては当該販売所の所在地を管轄する都道府県知事（一の指定都市（地方自治法（昭和二十二年法律第六十七号）第二百五十二条の十九第一項に規定する指定都市をいう。以下同じ。）の区域内にのみ販売所を設置してその事業を行おうとする場合にあつては、当該販売所の所在地を管轄する指定都市の長）の登録を受けなければならない。","p":1},{"d":0,"t":"２　前項の登録を受けようとする者は、次の事項を記載した申請書を経済産業大臣、都道府県知事又は指定都市の長（以下「経済産業大臣等」という。）に提出しなければならない。","p":1},{"d":1,"t":"一　氏名又は名称及び住所並びに法人にあつては、その代表者の氏名"},{"d":1,"t":"二　販売所の名称及び所在地"},{"d":1,"t":"三　液化石油ガス販売事業の用に供する液化石油ガスの貯蔵施設（以下「貯蔵施設」という。）の位置及び構造"},{"d":1,"t":"四　液化石油ガスの販売契約を締結する一般消費者等について第二十七条第一項に掲げる業務を行う第二十九条第一項の認定を受けた者の氏名又は名称及びその事業所の所在地"},{"d":1,"t":"五　その販売した液化石油ガスにより一般消費者等の生命、身体又は財産について損害が生じ、その被害者に対してその損害の賠償を行うべき場合に備えてとるべき措置"},{"d":0,"t":"３　前項第三号に掲げる事項は、第十一条ただし書の経済産業省令で定める場合にあつては、同項の申請書に記載することを要しない。この場合において、貯蔵施設を所有又は占有しない理由を記載しなければならない。","p":1},{"d":0,"t":"４　第二項の申請書には、第四条第一項各号のいずれにも該当しないことを誓約する書面その他の経済産業省令で定める書類を添付しなければならない。","p":1}],"del":false},{"id":"法-3_2","law":"法","num":"3_2","title":"第三条の二","cap":"（登録の実施）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣等は、前条第二項の登録の申請があつたときは、次条第一項の規定により登録を拒否する場合を除くほか、前条第二項第一号及び第二号の事項並びに登録の年月日及び登録番号を液化石油ガス販売事業者登録簿に登録しなければならない。","p":1},{"d":0,"t":"２　経済産業大臣等は、前項の登録をしたときは、遅滞なく、その旨を申請者に通知しなければならない。","p":1},{"d":0,"t":"３　何人も、経済産業大臣等に対し、液化石油ガス販売事業者登録簿の謄本の交付又は閲覧を請求することができる。","p":1}],"del":false},{"id":"法-4","law":"法","num":"4","title":"第四条","cap":"（登録の拒否）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣等は、第三条第一項の登録を受けようとする者が次の各号のいずれかに該当するとき、又は同条第二項の申請書若しくは同条第四項の添付書類のうちに重要な事項について虚偽の記載があり、若しくは重要な事実の記載が欠けているときは、その登録を拒否しなければならない。","p":1},{"d":1,"t":"一　この法律、高圧ガス保安法（昭和二十六年法律第二百四号）若しくは脱炭素成長型経済構造への円滑な移行のための低炭素水素等の供給及び利用の促進に関する法律（令和六年法律第三十七号）（第四章第三節、第三十七条第二項及び第三十八条第一項の規定に限る。第三十条第一号において「水素等供給等促進法」という。）又はこれらの法律に基づく命令の規定に違反し、罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつた日から二年を経過しない者"},{"d":1,"t":"二　第二十六条の規定により登録を取り消され、その取消しの日から二年を経過しない者"},{"d":1,"t":"三　心身の故障により液化石油ガス販売事業を適正に行うことができない者として経済産業省令で定める者"},{"d":1,"t":"四　法人であつて、その業務を行う役員のうちに前三号のいずれかに該当する者があるもの"},{"d":1,"t":"五　第三条第二項第五号の措置が経済産業省令で定める基準に適合していない者"},{"d":0,"t":"２　経済産業大臣等は、前項の規定により第三条第一項の登録を拒否したときは、同時に、その理由を示して、その旨を申請者に書面により通知しなければならない。","p":1}],"del":false},{"id":"法-5","law":"法","num":"5","title":"第五条","cap":"（登録の拒否）","capInh":true,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"法-6","law":"法","num":"6","title":"第六条","cap":"（登録行政庁の変更の場合における届出等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"第三条第一項の登録を受けた者（以下「液化石油ガス販売事業者」という。）は、同項の登録を受けた後次の各号のいずれかに該当して引き続き液化石油ガス販売事業を行おうとする場合（第十条第一項の規定により他の液化石油ガス販売事業者の地位を承継したことにより次の各号のいずれかに該当して引き続き液化石油ガス販売事業を行おうとする場合を除く。）において第三条第一項の規定により経済産業大臣等の登録を受けたときは、経済産業省令で定めるところにより、遅滞なく、その旨を従前の登録をした経済産業大臣等に届け出なければならない。","p":1},{"d":1,"t":"一　経済産業大臣の登録を受けた者が一の都道府県又は指定都市の区域内にのみ販売所を有することとなつたとき。"},{"d":1,"t":"二　都道府県知事の登録を受けた者が他の一の都道府県又は一の指定都市の区域内にのみ販売所を有することとなつたとき。"},{"d":1,"t":"三　都道府県知事の登録を受けた者が二以上の都道府県の区域内に販売所を有することとなつたとき。"},{"d":1,"t":"四　指定都市の長の登録を受けた者が当該指定都市の区域以外の区域内に販売所を有することとなつたとき。"}],"del":false},{"id":"法-7","law":"法","num":"7","title":"第七条","cap":"（標識の掲示等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、経済産業省令で定める様式の標識について、販売所ごとに公衆の見やすい場所に掲示するとともに、その事業の規模が著しく小さい場合その他の経済産業省令で定める場合を除き、経済産業省令で定めるところにより、電気通信回線に接続して行う自動公衆送信（公衆によつて直接受信されることを目的として公衆からの求めに応じ自動的に送信を行うことをいい、放送又は有線放送に該当するものを除く。次項において同じ。）により公衆の閲覧に供しなければならない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者以外の者は、前項の標識又はこれに類似する標識を掲示し、又は電気通信回線に接続して行う自動公衆送信により公衆の閲覧に供してはならない。","p":1}],"del":false},{"id":"法-8","law":"法","num":"8","title":"第八条","cap":"（販売所等の変更の届出）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、第三条第二項各号の事項を変更したときは、経済産業省令で定めるところにより、遅滞なく、その登録をした経済産業大臣等に届け出なければならない。","p":1}],"del":false},{"id":"法-9","law":"法","num":"9","title":"第九条","cap":"（販売所等の変更の届出）","capInh":true,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"法-10","law":"法","num":"10","title":"第十条","cap":"（承継）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者がその事業の全部を譲り渡し、又は液化石油ガス販売事業者について相続、合併若しくは分割（その事業の全部を承継させるものに限る。）があつたときは、その事業の全部を譲り受けた者又は相続人（相続人が二人以上ある場合において、その全員の同意により事業を承継すべき相続人を選定したときは、その者）、合併後存続する法人若しくは合併により設立した法人若しくは分割によりその事業の全部を承継した法人は、その液化石油ガス販売事業者の地位を承継する。ただし、当該事業の全部を譲り受けた者又は相続人（相続人が二人以上ある場合において、その全員の同意により事業を承継すべき相続人を選定したときは、その者）、合併後存続する法人若しくは合併により設立した法人若しくは分割により当該事業の全部を承継した法人が第四条第一項各号のいずれかに該当するときは、この限りでない。","p":1},{"d":0,"t":"２　前項の規定により液化石油ガス販売事業者の地位を承継した者は、次の各号のいずれかに該当する場合には、自ら第三条第一項の都道府県知事の登録若しくは指定都市の長の登録を受けた事業又は当該承継に係る事業であつて同項の都道府県知事の登録若しくは指定都市の長の登録を受けたものについて、当該承継の時に次の各号に掲げる場合の区分に応じ、それぞれ当該各号に定める者の同項の登録を受けたものとみなす。","p":1},{"d":1,"t":"一　第三条第一項の経済産業大臣の登録を受けた者が同項の都道府県知事の登録又は指定都市の長の登録を受けた者の地位を承継したとき　経済産業大臣"},{"d":1,"t":"二　第三条第一項の都道府県知事の登録を受けた者が次のイ又はロに掲げる者の地位を承継したとき　当該イ又はロに定める者"},{"d":2,"t":"イ　第三条第一項の経済産業大臣の登録、他の都道府県知事の登録又は指定都市（その登録に係る都道府県の区域外の指定都市に限る。）の長の登録を受けた者　経済産業大臣"},{"d":2,"t":"ロ　第三条第一項の指定都市（イに規定する指定都市を除く。）の長の登録を受けた者　都道府県知事"},{"d":1,"t":"三　第三条第一項の指定都市の長の登録を受けた者が次のイ又はロに掲げる者の地位を承継したとき　当該イ又はロに定める者"},{"d":2,"t":"イ　第三条第一項の経済産業大臣の登録、都道府県知事（その登録に係る指定都市の区域を管轄しない都道府県知事に限る。）の登録又は他の指定都市（その登録に係る指定都市と同一の都道府県の区域内の指定都市を除く。）の長の登録を受けた者　経済産業大臣"},{"d":2,"t":"ロ　第三条第一項の都道府県知事（イに規定する都道府県知事を除く。）の登録又は他の指定都市（イに規定する指定都市を除く。）の長の登録を受けた者　都道府県知事"},{"d":1,"t":"四　第三条第一項の登録を受けていない者が、同時に、同項の経済産業大臣の登録を受けた者の地位及び同項の都道府県知事の登録若しくは指定都市の長の登録を受けた者の地位を承継したとき、同項の都道府県知事の登録を受けた者の地位及び同項の指定都市（当該都道府県の区域外の指定都市に限る。）の長の登録を受けた者の地位を承継したとき、同項の都道府県知事の登録を受けた二以上の者の地位を承継したとき（当該都道府県が同一であるときを除く。）、又は同項の指定都市の長の登録を受けた二以上の者の地位を承継したとき（当該指定都市が同一の都道府県の区域内の指定都市であるときを除く。）　経済産業大臣"},{"d":1,"t":"五　第三条第一項の登録を受けていない者が、同時に、同項の都道府県知事の登録を受けた者の地位及び同項の指定都市（当該都道府県の区域内の指定都市に限る。）の長の登録を受けた者の地位を承継したとき、又は同項の指定都市の長の登録を受けた二以上の者の地位を承継したとき（当該指定都市が同一の都道府県の区域内の指定都市であるときに限り、同一の指定都市であるときを除く。）　都道府県知事"},{"d":0,"t":"３　第一項の規定により液化石油ガス販売事業者の地位を承継した者は、経済産業省令で定めるところにより、遅滞なく、その旨を経済産業大臣等に届け出なければならない。","p":1}],"del":false},{"id":"法-11","law":"法","num":"11","title":"第十一条","cap":"（貯蔵施設）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、経済産業省令で定めるところにより、自己の用に供する液化石油ガスの貯蔵施設を所有し、又は占有しなければならない。ただし、液化石油ガスを貯蔵しないでその液化石油ガス販売事業を円滑に行うことができる場合等として経済産業省令で定める場合にあつては、この限りでない。","p":1}],"del":false},{"id":"法-12","law":"法","num":"12","title":"第十二条","cap":"（貯蔵施設）","capInh":true,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"法-13","law":"法","num":"13","title":"第十三条","cap":"（規格に適合しない液化石油ガスの販売の禁止等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、液化石油ガスの規格として経済産業省令で定めるものに適合しない液化石油ガスの一般消費者等に対する販売（液化石油ガスを一般消費者等に現に引き渡しその消費された液化石油ガスのみについて代金を受領する販売の場合には、引渡し）をしてはならない。","p":1},{"d":0,"t":"２　経済産業大臣等は、その登録をした液化石油ガス販売事業者が前項の規定に違反した場合において、その販売した液化石油ガスによる災害が発生するおそれがあると認めるときは、当該液化石油ガス販売事業者に対し、その販売に係る液化石油ガスによる災害の発生の防止に関し必要な措置をとるべきことを命ずることができる。","p":1}],"del":false},{"id":"法-14","law":"法","num":"14","title":"第十四条","cap":"（書面の交付）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、一般消費者等と液化石油ガスの販売契約を締結したときは、遅滞なく、次の事項を記載した書面を当該一般消費者等に交付しなければならない。当該交付した書面に記載した事項を変更したときは、当該変更した部分についても、同様とする。","p":1},{"d":1,"t":"一　液化石油ガスの種類"},{"d":1,"t":"二　液化石油ガスの引渡しの方法"},{"d":1,"t":"三　供給設備及び消費設備の管理の方法"},{"d":1,"t":"四　第二十七条第一項第二号に規定する調査の方法及び同項第三号に規定する周知の方法"},{"d":1,"t":"五　当該一般消費者等について第二十七条第一項各号に掲げる業務を行う第二十九条第一項の認定を受けた者の氏名又は名称"},{"d":1,"t":"六　前各号に掲げるもののほか、経済産業省令で定める事項"},{"d":0,"t":"２　経済産業大臣等は、その登録を受けた液化石油ガス販売事業者が前項の規定に違反した場合においては、当該液化石油ガス販売事業者に対し、同項の規定による書面を交付し、又は同項各号に掲げる事項を記載した書面を再交付すべきことを命ずることができる。","p":1},{"d":0,"t":"３　液化石油ガス販売事業者は、前二項の規定による書面の交付（再交付を含む。以下この項において同じ。）に代えて、政令で定めるところにより、一般消費者等の承諾を得て、当該書面に記載すべき事項を電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であつて経済産業省令で定めるものにより提供することができる。この場合において、当該液化石油ガス販売事業者は、当該書面の交付をしたものとみなす。","p":1}],"del":false},{"id":"法-15","law":"法","num":"15","title":"第十五条","cap":"（書面の交付）","capInh":true,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"法-16","law":"法","num":"16","title":"第十六条","cap":"（基準適合義務等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、その液化石油ガス販売事業の用に供する貯蔵施設を経済産業省令で定める技術上の基準（経済産業省令で定める量以上の液化石油ガスを貯蔵する貯蔵施設にあつては、第三十七条の経済産業省令で定める技術上の基準。第三項において同じ。）に適合するように維持しなければならない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者は、経済産業省令で定める基準に従つて液化石油ガスの販売（販売に係る貯蔵を含む。次項、第二十条第一項、第二十一条第一項及び第八十七条第二項において同じ。）をしなければならない。","p":1},{"d":0,"t":"３　経済産業大臣等は、その登録を受けた液化石油ガス販売事業者の貯蔵施設又は販売の方法が第一項の経済産業省令で定める技術上の基準又は前項の経済産業省令で定める基準に適合していないと認めるときは、その技術上の基準に適合するように貯蔵施設を修理し、改造し、若しくは移転し、又はその基準に従つて液化石油ガスの販売をすべきことを命ずることができる。","p":1}],"del":false},{"id":"法-16_2","law":"法","num":"16_2","title":"第十六条の二","cap":"（基準適合義務等）","capInh":true,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、供給設備を経済産業省令で定める技術上の基準（経済産業省令で定める供給設備（以下「特定供給設備」という。）にあつては、第三十七条の経済産業省令で定める技術上の基準。次項、第二十七条第一項第一号、第三十八条の二及び第三十八条の八第一項において同じ。）に適合するように維持しなければならない。","p":1},{"d":0,"t":"２　経済産業大臣等は、その登録を受けた液化石油ガス販売事業者の供給設備が前項の経済産業省令で定める技術上の基準に適合していないと認めるときは、その技術上の基準に適合するように供給設備を修理し、改造し、又は移転すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-17","law":"法","num":"17","title":"第十七条","cap":"（勧告等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣は、液化石油ガス販売事業者の事業の運営が適正を欠いているため、液化石油ガスによる災害の発生の防止又は一般消費者等の利便の確保に支障を生じ、又は生じるおそれがある場合において、特に必要があると認めるときは、産業構造審議会の意見を聴いて、当該液化石油ガス販売事業者に対し、必要な措置をとるべきことを勧告することができる。","p":1},{"d":0,"t":"２　経済産業大臣は、前項の規定による勧告をした場合において、液化石油ガス販売事業者がその勧告に従わなかつたときは、その旨を公表することができる。","p":1}],"del":false},{"id":"法-18","law":"法","num":"18","title":"第十八条","cap":"（保安教育）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、その従業者に保安教育を施さなければならない。","p":1},{"d":0,"t":"２　高圧ガス保安協会（以下「協会」という。）は、液化石油ガスによる災害の防止に資するため、前項の保安教育を施すに当たつて基準となるべき事項を作成し、これを公表しなければならない。","p":1}],"del":false},{"id":"法-19","law":"法","num":"19","title":"第十九条","cap":"（業務主任者）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、販売所ごとに、経済産業省令で定める基準に従つて、販売主任者免状（高圧ガス保安法第二十八条第一項の高圧ガス販売主任者免状であつて経済産業省令で定める種類のものをいう。以下同じ。）の交付を受けている者であつて、経済産業省令で定める液化石油ガスの販売に関する経験を有する者のうちから、液化石油ガス業務主任者（以下「業務主任者」という。）を選任し、次条第一項に規定する業務主任者の職務を行わせなければならない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者は、前項の規定により業務主任者を選任したときは、遅滞なく、その旨をその登録をした経済産業大臣等に届け出なければならない。これを解任したときも、同様とする。","p":1},{"d":0,"t":"３　液化石油ガス販売事業者は、経済産業省令で定めるところにより、業務主任者に協会又は高圧ガス保安法第三十一条第三項の指定講習機関の行う液化石油ガスによる災害の発生の防止に関する講習を受けさせなければならない。","p":1}],"del":false},{"id":"法-20","law":"法","num":"20","title":"第二十条","cap":"（業務主任者の職務等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"業務主任者は、液化石油ガスの販売に係る保安に関し経済産業省令で定める職務を行なう。","p":1},{"d":0,"t":"２　業務主任者は、誠実にその職務を行なわなければならない。","p":1},{"d":0,"t":"３　液化石油ガス販売事業に従事する者は、業務主任者がこの法律又はこの法律に基づく命令の実施を確保するためにする指示に従わなければならない。","p":1}],"del":false},{"id":"法-21","law":"法","num":"21","title":"第二十一条","cap":"（業務主任者の代理者）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、販売所ごとに、経済産業省令で定めるところにより、販売主任者免状の交付を受けている者であつて、経済産業省令で定める液化石油ガスの販売に関する経験を有する者又は経済産業省令で定める条件に適合する液化石油ガスの販売に関する知識経験を有する者のうちから、あらかじめ、業務主任者の代理者を選任し、業務主任者が旅行、疾病その他の事故によつてその職務を行うことができない場合に、その職務を代行させなければならない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者は、前項の代理者を選任したときは、遅滞なく、その旨をその登録をした経済産業大臣等に届け出なければならない。これを解任したときも、同様とする。","p":1},{"d":0,"t":"３　第一項の代理者は、業務主任者の職務を代行する場合は、この法律及びこの法律に基づく命令の規定の適用については、業務主任者とみなす。","p":1}],"del":false},{"id":"法-22","law":"法","num":"22","title":"第二十二条","cap":"（業務主任者等の解任命令）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣等は、業務主任者若しくはその代理者がこの法律若しくは高圧ガス保安法若しくはこれらの法律に基づく命令の規定に違反したとき、又はこれらの者にその職務を行わせることが公共の安全の維持若しくは災害の発生の防止に支障を及ぼすおそれがあると認めるときは、その登録を受けた液化石油ガス販売事業者に対し、当該業務主任者又はその代理者を解任すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-23","law":"法","num":"23","title":"第二十三条","cap":"（廃止の届出）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者は、液化石油ガス販売事業を廃止したときは、経済産業省令で定めるところにより、遅滞なく、その旨をその登録をした経済産業大臣等に届け出なければならない。","p":1}],"del":false},{"id":"法-24","law":"法","num":"24","title":"第二十四条","cap":"（登録の失効）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"液化石油ガス販売事業者が第六条に規定する場合において第三条第一項の規定により経済産業大臣等の登録を受けたときは、その者に係る従前の経済産業大臣等の同項の登録は、その効力を失う。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者が第十条第二項の規定により第三条第一項の経済産業大臣又は都道府県知事の登録を受けたものとみなされたときは、それぞれ、その者に係る従前の経済産業大臣等の同項の登録は、その効力を失う。","p":1},{"d":0,"t":"３　液化石油ガス販売事業者がその液化石油ガス販売事業を廃止したときは、その者に係る第三条第一項の経済産業大臣等の登録は、その効力を失う。","p":1}],"del":false},{"id":"法-25","law":"法","num":"25","title":"第二十五条","cap":"（登録の取消し等）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣等は、その登録を受けた液化石油ガス販売事業者が正当な理由がないのに、液化石油ガス販売事業を一年以内に開始せず、又は一年以上引き続き休止したときは、その登録を取り消すことができる。","p":1}],"del":false},{"id":"法-26","law":"法","num":"26","title":"第二十六条","cap":"（登録の取消し等）","capInh":true,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣等は、その登録を受けた液化石油ガス販売事業者が次の各号のいずれかに該当するときは、その登録を取り消し、又は期間を定めてその液化石油ガス販売事業の全部若しくは一部の停止を命ずることができる。","p":1},{"d":1,"t":"一　第四条第一項第一号、第三号、第四号又は第五号に該当するに至つたとき。"},{"d":1,"t":"二　第八条の規定に違反して第三条第二項第二号から第五号までの事項を変更したとき。"},{"d":1,"t":"三　第十一条、第十三条第一項、第十九条第一項若しくは第三項又は第二十七条の規定に違反したとき。"},{"d":1,"t":"四　第十三条第二項、第十四条第二項、第十六条第三項、第十六条の二第二項又は第二十二条の規定による命令に違反したとき。"},{"d":1,"t":"五　第三十七条の三第一項の規定に違反して貯蔵施設（第十六条第一項の経済産業省令で定める量以上の液化石油ガスを貯蔵するものに限る。）又は特定供給設備を使用したとき。"},{"d":1,"t":"六　高圧ガス保安法第三十九条第一号若しくは第三号の規定による命令又は同条第二号の規定による禁止若しくは制限に違反したとき。"},{"d":1,"t":"七　不正の手段により第三条第一項の登録を受けたとき。"}],"del":false},{"id":"法-26_2","law":"法","num":"26_2","title":"第二十六条の二","cap":"（登録の消除）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"経済産業大臣等は、液化石油ガス販売事業者の登録がその効力を失つたときは、その登録を消除しなければならない。","p":1}],"del":false},{"id":"法-26_3","law":"法","num":"26_3","title":"第二十六条の三","cap":"（経済産業省令への委任）","capInh":false,"path":"第二章　液化石油ガス販売事業","lines":[{"d":0,"t":"この章に規定するもののほか、液化石油ガス販売事業の登録の手続その他この章の規定の実施に関し必要な手続的事項は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-27","law":"法","num":"27","title":"第二十七条","cap":"（保安業務を行う義務）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"液化石油ガス販売事業者は、その販売契約を締結している一般消費者等について次に掲げる業務（以下「保安業務」という。）を行わなければならない。","p":1},{"d":1,"t":"一　供給設備を点検し、その供給設備が第十六条の二第一項の経済産業省令で定める技術上の基準に適合しないと認めるときは、遅滞なく、その技術上の基準に適合するようにするためにとるべき措置及びその措置をとらなかつた場合に生ずべき結果をその供給設備により液化石油ガスを供給している液化石油ガス販売事業者に通知する業務"},{"d":1,"t":"二　消費設備を調査し、その消費設備が第三十五条の五の経済産業省令で定める技術上の基準に適合しないと認めるときは、遅滞なく、その技術上の基準に適合するようにするためにとるべき措置及びその措置をとらなかつた場合に生ずべき結果をその所有者又は占有者に通知する業務"},{"d":1,"t":"三　液化石油ガスを消費する一般消費者等に対し、液化石油ガスによる災害の発生の防止に関し必要な事項であつて経済産業省令で定めるものを周知させる業務"},{"d":1,"t":"四　液化石油ガスによる災害が発生し、又は発生するおそれがある場合において、当該液化石油ガスに係る一般消費者等からその事実を通知され、これに対する措置を講ずることを求められたとき、又は自らその事実を知つたときに、速やかにその措置を講ずる業務"},{"d":0,"t":"２　前項の規定は、液化石油ガス販売事業者が第二十九条第一項の認定を受けた者（以下「保安機関」という。）にその認定に係る保安業務の全部又は一部について委託しているときは、その委託している保安業務の範囲において、その委託に係る一般消費者等については、適用しない。","p":1},{"d":0,"t":"３　液化石油ガス販売事業者は、保安業務の全部又は一部について自ら行おうとするときは、第二十九条第一項の認定を受けなければならない。","p":1}],"del":false},{"id":"法-28","law":"法","num":"28","title":"第二十八条","cap":"（保安業務の委託）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"液化石油ガス販売事業者及び保安機関は、保安業務につき委託契約を締結するときは、次の事項を書面に記載し、署名又は記名押印をして相互に交付しなければならない。","p":1},{"d":1,"t":"一　委託に係る一般消費者等の氏名又は名称及び住所並びに法人にあつては、その代表者の氏名"},{"d":1,"t":"二　委託に係る保安業務の範囲及び期間並びに実施の方法"},{"d":1,"t":"三　前二号に掲げるもののほか、経済産業省令で定める事項"},{"d":0,"t":"２　前項の委託契約の当事者は、同項の規定による書面の交付に代えて、政令で定めるところにより、当該契約の相手方の承諾を得て、当該書面に記載すべき事項を電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であつて経済産業省令で定めるものにより提供することができる。この場合において、当該委託契約の当事者は、当該書面の交付をしたものとみなす。","p":1}],"del":false},{"id":"法-29","law":"法","num":"29","title":"第二十九条","cap":"（認定）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"保安業務を行おうとする者は、経済産業省令で定める保安業務の区分（以下「保安業務区分」という。）に従い、二以上の都道府県の区域に設置される販売所の事業として販売される液化石油ガスの一般消費者等についての保安業務を行う場合にあつては経済産業大臣の、一の都道府県の区域内に設置される販売所の事業として販売される液化石油ガスの一般消費者等についての保安業務を行う場合にあつては当該販売所の所在地を管轄する都道府県知事（一の指定都市の区域内に設置される販売所の事業として販売される液化石油ガスの一般消費者等についての保安業務を行う場合にあつては、当該販売所の所在地を管轄する指定都市の長）の認定を受けることができる。","p":1},{"d":0,"t":"２　前項の認定を受けようとする者は、経済産業省令で定めるところにより、次の事項を記載した申請書を経済産業大臣等に提出しなければならない。","p":1},{"d":1,"t":"一　氏名又は名称及び住所並びに法人にあつては、その代表者の氏名"},{"d":1,"t":"二　保安業務区分"},{"d":1,"t":"三　保安業務を行う事業所の所在地"},{"d":0,"t":"３　第一項の認定の申請は、保安業務に係る一般消費者等の数の範囲を定めてしなければならない。","p":1}],"del":false},{"id":"法-30","law":"法","num":"30","title":"第三十条","cap":"（欠格条項）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"次の各号のいずれかに該当する者は、前条第一項の認定を受けることができない。","p":1},{"d":1,"t":"一　この法律、高圧ガス保安法若しくは水素等供給等促進法又はこれらの法律に基づく命令の規定に違反し、罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつた日から二年を経過しない者"},{"d":1,"t":"二　第三十五条の三の規定により認定を取り消され、その取消しの日から二年を経過しない者"},{"d":1,"t":"三　心身の故障により保安業務を適正に行うことができない者として経済産業省令で定める者"},{"d":1,"t":"四　法人であつて、その業務を行う役員のうちに前三号のいずれかに該当する者があるもの"}],"del":false},{"id":"法-31","law":"法","num":"31","title":"第三十一条","cap":"（認定の基準）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"経済産業大臣等は、第二十九条第一項の認定の申請が次の各号のいずれにも適合していると認めるときでなければ、その認定をしてはならない。","p":1},{"d":1,"t":"一　保安業務に係る技術的能力が経済産業省令で定める基準に適合するものであること。"},{"d":1,"t":"二　その保安業務により一般消費者等の生命、身体又は財産について損害が生じ、その被害者に対してその損害の賠償を行うべき場合に備えてとるべき措置が経済産業省令で定める基準に適合するものであること。"},{"d":1,"t":"三　法人にあつては、その役員又は法人の種類に応じて経済産業省令で定める構成員の構成が保安業務の公正な遂行に支障を及ぼすおそれがないものであること。"},{"d":1,"t":"四　保安業務以外の業務を行つているときは、その業務を行うことによつて保安業務の適確な遂行に支障を及ぼすおそれがないものであること。"}],"del":false},{"id":"法-32","law":"法","num":"32","title":"第三十二条","cap":"（保安機関の認定の更新）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"第二十九条第一項の認定は、五年以上十年以内において政令で定める期間ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。","p":1},{"d":0,"t":"２　第二十九条第二項及び第三項並びに前条の規定は、前項の認定の更新に準用する。","p":1}],"del":false},{"id":"法-33","law":"法","num":"33","title":"第三十三条","cap":"（一般消費者等の数の増加の認可等）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"保安機関は、その保安業務に係る一般消費者等の数を第二十九条第三項の数の範囲を超えて増加しようとするときは、経済産業省令で定めるところにより、その認定をした経済産業大臣等の認可を受けなければならない。","p":1},{"d":0,"t":"２　保安機関は、その保安業務に係る一般消費者等の数を第二十九条第三項の数の範囲を超えて減少したときは、経済産業省令で定めるところにより、遅滞なく、その旨をその認定をした経済産業大臣等に届け出なければならない。","p":1},{"d":0,"t":"３　第三十一条（第三号及び第四号を除く。）の規定は、第一項の認可に準用する。","p":1}],"del":false},{"id":"法-34","law":"法","num":"34","title":"第三十四条","cap":"（保安機関の業務等）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"保安機関は、保安業務を行うべきときは、経済産業省令で定める基準に従つて、その保安業務を行わなければならない。ただし、供給設備又は消費設備の設置の場所その他保安業務を行うべき場所に立ち入ることにつき、その所有者又は占有者の承諾を得ることができないときは、この限りでない。","p":1},{"d":0,"t":"２　保安機関は、保安業務を行うべき場合において、これを他人に委託してはならない。","p":1},{"d":0,"t":"３　経済産業大臣等は、その認定を受けた保安機関が保安業務を行うべき場合において、その保安業務を行わず、又はその方法が適当でないときは、当該保安機関に対し、その保安業務を行い、又はその方法を改善すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-35","law":"法","num":"35","title":"第三十五条","cap":"（保安業務規程）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"保安機関は、保安業務に関する規程（以下この章において「保安業務規程」という。）を定め、その認定をした経済産業大臣等の認可を受けなければならない。これを変更しようとするときも、同様とする。","p":1},{"d":0,"t":"２　保安業務規程で定めるべき事項は、経済産業省令で定める。","p":1},{"d":0,"t":"３　第一項の認可をした経済産業大臣等は、その認可をした保安業務規程が保安業務の適確な遂行上不適当となつたと認めるときは、その保安機関に対し、その保安業務規程を変更すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-35_2","law":"法","num":"35_2","title":"第三十五条の二","cap":"（適合命令）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"経済産業大臣等は、その認定を受けた保安機関が第三十一条各号に適合しなくなつたと認めるときは、その保安機関に対し、これらの規定に適合するため必要な措置をとるべきことを命ずることができる。","p":1}],"del":false},{"id":"法-35_3","law":"法","num":"35_3","title":"第三十五条の三","cap":"（認定の取消し）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"経済産業大臣等は、その認定を受けた保安機関が次の各号のいずれかに該当するときは、その認定を取り消すことができる。","p":1},{"d":1,"t":"一　第三十条第一号、第三号又は第四号に該当するに至つたとき。"},{"d":1,"t":"二　第三十三条第一項の認可を受けないで保安業務に係る一般消費者等の数を増加したとき。"},{"d":1,"t":"三　第三十四条第二項の規定に違反したとき。"},{"d":1,"t":"四　第三十四条第三項、第三十五条第三項又は前条の規定による命令に違反したとき。"},{"d":1,"t":"五　第三十五条第一項の認可を受けた保安業務規程によらないで保安業務を行つたとき。"},{"d":1,"t":"六　第八十四条第一項の条件に違反したとき。"},{"d":1,"t":"七　不正の手段により第二十九条第一項の認定又はその更新を受けたとき。"}],"del":false},{"id":"法-35_4","law":"法","num":"35_4","title":"第三十五条の四","cap":"（準用規定）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"第六条、第八条、第十条、第二十三条及び第二十四条の規定は、保安機関に準用する。この場合において、第六条、第十条第二項及び第二十四条中「第三条第一項」とあるのは「第二十九条第一項」と、第六条、第八条、第十条第二項、第二十三条及び第二十四条中「登録」とあるのは「認定」と、第六条、第二十三条及び第二十四条第三項中「液化石油ガス販売事業」とあるのは「保安業務」と、第六条中「第十条第一項」とあるのは「第三十五条の四において準用する第十条第一項」と、同条各号中「販売所を有する」とあるのは「設置される販売所の事業として販売される液化石油ガスの一般消費者等についての保安業務を行う」と、第八条中「第三条第二項各号」とあるのは「第二十九条第二項第一号及び第三号」と、第十条第一項中「第四条第一項各号」とあるのは「第三十条各号」と、第二十四条第一項中「第六条」とあるのは「第三十五条の四において準用する第六条」と、同条第二項中「第十条第二項」とあるのは「第三十五条の四において準用する第十条第二項」と読み替えるものとする。","p":1}],"del":false},{"id":"法-35_5","law":"法","num":"35_5","title":"第三十五条の五","cap":"（基準適合命令）","capInh":false,"path":"第三章　保安業務","lines":[{"d":0,"t":"都道府県知事又は指定都市の長は、消費設備が経済産業省令で定める技術上の基準に適合していないと認めるときは、その所有者又は占有者に対し、その技術上の基準に適合するように消費設備を修理し、改造し、又は移転すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-35_6","law":"法","num":"35_6","title":"第三十五条の六","cap":"（保安の確保の方法等の認定）","capInh":false,"path":"第三章の二　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"液化石油ガス販売事業者は、液化石油ガスの販売契約を締結している一般消費者等の保安を確保するための機器であつて経済産業省令で定めるもの（以下「保安確保機器」という。）の設置及び管理の方法が経済産業省令で定める基準に適合していることについて、その登録をした経済産業大臣等の認定を受けることができる。","p":1},{"d":0,"t":"２　前項の認定に関し必要な事項は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-35_7","law":"法","num":"35_7","title":"第三十五条の七","cap":"（認定液化石油ガス販売事業者の報告義務）","capInh":false,"path":"第三章の二　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"前条第一項の認定を受けた液化石油ガス販売事業者（以下「認定液化石油ガス販売事業者」という。）は、経済産業省令で定めるところにより、販売契約を締結している一般消費者等の数及び保安確保機器に係る一般消費者等の数をその認定をした経済産業大臣等に報告しなければならない。","p":1}],"del":false},{"id":"法-35_8","law":"法","num":"35_8","title":"第三十五条の八","cap":"（認定液化石油ガス販売事業者等に係る特例）","capInh":false,"path":"第三章の二　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"認定液化石油ガス販売事業者は、第十九条第一項の規定にかかわらず、選任すべき業務主任者の数その他業務主任者の選任の方法について経済産業省令で定める基準に従つて業務主任者を選任することができる。","p":1}],"del":false},{"id":"法-35_9","law":"法","num":"35_9","title":"第三十五条の九","cap":"（認定液化石油ガス販売事業者等に係る特例）","capInh":true,"path":"第三章の二　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"認定液化石油ガス販売事業者が販売契約を締結している一般消費者等であつて、保安確保機器により保安が確保されている者についての保安業務を行う保安機関は、第三十四条第一項の規定にかかわらず、供給設備の点検の方法その他保安業務の方法について経済産業省令で定める基準に従つて保安業務を行うことができる。","p":1}],"del":false},{"id":"法-35_10","law":"法","num":"35_10","title":"第三十五条の十","cap":"（認定の取消し）","capInh":false,"path":"第三章の二　液化石油ガス販売事業者の認定","lines":[{"d":0,"t":"経済産業大臣等は、その認定を受けた認定液化石油ガス販売事業者の保安確保機器の設置及び管理の方法が第三十五条の六第一項の経済産業省令で定める基準に適合していないと認めるときは、遅滞なく、その認定を取り消さなければならない。","p":1},{"d":0,"t":"２　経済産業大臣等は、その認定を受けた認定液化石油ガス販売事業者が第三十五条の七の報告をしない場合であつて、経済産業大臣等がその認定液化石油ガス販売事業者に対し十日以上の相当な期間を定めて報告すべきことを催告し、当該認定液化石油ガス販売事業者がその期間内に報告をしないときは、当該認定液化石油ガス販売事業者に係る認定を取り消すことができる。","p":1}],"del":false},{"id":"法-36","law":"法","num":"36","title":"第三十六条","cap":"（貯蔵施設等の設置の許可）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"次の各号のいずれかに該当する液化石油ガス販売事業者は、貯蔵施設又は特定供給設備ごとに、その貯蔵施設又は特定供給設備の所在地を管轄する都道府県知事（指定都市の区域内にあつては、指定都市の長。以下この章、第三十八条の三及び第三十八条の十において同じ。）の許可を受けなければならない。","p":1},{"d":1,"t":"一　第十六条第一項の経済産業省令で定める量以上の液化石油ガスを貯蔵するための貯蔵施設（以下この章において「貯蔵施設」という。）を設置しようとする者"},{"d":1,"t":"二　特定供給設備を設置して液化石油ガスを供給しようとする者"},{"d":0,"t":"２　前項の許可の申請は、貯蔵施設又は特定供給設備の所在地を管轄する消防長（消防本部を置かない市町村にあつては、市町村長。以下同じ。）又は消防署長の意見書を添えて行わなければならない。","p":1}],"del":false},{"id":"法-37","law":"法","num":"37","title":"第三十七条","cap":"（許可の基準）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"都道府県知事は、前条第一項の許可の申請があつた場合には、その申請に係る貯蔵施設又は特定供給設備が経済産業省令で定める技術上の基準に適合すると認めるときは、許可をしなければならない。","p":1}],"del":false},{"id":"法-37_2","law":"法","num":"37_2","title":"第三十七条の二","cap":"（変更の許可）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"第三十六条第一項の許可を受けた液化石油ガス販売事業者は、貯蔵施設の位置、構造若しくは設備を変更しようとするとき、又は特定供給設備の位置、構造、設備若しくは装置を変更しようとするときは、その許可をした都道府県知事の許可を受けなければならない。ただし、貯蔵施設の撤去その他経済産業省令で定める軽微な変更をしようとするときは、この限りでない。","p":1},{"d":0,"t":"２　液化石油ガス販売事業者は、前項ただし書の貯蔵施設の撤去その他経済産業省令で定める軽微な変更をしたときは、遅滞なく、その旨をその許可をした都道府県知事に届け出なければならない。","p":1},{"d":0,"t":"３　前条の規定は、第一項の許可に準用する。","p":1}],"del":false},{"id":"法-37_3","law":"法","num":"37_3","title":"第三十七条の三","cap":"（完成検査）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"第三十六条第一項又は前条第一項の許可を受けた液化石油ガス販売事業者は、貯蔵施設を設置し、若しくはその位置、構造若しくは設備を変更したとき、又は特定供給設備を設置し、若しくはその位置、構造、設備若しくは装置を変更したときは、当該貯蔵施設又は当該特定供給設備につき、その許可をした都道府県知事が行う完成検査を受け、これらが第三十七条の経済産業省令で定める技術上の基準に適合していると認められた後でなければ、これを使用してはならない。ただし、当該貯蔵施設又は当該特定供給設備につき、協会又は高圧ガス保安法第二十条第一項ただし書の指定完成検査機関（以下「指定完成検査機関」という。）が行う完成検査を受け、これらが第三十七条の経済産業省令で定める技術上の基準に適合していると認められ、その旨を都道府県知事に届け出た場合は、この限りでない。","p":1},{"d":0,"t":"２　協会又は指定完成検査機関は、前項ただし書の完成検査を行つたときは、遅滞なく、その結果を都道府県知事に報告しなければならない。","p":1},{"d":0,"t":"３　第一項の都道府県知事、協会又は指定完成検査機関が行う完成検査の方法は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-37_4","law":"法","num":"37_4","title":"第三十七条の四","cap":"（充てん設備の許可）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"供給設備に液化石油ガス（高圧ガス保安法第二条の高圧ガスであるものに限る。以下この項、次条第二項及び第四項、第九十八条第五号並びに第九十八条の二第一号において同じ。）を充てんしようとする者は、供給設備に液化石油ガスを充てんするための設備（以下「充てん設備」という。）ごとに、その経済産業省令で定める所在地を管轄する都道府県知事の許可を受けなければならない。","p":1},{"d":0,"t":"２　都道府県知事は、前項の許可の申請があつた場合には、その申請に係る充てん設備が経済産業省令で定める技術上の基準に適合すると認めるときは、許可をしなければならない。","p":1},{"d":0,"t":"３　第三十七条の二の規定は、第一項の許可を受けた者（以下「充てん事業者」という。）に準用する。この場合において、同条第一項中「貯蔵施設の位置、構造若しくは設備を変更しようとするとき、又は特定供給設備の位置、構造、設備若しくは装置」とあるのは「充てん設備の第三十七条の四第一項の経済産業省令で定める所在地、構造、設備又は装置」と、同項及び同条第二項中「貯蔵施設の撤去」とあるのは「充てん設備の撤去」と、同条第三項中「前条」とあるのは「第三十七条の四第二項」と、「第一項」とあるのは「第三十七条の四第三項において準用する第三十七条の二第一項」と読み替えるものとする。","p":1},{"d":0,"t":"４　前条の規定は、充てん事業者に準用する。この場合において、同条第一項中「貯蔵施設を設置し、若しくはその位置、構造若しくは設備を変更したとき、又は特定供給設備を設置し、若しくは」とあるのは「充てん設備を設置し、又は」と、「当該貯蔵施設又は当該特定供給設備」とあるのは「当該充てん設備」と、「第三十七条」とあるのは「第三十七条の四第二項」と読み替えるものとする。","p":1}],"del":false},{"id":"法-37_5","law":"法","num":"37_5","title":"第三十七条の五","cap":"（液化石油ガスの充てんの作業等）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"充てん事業者は、その設備が前条第二項の経済産業省令で定める技術上の基準に適合するように維持しなければならない。","p":1},{"d":0,"t":"２　充てん事業者は、経済産業省令で定める技術上の基準に従つて供給設備に液化石油ガスを充てんしなければならない。","p":1},{"d":0,"t":"３　都道府県知事は、充てん事業者の充てん設備又は充てんの方法が前条第二項又は前項の経済産業省令で定める技術上の基準に適合していないと認めるときは、その技術上の基準に適合するように充てん設備を修理し、改造し、若しくは移転し、又はその基準に従つて充てんすべきことを命ずることができる。","p":1},{"d":0,"t":"４　充てん事業者は、経済産業省令で定めるところにより、協会又は経済産業大臣が指定する養成施設において、液化石油ガスの充てんを行う者となるのに必要な知識及び技能に関する経済産業省令で定める講習の課程を修了した者に、その設備による供給設備への液化石油ガスの充てんを行わせなければならない。","p":1},{"d":0,"t":"５　前項の指定に関し必要な事項は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-37_6","law":"法","num":"37_6","title":"第三十七条の六","cap":"（保安検査）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"充てん事業者は、充てん設備について、経済産業省令で定めるところにより、定期に、その許可をした都道府県知事が行う保安検査を受けなければならない。ただし、充てん設備について、経済産業省令で定めるところにより、協会又は高圧ガス保安法第三十五条第一項第一号の指定保安検査機関（以下「指定保安検査機関」という。）が行う保安検査を受け、その旨を都道府県知事に届け出た場合は、この限りでない。","p":1},{"d":0,"t":"２　前項の保安検査は、充てん設備が第三十七条の四第二項の経済産業省令で定める技術上の基準に適合しているかどうかについて行う。","p":1},{"d":0,"t":"３　協会又は指定保安検査機関は、第一項ただし書の保安検査を行つたときは、遅滞なく、その結果を都道府県知事に報告しなければならない。","p":1},{"d":0,"t":"４　第一項の都道府県知事、協会又は指定保安検査機関が行う保安検査の方法は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-37_7","law":"法","num":"37_7","title":"第三十七条の七","cap":"（許可の取消し等）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"都道府県知事は、第三十六条第一項の許可を受けた者又は充てん事業者が次の各号の一に該当するときは、その貯蔵施設、特定供給設備若しくは充てん設備の許可を取り消し、又はその貯蔵施設、特定供給設備若しくは充てん設備の使用の停止を命ずることができる。","p":1},{"d":1,"t":"一　第十六条第三項、第十六条の二第二項又は第三十七条の五第三項の規定による命令に違反したとき。"},{"d":1,"t":"二　第三十七条の二第一項（第三十七条の四第三項において準用する場合を含む。）の規定により許可を受けなければならない事項を許可を受けないでしたとき。"},{"d":1,"t":"三　第三十七条の三第一項（第三十七条の四第四項において準用する場合を含む。）の完成検査を受けないで、貯蔵施設、特定供給設備又は充てん設備を使用したとき。"},{"d":0,"t":"２　都道府県知事は、前項の規定により、特定供給設備の使用の停止を命ずるときは、経済産業省令で定めるところにより、当該特定供給設備により液化石油ガスを供給されている一般消費者等にその旨を通知しなければならない。","p":1}],"del":false},{"id":"法-38","law":"法","num":"38","title":"第三十八条","cap":"（経済産業省令への委任）","capInh":false,"path":"第四章　貯蔵施設等及び充てんのための設備","lines":[{"d":0,"t":"この章に規定するもののほか、貯蔵施設の設置の許可の手続、完成検査の手続その他この章の規定の実施に関し必要な手続的事項は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-38_2","law":"法","num":"38_2","title":"第三十八条の二","cap":"（基準適合義務）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第一節　液化石油ガス設備工事","lines":[{"d":0,"t":"供給設備又は消費設備の設置又は変更の工事（以下「液化石油ガス設備工事」という。）は、供給設備についてのものにあつてはその供給設備が第十六条の二第一項の経済産業省令で定める技術上の基準に、消費設備についてのものにあつてはその消費設備が第三十五条の五の経済産業省令で定める技術上の基準に、それぞれ、適合するようにしなければならない。","p":1}],"del":false},{"id":"法-38_3","law":"法","num":"38_3","title":"第三十八条の三","cap":"（液化石油ガス設備工事の届出）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第一節　液化石油ガス設備工事","lines":[{"d":0,"t":"学校、病院、興行場その他の多数の者が出入する施設又は多数の者が居住する建築物であつて、経済産業省令で定めるものに係る液化石油ガス設備工事（経済産業省令で定めるものに限る。）をした者は、経済産業省令で定めるところにより、遅滞なく、その旨を当該施設又は建築物の所在地を管轄する都道府県知事に届け出なければならない。","p":1}],"del":false},{"id":"法-38_4","law":"法","num":"38_4","title":"第三十八条の四","cap":"（液化石油ガス設備士免状）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第一節　液化石油ガス設備工事","lines":[{"d":0,"t":"液化石油ガス設備士免状は、都道府県知事が交付する。","p":1},{"d":0,"t":"２　液化石油ガス設備士免状は、次の各号の一に該当する者でなければ、その交付を受けることができない。","p":1},{"d":1,"t":"一　液化石油ガス設備士試験に合格した者"},{"d":1,"t":"二　協会又は経済産業大臣が指定する養成施設において、経済産業省令で定める液化石油ガス設備士となるのに必要な知識及び技能に関する講習の課程を修了した者"},{"d":1,"t":"三　経済産業省令で定めるところにより、前二号に掲げる者と同等以上の知識及び技能を有していると都道府県知事が認定した者"},{"d":0,"t":"３　都道府県知事は、次の各号の一に該当する者に対しては、液化石油ガス設備士免状の交付を行わないことができる。","p":1},{"d":1,"t":"一　次項の規定により液化石油ガス設備士免状の返納を命ぜられ、その日から一年を経過しない者"},{"d":1,"t":"二　この法律、高圧ガス保安法若しくは特定ガス消費機器の設置工事の監督に関する法律（昭和五十四年法律第三十三号）若しくはこれらの法律に基づく命令又はガス事業法第百六十二条の規定に違反し、罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつた日から二年を経過しない者"},{"d":0,"t":"４　都道府県知事は、液化石油ガス設備士がこの法律、高圧ガス保安法若しくは特定ガス消費機器の設置工事の監督に関する法律若しくはこれらの法律に基づく命令又はガス事業法第百六十二条の規定に違反したときは、その液化石油ガス設備士免状の返納を命ずることができる。","p":1},{"d":0,"t":"５　前各項に規定するもののほか、液化石油ガス設備士免状の交付、再交付、書換え及び返納に関し必要な事項は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-38_4_2","law":"法","num":"38_4_2","title":"第三十八条の四の二","cap":"（免状交付事務の委託）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第一節　液化石油ガス設備工事","lines":[{"d":0,"t":"都道府県知事は、政令で定めるところにより、この章に規定する液化石油ガス設備士免状に関する事務（液化石油ガス設備士免状の返納に係る事務その他政令で定める事務を除く。次項において「免状交付事務」という。）の全部又は一部を経済産業省令で定める法人に委託することができる。","p":1},{"d":0,"t":"２　前項の規定により免状交付事務の委託を受けた法人の役員若しくは職員又はこれらの職にあつた者は、当該委託に係る免状交付事務に関して知り得た秘密を漏らしてはならない。","p":1}],"del":false},{"id":"法-38_5","law":"法","num":"38_5","title":"第三十八条の五","cap":"（液化石油ガス設備士試験）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第一節　液化石油ガス設備工事","lines":[{"d":0,"t":"液化石油ガス設備士試験は、液化石油ガス設備工事並びに供給設備及び消費設備に係る液化石油ガスによる災害の発生の防止に関して必要な知識及び技能について行う。","p":1},{"d":0,"t":"２　液化石油ガス設備士試験は、都道府県知事が行う。","p":1},{"d":0,"t":"３　液化石油ガス設備士試験の試験科目、受験手続その他液化石油ガス設備士試験の実施細目は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-38_6","law":"法","num":"38_6","title":"第三十八条の六","cap":"（液化石油ガス設備士試験）","capInh":true,"path":"第四章の二　液化石油ガス設備工事 / 第一節　液化石油ガス設備工事","lines":[{"d":0,"t":"都道府県知事は、経済産業省令で定めるところにより、協会又は経済産業大臣が指定する者（以下「指定試験機関」という。）に、液化石油ガス設備士試験の実施に関する事務（以下「試験事務」という。）の全部又は一部を行わせることができる。","p":1},{"d":0,"t":"２　都道府県知事は、前項の規定により協会又は指定試験機関にその試験事務の全部又は一部を行わせることとしたときは、当該試験事務の全部又は一部を行わないものとする。","p":1},{"d":0,"t":"３　第一項の規定により協会又は指定試験機関にその試験事務を行わせることとした都道府県知事は、当該行わせることとした試験事務を行わせないこととするときは、その六月前までに、その旨を協会又は指定試験機関に通知しなければならない。","p":1}],"de e,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関は、その名称又は主たる事務所の所在地を変更しようとするときは、変更しようとする日の二週間前までに、その旨を経済産業大臣に届け出なければならない。","p":1},{"d":0,"t":"２　指定試験機関は、その名称又は主たる事務所の所在地を変更しようとするときは第三十八条の六第一項の規定により当該指定試験機関にその試験事務を行わせることとした都道府県知事（以下「委任都道府県知事」という。）に、試験事務を取り扱う事務所の所在地を変更しようとするときは関係委任都道府県知事に、それぞれ、その変更をしようとする日の二週間前までに、その旨を届け出なければならない。","p":1}],"del":false},{"id":"法-38_18","law":"法","num":"38_18","title":"第三十八条の十八","cap":"（試験事務規程）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関は、試験事務の実施に関する規程（以下「試験事務規程」という。）を定め、経済産業大臣の認可を受けなければならない。これを変更しようとするときも、同様とする。","p":1},{"d":0,"t":"２　指定試験機関は、前項後段の規定により試験事務規程を変更しようとするときは、委任都道府県知事の意見を聴かなければならない。","p":1},{"d":0,"t":"３　試験事務規程で定めるべき事項は、経済産業省令で定める。","p":1},{"d":0,"t":"４　経済産業大臣は、第一項の認可をした試験事務規程が試験事務の公正な実施上不適当となつたと認めるときは、指定試験機関に対し、試験事務規程を変更すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-38_19","law":"法","num":"38_19","title":"第三十八条の十九","cap":"（試験事務の休廃止）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関は、経済産業大臣の許可を受けなければ、試験事務の全部又は一部を休止し、又は廃止してはならない。","p":1},{"d":0,"t":"２　経済産業大臣は、指定試験機関の試験事務の全部又は一部の休止又は廃止により試験事務の適正かつ確実な実施が損なわれるおそれがないと認めるときでなければ、前項の許可をしてはならない。","p":1},{"d":0,"t":"３　経済産業大臣は、第一項の許可をしようとするときは、関係委任都道府県知事の意見を聴かなければならない。","p":1},{"d":0,"t":"４　経済産業大臣は、第一項の許可をしたときは、その旨を関係委任都道府県知事に通知しなければならない。","p":1}],"del":false},{"id":"法-38_20","law":"法","num":"38_20","title":"第三十八条の二十","cap":"（事業計画等）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関は、毎事業年度開始前に（第三十八条の六第一項の指定を受けた日の属する事業年度にあつては、その指定を受けた後遅滞なく）、その事業年度の事業計画及び収支予算を作成し、経済産業大臣の認可を受けなければならない。これを変更しようとするときも、同様とする。","p":1},{"d":0,"t":"２　指定試験機関は、事業計画及び収支予算を作成し、又は変更しようとするときは、委任都道府県知事の意見を聴かなければならない。","p":1},{"d":0,"t":"３　指定試験機関は、毎事業年度経過後三月以内に、その事業年度の事業報告書及び収支決算書を作成し、経済産業大臣及び委任都道府県知事に提出しなければならない。","p":1}],"del":false},{"id":"法-38_21","law":"法","num":"38_21","title":"第三十八条の二十一","cap":"（役員の選任及び解任）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関の役員の選任及び解任は、経済産業大臣の認可を受けなければ、その効力を生じない。","p":1}],"del":false},{"id":"法-38_22","law":"法","num":"38_22","title":"第三十八条の二十二","cap":"（役員の解任命令）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"経済産業大臣は、指定試験機関の役員が、この法律若しくはこの法律に基づく命令の規定若しくは試験事務規程に違反したとき、又は試験事務に関し著しく不適当な行為をしたときは、指定試験機関に対し、その役員を解任すべきことを命ずることができる。","p":1}],"del":false},{"id":"法-38_23","law":"法","num":"38_23","title":"第三十八条の二十三","cap":"（試験委員）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関は、試験事務を行うときは、液化石油ガス設備士として必要な知識及び技能を有するかどうかの判定に関する事務については、試験委員に行わせなければならない。","p":1},{"d":0,"t":"２　指定試験機関は、試験委員を選任しようとするときは、経済産業省令で定める要件を備える者のうちから選任しなければならない。","p":1},{"d":0,"t":"３　指定試験機関は、試験委員を選任したときは、経済産業省令で定めるところにより、経済産業大臣にその旨を届け出なければならない。試験委員に変更があつたときも、同様とする。","p":1},{"d":0,"t":"４　前条の規定は、試験委員に準用する。","p":1}],"del":false},{"id":"法-38_24","law":"法","num":"38_24","title":"第三十八条の二十四","cap":"（秘密保持義務等）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"指定試験機関の役員若しくは職員（試験委員を含む。次項において同じ。）又はこれらの職にあつた者は、試験事務に関して知り得た秘密を漏らしてはならない。","p":1},{"d":0,"t":"２　試験事務に従事する指定試験機関の役員又は職員は、刑法（明治四十年法律第四十五号）その他の罰則の適用については、法令により公務に従事する職員とみなす。","p":1}],"del":false},{"id":"法-38_25","law":"法","num":"38_25","title":"第三十八条の二十五","cap":"（適合命令等）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"経済産業大臣は、指定試験機関が第三十八条の十六各号（第三号を除く。以下この項において同じ。）の一に適合しなくなつたと認めるときは、指定試験機関に対し、当該各号に適合するため必要な措置をとるべきことを命ずることができる。","p":1},{"d":0,"t":"２　経済産業大臣は、前項に定めるもののほか、試験事務の適正な実施を確保するため必要があると認めるときは、指定試験機関に対し、試験事務に関し監督上必要な命令をすることができる。","p":1},{"d":0,"t":"３　委任都道府県知事は、その行わせることとした試験事務の適正な実施を確保するため必要があると認めるときは、指定試験機関に対し、当該試験事務の適正な実施のために必要な措置をとるべきことを指示することができる。","p":1}],"del":false},{"id":"法-38_26","law":"法","num":"38_26","title":"第三十八条の二十六","cap":"（指定の取消し等）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"経済産業大臣は、指定試験機関が第三十八条の十六第三号に適合しなくなつたときは、その指定を取り消さなければならない。","p":1},{"d":0,"t":"２　経済産業大臣は、指定試験機関が次の各号の一に該当するときは、その指定を取り消し、又は期間を定めて試験事務の全部若しくは一部の停止を命ずることができる。","p":1},{"d":1,"t":"一　第三十八条の十五第一号又は第三号に該当するに至つたとき。"},{"d":1,"t":"二　第三十八条の十八第一項の認可を受けた試験事務規程によらないで試験事務を行つたとき。"},{"d":1,"t":"三　第三十八条の十八第四項、第三十八条の二十二（第三十八条の二十三第四項において準用する場合を含む。）又は前条第一項若しくは第二項の規定による命令に違反したとき。"},{"d":1,"t":"四　第三十八条の十九第一項、第三十八条の二十第一項若しくは第三項又は第三十八条の二十三第一項から第三項までの規定に違反したとき。"},{"d":1,"t":"五　第八十四条第一項の条件に違反したとき。"},{"d":1,"t":"六　不正の手段により第三十八条の六第一項の指定を受けたとき。"},{"d":0,"t":"３　経済産業大臣は、第一項若しくは前項の規定により指定を取り消し、又は同項の規定により試験事務の全部若しくは一部の停止を命じたときは、その旨を関係委任都道府県知事に通知しなければならない。","p":1}],"del":false},{"id":"法-38_27","law":"法","num":"38_27","title":"第三十八条の二十七","cap":"（委任都道府県知事による試験事務の実施）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"委任都道府県知事は、指定試験機関が第三十八条の十九第一項の許可を受けて試験事務の全部若しくは一部を休止したとき、経済産業大臣が前条第二項の規定により指定試験機関に対し試験事務の全部若しくは一部の停止を命じたとき、又は指定試験機関が天災その他の事由により試験事務の全部若しくは一部を実施することが困難となつた場合において経済産業大臣が必要があると認めるときは、当該試験事務の全部又は一部を自ら行うものとする。","p":1},{"d":0,"t":"２　経済産業大臣は、委任都道府県知事が前項の規定により試験事務を行うこととなるとき、又は委任都道府県知事が同項の規定により試験事務を行うこととなる事由がなくなつたときは、速やかに、その旨を当該委任都道府県知事に通知しなければならない。","p":1}],"del":false},{"id":"法-38_28","law":"法","num":"38_28","title":"第三十八条の二十八","cap":"（経済産業省令への委任）","capInh":false,"path":"第四章の二　液化石油ガス設備工事 / 第二節　指定試験機関","lines":[{"d":0,"t":"この法律に規定するもののほか、試験事務の引継ぎに関し必要な事項は、経済産業省令で定める。","p":1}],"del":false},{"id":"法-39","law":"法","num":"39","title":"第三十九条","cap":"（販売の制限）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第一節　販売及び表示の制限","lines":[{"d":0,"t":"液化石油ガス器具等の製造、輸入又は販売の事業を行う者は、第四十八条第一項（液化石油ガス器具等の輸入の事業を行う者（外国にある者に限る。以下「特定輸入事業者」という。）の輸入に係るものである場合にあつては、同条第二項）の規定により表示が付されているものでなければ、液化石油ガス器具等を販売し、又は販売の目的で陳列してはならない。","p":1},{"d":0,"t":"２　前項の規定は、同項に規定する者が次に掲げる場合に該当するときは、適用しない。","p":1},{"d":1,"t":"一　輸出用の液化石油ガス器具等を販売し、又は販売の目的で陳列する場合において、その旨を経済産業大臣に届け出たとき。"},{"d":1,"t":"二　輸出用以外の特定の用途に供する液化石油ガス器具等を販売し、又は販売の目的で陳列する場合において、経済産業大臣の承認を受けたとき。"},{"d":1,"t":"三　第四十六条第一項第一号の規定による届出又は同項第二号の承認に係る液化石油ガス器具等を販売し、又は販売の目的で陳列するとき。"}],"del":false},{"id":"法-40","law":"法","num":"40","title":"第四十条","cap":"（表示の制限）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第一節　販売及び表示の制限","lines":[{"d":0,"t":"次条の規定による届出をした者（以下「届出事業者」という。）が同条の規定による届出に係る型式（以下単に「届出に係る型式」という。）の液化石油ガス器具等について第四十八条の規定により表示を付する場合でなければ、何人も、液化石油ガス器具等に同条第一項の経済産業省令で定める方式による表示又はこれと紛らわしい表示を付してはならない。","p":1}],"del":false},{"id":"法-41","law":"法","num":"41","title":"第四十一条","cap":"（事業の届出）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"液化石油ガス器具等の製造又は輸入の事業を行う者は、経済産業省令で定めるところにより、経済産業省令で定める液化石油ガス器具等の区分（以下単に「液化石油ガス器具等の区分」という。）に従い、次の事項を経済産業大臣に届け出ることができる。","p":1},{"d":1,"t":"一　氏名又は名称及び住所並びに法人にあつては、その代表者の氏名"},{"d":1,"t":"二　特定輸入事業者にあつては、日本国内においてその輸入に係る液化石油ガス器具等による一般消費者等の生命又は身体についての災害の拡大を防止するために必要な措置をとらせるための者（以下「国内管理人」という。）の氏名又は名称及び住所並びに法人である国内管理人にあつてはその代表者の氏名"},{"d":1,"t":"三　経済産業省令で定める液化石油ガス器具等の型式の区分"},{"d":1,"t":"四　当該液化石油ガス器具等の設計を行う者であることその他の経済産業省令で定める要件に該当しない者にあつては、当該液化石油ガス器具等を製造する工場又は事業場の名称及び所在地（液化石油ガス器具等の輸入の事業を行う者にあつては、当該液化石油ガス器具等の製造事業者の氏名又は名称及び住所）"}],"del":false},{"id":"法-42","law":"法","num":"42","title":"第四十二条","cap":"（承継）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"届出事業者が当該届出に係る事業の全部を譲り渡し、又は届出事業者について相続、合併若しくは分割（当該届出に係る事業の全部を承継させるものに限る。）があつたときは、その事業の全部を譲り受けた者又は相続人（相続人が二人以上ある場合において、その全員の同意により事業を承継すべき相続人を選定したときは、その者）、合併後存続する法人若しくは合併により設立した法人若しくは分割によりその事業の全部を承継した法人は、その届出事業者の地位を承継する。","p":1},{"d":0,"t":"２　前項の規定により届出事業者の地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を経済産業大臣に届け出なければならない。","p":1}],"del":false},{"id":"法-43","law":"法","num":"43","title":"第四十三条","cap":"（変更の届出）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"届出事業者は、第四十一条各号の事項に変更があつたときは、遅滞なく、その旨を経済産業大臣に届け出なければならない。ただし、その変更が経済産業省令で定める軽微なものであるときは、この限りでない。","p":1},{"d":0,"t":"２　届出事業者は、第四十一条第四号の経済産業省令で定める要件に該当しなくなつたときは、遅滞なく、同号の事項を経済産業大臣に届け出なければならない。","p":1}],"del":false},{"id":"法-44","law":"法","num":"44","title":"第四十四条","cap":"（廃止の届出）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"届出事業者は、当該届出に係る事業を廃止したときは、遅滞なく、その旨を経済産業大臣に届け出なければならない。","p":1}],"del":false},{"id":"法-45","law":"法","num":"45","title":"第四十五条","cap":"（届出事項に係る情報の公表）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"経済産業大臣は、第四十一条の規定による届出又は第四十三条第一項の規定による届出（第四十一条第一号から第三号までの事項に係るものに限る。）があつたときは、これらの届出に係る第四十一条第一号から第三号までの事項に係る情報を公表するものとする。","p":1},{"d":0,"t":"２　経済産業大臣は、前条の規定による届出があつたときは、その旨を公表するものとする。","p":1}],"del":false},{"id":"法-46","law":"法","num":"46","title":"第四十六条","cap":"（基準適合義務等）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"届出事業者は、届出に係る型式の液化石油ガス器具等を製造し、又は輸入する場合においては、経済産業省令で定める技術上の基準に適合するようにしなければならない。ただし、次に掲げる場合に該当するときは、この限りでない。","p":1},{"d":1,"t":"一　輸出用の液化石油ガス器具等を製造し、又は輸入する場合において、その旨を経済産業大臣に届け出たとき。"},{"d":1,"t":"二　輸出用以外の特定の用途に供する液化石油ガス器具等を製造し、又は輸入する場合において、経済産業大臣の承認を受けたとき。"},{"d":1,"t":"三　試験用に製造し、又は輸入するとき。"},{"d":0,"t":"２　届出事業者は、経済産業省令で定めるところにより、その製造又は輸入に係る前項の液化石油ガス器具等（同項ただし書の規定の適用を受けて製造され、又は輸入されるものを除く。）について検査を行い、その検査記録を作成し、これを保存しなければならない。","p":1},{"d":0,"t":"３　特定輸入事業者である届出事業者は、前項の検査記録の写しをその国内管理人に提供しなければならない。この場合において、当該国内管理人は、当該写しを保存しなければならない。","p":1},{"d":0,"t":"４　特定輸入事業者である届出事業者は、その国内管理人が経済産業省令で定める基準に適合するようにしなければならない。","p":1}],"del":false},{"id":"法-47","law":"法","num":"47","title":"第四十七条","cap":"（特定液化石油ガス器具等の適合性検査）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"届出事業者は、その製造又は輸入に係る前条第一項の液化石油ガス器具等（同項ただし書の規定の適用を受けて製造され、又は輸入されるものを除く。）が特定液化石油ガス器具等である場合には、当該特定液化石油ガス器具等を販売する時までに、次の各号のいずれかに掲げるものについて、経済産業大臣の登録を受けた者の次項の規定による検査（以下「適合性検査」という。）を受け、かつ、同項の証明書の交付を受け、これを保存しなければならない。ただし、当該特定液化石油ガス器具等と同一の型式に属する特定液化石油ガス器具等について既に第二号に係る同項の証明書の交付を受けこれを保存している場合において当該証明書の交付を受けた日から起算して特定液化石油ガス器具等ごとに政令で定める期間を経過していないとき又は同項の証明書と同等なものとして経済産業省令で定めるものを保存している場合は、この限りでない。","p":1},{"d":1,"t":"一　当該特定液化石油ガス器具等"},{"d":1,"t":"二　試験用の特定液化石油ガス器具等及び当該特定液化石油ガス器具等に係る届出事業者の工場又は事業場における検査設備その他経済産業省令で定めるもの"},{"d":0,"t":"２　前項の登録を受けた者は、同項各号に掲げるものについて経済産業省令で定める方法により検査を行い、これらが前条第一項の経済産業省令で定める技術上の基準又は経済産業省令で定める前項第二号の検査設備その他経済産業省令で定めるものに関する基準に適合しているときは、経済産業省令で定めるところにより、その旨を記載した証明書を当該届出事業者に交付することができる。","p":1},{"d":0,"t":"３　特定輸入事業者である届出事業者は、その輸入に係る液化石油ガス器具等が特定液化石油ガス器具等である場合には、前項の証明書（第一項第二号に係るものにあつては、同項ただし書の政令で定める期間を経過していないものに限る。）又は第一項ただし書の経済産業省令で定めるものの写しをその国内管理人に提供しなければならない。この場合において、当該国内管理人は、当該写しを保存しなければならない。","p":1}],"del":false},{"id":"法-48","law":"法","num":"48","title":"第四十八条","cap":"（表示）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"届出事業者（特定輸入事業者である者を除く。）は、その届出に係る型式の液化石油ガス器具等の第四十六条第一項の経済産業省令で定める技術上の基準に対する適合性について、同条第二項（特定液化石油ガス器具等の場合にあつては、同項及び前条第一項）の規定による義務を履行したときは、当該液化石油ガス器具等に経済産業省令で定める方式による表示を付することができる。","p":1},{"d":0,"t":"２　特定輸入事業者である届出事業者は、その届出に係る型式の液化石油ガス器具等の第四十六条第一項の経済産業省令で定める技術上の基準に対する適合性について、同条第二項及び第三項前段（特定液化石油ガス器具等の場合にあつては、同条第二項及び第三項前段並びに前条第一項及び第三項前段）の規定による義務を履行し、かつ、その国内管理人が第四十六条第三項後段（特定液化石油ガス器具等の場合にあつては、同項後段及び前条第三項後段）の規定による義務を履行していることを確認したときは、当該液化石油ガス器具等に前項の経済産業省令で定める方式による表示を付することができる。","p":1}],"del":false},{"id":"法-49","law":"法","num":"49","title":"第四十九条","cap":"（改善命令）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"経済産業大臣は、届出事業者が第四十六条第一項の規定に違反していると認める場合には、届出事業者に対し、液化石油ガス器具等の製造、輸入又は検査の方法その他の業務の方法の改善に関し必要な措置をとるべきことを命ずることができる。","p":1}],"del":false},{"id":"法-50","law":"法","num":"50","title":"第五十条","cap":"（表示の禁止）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第二節　事業の届出等","lines":[{"d":0,"t":"経済産業大臣は、次の各号に掲げる場合には、届出事業者に対し、一年以内の期間を定めて当該各号に定める届出に係る型式の液化石油ガス器具等に第四十八条第一項（当該届出事業者が特定輸入事業者である場合にあつては、同条第二項）の規定により表示を付することを禁止することができる。","p":1},{"d":1,"t":"一　届出事業者が製造し、又は輸入したその届出に係る型式の液化石油ガス器具等（第四十六条第一項ただし書の規定の適用を受けて製造し、又は輸入したものを除く。）が同項の経済産業省令で定める技術上の基準に適合していない場合において、一般消費者等の生命又は身体についての災害の発生を防止するため特に必要があると認めるとき　当該経済産業省令で定める技術上の基準に適合していない液化石油ガス器具等の属する届出に係る型式"},{"d":1,"t":"二　届出事業者が製造し、又は輸入したその届出に係る型式の液化石油ガス器具等について、第四十六条第二項又は第四十七条第一項の規定に違反したとき　当該違反に係る液化石油ガス器具等の属する届出に係る型式"},{"d":1,"t":"三　特定輸入事業者である届出事業者が輸入したその届出に係る型式の液化石油ガス器具等について、第四十六条第三項前段又は第四十七条第三項前段の規定に違反したとき　当該違反に係る液化石油ガス器具等の属する届出に係る型式"},{"d":1,"t":"四　国内管理人が第四十六条第三項後段又は第四十七条第三項後段の規定に違反したとき　当該違反に係る液化石油ガス器具等の属する届出に係る型式"},{"d":1,"t":"五　届出事業者が製造し、又は輸入したその届出に係る型式の液化石油ガス器具等について、前条の規定による命令に違反したとき　当該違反に係る液化石油ガス器具等の属する届出に係る型式"},{"d":0,"t":"２　経済産業大臣は、次に掲げる場合には、特定輸入事業者である届出事業者に対し、一年以内の期間を定めてその届出に係る液化石油ガス器具等の区分に属する届出に係る型式の液化石油ガス器具等に第四十八条第二項の規定により表示を付することを禁止することができる。","p":1},{"d":1,"t":"一　国内管理人が第四十六条第四項の経済産業省令で定める基準に適合しなくなつたと認めるとき。"},{"d":1,"t":"二　国内管理人が欠けた場合において新たに国内管理人を選任しなかつたとき。"}],"del":false},{"id":"法-51","law":"法","num":"51","title":"第五十一条","cap":"（登録）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第三節　検査機関の登録","lines":[{"d":0,"t":"第四十七条第一項の登録は、経済産業省令で定めるところにより、経済産業省令で定める特定液化石油ガス器具等の区分（以下単に「特定液化石油ガス器具等の区分」という。）ごとに、適合性検査を行おうとする者の申請により行う。","p":1},{"d":0,"t":"２　経済産業大臣は、前項の規定による申請があつた場合において、必要があると認めるときは、独立行政法人製品評価技術基盤機構（以下「機構」という。）に、当該申請が第五十三条第一項各号に適合しているかどうかについて、必要な調査を行わせることができる。","p":1}],"del":false},{"id":"法-52","law":"法","num":"52","title":"第五十二条","cap":"（欠格条項）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第三節　検査機関の登録","lines":[{"d":0,"t":"次の各号のいずれかに該当する者は、第四十七条第一項の登録を受けることができない。","p":1},{"d":1,"t":"一　この法律又はこの法律に基づく命令の規定に違反し、罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつた日から二年を経過しない者"},{"d":1,"t":"二　第六十一条又は第六十四条第一項の規定により登録を取り消され、その取消しの日から二年を経過しない者"},{"d":1,"t":"三　法人であつて、その業務を行う役員のうちに前二号のいずれかに該当する者があるもの"}],"del":false},{"id":"法-53","law":"法","num":"53","title":"第五十三条","cap":"（登録の基準）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第三節　検査機関の登録","lines":[{"d":0,"t":"経済産業大臣は、第五十一条第一項の規定により登録を申請した者（以下この項において「登録申請者」という。）が次に掲げる要件のすべてに適合しているときは、その登録をしなければならない。この場合において、登録に関して必要な手続は、経済産業省令で定める。","p":1},{"d":1,"t":"一　国際標準化機構及び国際電気標準会議が定めた製品の認証を行う機関に関する基準に適合するものであること。"},{"d":1,"t":"二　登録申請者が、第四十七条第一項の規定により適合性検査を受けなければならないこととされる特定液化石油ガス器具等を製造し、又は輸入する届出事業者（以下この号及び第五十八条の二第二項において「受検事業者」という。）に支配されているものとして次のいずれかに該当するものでないこと。"},{"d":2,"t":"イ　登録申請者が株式会社である場合にあつては、受検事業者がその親法人（会社法（平成十七年法律第八十六号）第八百七十九条第一項に規定する親法人をいう。）であること。"},{"d":2,"t":"ロ　登録申請者の役員（持分会社（会社法第五百七十五条第一項に規定する持分会社をいう。）にあつては、業務を執行する社員）に占める受検事業者の役員又は職員（過去二年間に当該受検事業者の役員又は職員であつた者を含む。）の割合が二分の一を超えていること。"},{"d":2,"t":"ハ　登録申請者（法人にあつては、その代表権を有する役員）が、受検事業者の役員又は職員（過去二年間に当該受検事業者の役員又は職員であつた者を含む。）であること。"},{"d":0,"t":"２　第四十七条第一項の登録は、検査機関登録簿に次に掲げる事項を記載してするものとする。","p":1},{"d":1,"t":"一　登録年月日及び登録番号"},{"d":1,"t":"二　登録を受けた者の氏名又は名称及び住所並びに法人にあつては、その代表者の氏名"},{"d":1,"t":"三　登録を受けた者が適合性検査を行う特定液化石油ガス器具等の区分"},{"d":1,"t":"四　登録を受けた者が適合性検査を行う事業所の名称及び所在地"}],"del":false},{"id":"法-54","law":"法","num":"54","title":"第五十四条","cap":"（登録の更新）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第三節　検査機関の登録","lines":[{"d":0,"t":"第四十七条第一項の登録は、三年を下らない政令で定める期間ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。","p":1},{"d":0,"t":"２　前三条の規定は、前項の登録の更新に準用する。","p":1}],"del":false},{"id":"法-55","law":"法","num":"55","title":"第五十五条","cap":"（適合性検査の義務）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"第四十七条第一項の登録を受けた者（国内にある事業所において適合性検査を行うことにつき、その登録を受けた者に限る。以下「国内登録検査機関」という。）は、適合性検査を行うことを求められたときは、正当な理由がある場合を除き、遅滞なく、適合性検査を行わなければならない。","p":1},{"d":0,"t":"２　国内登録検査機関は、公正に、かつ、第四十六条第一項の経済産業省令で定める技術上の基準に適合する方法により適合性検査を行わなければならない。","p":1}],"del":false},{"id":"法-56","law":"法","num":"56","title":"第五十六条","cap":"（事業所の変更の届出）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"国内登録検査機関は、適合性検査を行う事業所の所在地を変更しようとするときは、変更しようとする日の二週間前までに、経済産業大臣に届け出なければならない。","p":1}],"del":false},{"id":"法-57","law":"法","num":"57","title":"第五十七条","cap":"（業務規程）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"国内登録検査機関は、適合性検査の業務に関する規程（以下「業務規程」という。）を定め、適合性検査の業務の開始前に、経済産業大臣に届け出なければならない。これを変更しようとするときも、同様とする。","p":1},{"d":0,"t":"２　業務規程には、適合性検査の実施方法、適合性検査に関する料金の算定方法その他の経済産業省令で定める事項を定めておかなければならない。","p":1}],"del":false},{"id":"法-58","law":"法","num":"58","title":"第五十八条","cap":"（業務の休廃止の届出）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"国内登録検査機関は、適合性検査の業務の全部又は一部を休止し、又は廃止しようとするときは、経済産業省令で定めるところにより、あらかじめ、その旨を経済産業大臣に届け出なければならない。","p":1}],"del":false},{"id":"法-58_2","law":"法","num":"58_2","title":"第五十八条の二","cap":"（財務諸表等の備置き及び閲覧等）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"国内登録検査機関は、毎事業年度経過後三月以内に、その事業年度の財産目録、貸借対照表及び損益計算書又は収支計算書並びに事業報告書（これらのものが電磁的記録（電子的方式、磁気的方式その他の人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下この条において同じ。）で作成され、又はその作成に代えて電磁的記録の作成がされている場合における当該電磁的記録を含む。次項及び第百三条の二第二号において「財務諸表等」という。）を作成し、五年間事業所に備え置かなければならない。","p":1},{"d":0,"t":"２　受検事業者その他の利害関係人は、国内登録検査機関の業務時間内は、いつでも、次に掲げる請求をすることができる。ただし、第二号又は第四号の請求をするには、国内登録検査機関の定めた費用を支払わなければならない。","p":1},{"d":1,"t":"一　財務諸表等が書面をもつて作成されているときは、当該書面の閲覧又は謄写の請求"},{"d":1,"t":"二　前号の書面の謄本又は抄本の請求"},{"d":1,"t":"三　財務諸表等が電磁的記録をもつて作成されているときは、当該電磁的記録に記録された事項を経済産業省令で定める方法により表示したものの閲覧又は謄写の請求"},{"d":1,"t":"四　前号の電磁的記録に記録された事項を電磁的方法であつて経済産業省令で定めるものにより提供することの請求又は当該事項を記載した書面の交付の請求"}],"del":false},{"id":"法-59","law":"法","num":"59","title":"第五十九条","cap":"（適合命令）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"経済産業大臣は、国内登録検査機関が第五十三条第一項各号のいずれかに適合しなくなつたと認めるときは、その国内登録検査機関に対し、これらの規定に適合するため必要な措置をとるべきことを命ずることができる。","p":1}],"del":false},{"id":"法-60","law":"法","num":"60","title":"第六十条","cap":"（改善命令）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"経済産業大臣は、国内登録検査機関が第五十五条の規定に違反していると認めるときは、当該国内登録検査機関に対し、適合性検査を行うべきこと又は適合性検査の方法その他の業務の方法の改善に関し必要な措置をとるべきことを命ずることができる。","p":1}],"del":false},{"id":"法-61","law":"法","num":"61","title":"第六十一条","cap":"（登録の取消し等）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"経済産業大臣は、国内登録検査機関が次の各号のいずれかに該当するときは、その登録を取り消し、又は期間を定めて適合性検査の業務の全部若しくは一部の停止を命ずることができる。","p":1},{"d":1,"t":"一　第五十二条第一号又は第三号に該当するに至つたとき。"},{"d":1,"t":"二　第五十五条、第五十六条、第五十七条第一項、第五十八条、第五十八条の二第一項又は第八十一条第三項の規定に違反したとき。"},{"d":1,"t":"三　正当な理由がないのに第五十八条の二第二項各号の規定による請求を拒んだとき。"},{"d":1,"t":"四　前二条の規定による命令に違反したとき。"},{"d":1,"t":"五　不正の手段により第四十七条第一項の登録を受けたとき。"}],"del":false},{"id":"法-62","law":"法","num":"62","title":"第六十二条","cap":"（経済産業大臣による適合性検査業務実施等）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第四節　国内登録検査機関","lines":[{"d":0,"t":"経済産業大臣は、第四十七条第一項の登録を受ける者がいないとき、第五十八条の規定による適合性検査の業務の全部又は一部の休止又は廃止の届出があつたとき、前条の規定により同項の登録を取り消し、又は国内登録検査機関に対し適合性検査の業務の全部若しくは一部の停止を命じたとき、国内登録検査機関が天災その他の事由により適合性検査の業務の全部又は一部を実施することが困難となつたときその他必要があると認めるときは、当該適合性検査の業務の全部又は一部を自ら行うことができる。","p":1},{"d":0,"t":"２　経済産業大臣は、前項の場合において必要があると認めるときは、機構に、当該適合性検査の業務の全部又は一部を行わせることができる。","p":1},{"d":0,"t":"３　経済産業大臣が前二項の規定により適合性検査の業務の全部若しくは一部を自ら行い、又は機構に行わせる場合における適合性検査の業務の引継ぎその他の必要な事項については、経済産業省令で定める。","p":1}],"del":false},{"id":"法-63","law":"法","num":"63","title":"第六十三条","cap":"（適合性検査の義務等）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第五節　外国登録検査機関","lines":[{"d":0,"t":"第四十七条第一項の登録を受けた者（外国にある事業所において適合性検査を行うことにつき、その登録を受けた者に限る。以下「外国登録検査機関」という。）は、適合性検査を行うことを求められたときは、正当な理由がある場合を除き、遅滞なく、適合性検査を行わなければならない。","p":1},{"d":0,"t":"２　第五十五条第二項、第五十六条から第六十条までの規定は、外国登録検査機関に準用する。この場合において、第五十九条及び第六十条中「命ずる」とあるのは、「請求する」と読み替えるものとする。","p":1}],"del":false},{"id":"法-64","law":"法","num":"64","title":"第六十四条","cap":"（登録の取消し等）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第五節　外国登録検査機関","lines":[{"d":0,"t":"経済産業大臣は、外国登録検査機関が次の各号のいずれかに該当するときは、その登録を取り消すことができる。","p":1},{"d":1,"t":"一　第五十二条第一号又は第三号に該当するに至つたとき。"},{"d":1,"t":"二　前条第一項の規定又は同条第二項において準用する第五十五条第二項、第五十六条、第五十七条第一項、第五十八条若しくは第五十八条の二第一項若しくは第八十一条第四項において準用する同条第三項の規定に違反したとき。"},{"d":1,"t":"三　正当な理由がないのに前条第二項において準用する第五十八条の二第二項各号の規定による請求を拒んだとき。"},{"d":1,"t":"四　前条第二項において準用する第五十九条又は第六十条の規定による請求に応じなかつたとき。"},{"d":1,"t":"五　不正の手段により第四十七条第一項の登録を受けたとき。"},{"d":1,"t":"六　経済産業大臣が、外国登録検査機関が前各号のいずれかに該当すると認めて、期間を定めて適合性検査の業務の全部又は一部の停止を請求した場合において、その請求に応じなかつたとき。"},{"d":1,"t":"七　経済産業大臣が必要があると認めて外国登録検査機関に対しその業務に関し報告を求めた場合において、その報告がされず、又は虚偽の報告がされたとき。"},{"d":1,"t":"八　経済産業大臣が必要があると認めてその職員に外国登録検査機関の事務所又は事業所において第八十三条第五項に規定する事項についての検査をさせ、又は関係者に質問をさせようとした場合において、その検査が拒まれ、妨げられ、若しくは忌避され、又はその質問に対して答弁がされず、若しくは虚偽の答弁がされたとき。"},{"d":1,"t":"九　次項の規定による費用の負担をしないとき。"},{"d":0,"t":"２　前項第八号の検査に要する費用（政令で定めるものに限る。）は、当該検査を受ける外国登録検査機関の負担とする。","p":1},{"d":0,"t":"３　経済産業大臣は、必要があると認めるときは、機構に、第一項第八号の規定による検査又は質問を行わせることができる。","p":1},{"d":0,"t":"４　経済産業大臣は、前項の規定により機構に検査又は質問を行わせる場合には、機構に対し、当該検査の場所その他必要な事項を示してこれを実施すべきことを指示するものとする。","p":1},{"d":0,"t":"５　機構は、前項の指示に従つて第三項に規定する検査又は質問を行つたときは、その結果を経済産業大臣に報告しなければならない。","p":1}],"del":false},{"id":"法-65","law":"法","num":"65","title":"第六十五条","cap":"（災害防止命令）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第六節　災害防止命令等","lines":[{"d":0,"t":"経済産業大臣は、次の各号に掲げる事由により一般消費者等の生命又は身体について液化石油ガスによる災害が発生するおそれがあると認める場合において、当該災害の拡大を防止するため特に必要があると認めるときは、当該各号に規定する者に対し、その販売し、又は製造した当該液化石油ガス器具等の回収を図ることその他当該液化石油ガス器具等による一般消費者等の生命又は身体についての災害の拡大を防止するため必要な措置をとるべきことを命ずることができる。","p":1},{"d":1,"t":"一　液化石油ガス器具等の製造、輸入又は販売の事業を行う者が第三十九条第一項の規定に違反して液化石油ガス器具等を販売したこと。"},{"d":1,"t":"二　届出事業者がその届出に係る型式の液化石油ガス器具等で第四十六条第一項の経済産業省令で定める技術上の基準に適合しないものを製造し、輸入し、又は販売したこと（第四十六条第一項ただし書の規定の適用を受けて製造し、又は輸入した場合を除く。）。"}],"del":false},{"id":"法-66","law":"法","num":"66","title":"第六十六条","cap":"（取引デジタルプラットフォーム提供者の責務）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第六節　災害防止命令等","lines":[{"d":0,"t":"取引デジタルプラットフォーム提供者は、液化石油ガス器具等（その提供する取引デジタルプラットフォームを利用して行われる通信販売に係るものに限る。）の製造、輸入又は販売の事業を行う者が前条の規定による命令を受けてとる措置に協力するよう努めなければならない。","p":1}],"del":false},{"id":"法-67","law":"法","num":"67","title":"第六十七条","cap":"（災害防止要請）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第六節　災害防止命令等","lines":[{"d":0,"t":"経済産業大臣は、第六十五条各号に掲げる事由により取引デジタルプラットフォームを利用する一般消費者等の生命又は身体について液化石油ガスによる災害が発生するおそれがあると認める場合において、当該各号に規定する者が特定できないこと、その所在が明らかでないことその他の事由により当該各号に規定する者によつて当該災害の拡大を防止するために必要な措置がとられることを期待することができず、かつ、当該災害の拡大を防止するため特に必要があると認めるときは、当該取引デジタルプラットフォームを提供する取引デジタルプラットフォーム提供者に対し、当該各号に規定する者による当該液化石油ガス器具等の販売に係る当該取引デジタルプラットフォームの利用の停止その他の必要な措置をとるべきことを要請することができる。","p":1},{"d":0,"t":"２　経済産業大臣は、前項の規定による要請をしたときは、その旨を公表することができる。","p":1},{"d":0,"t":"３　取引デジタルプラットフォーム提供者は、第一項の規定による要請を受けて当該要請に係る措置をとつた場合において、当該措置により製造、輸入又は販売の事業を行う者に生じた損害については、賠償の責任を負わない。","p":1}],"del":false},{"id":"法-68","law":"法","num":"68","title":"第六十八条","cap":"（法令等違反行為を行つた者の氏名等の公表）","capInh":false,"path":"第五章　液化石油ガス器具等 / 第六節　災害防止命令等","lines":[{"d":0,"t":"経済産業大臣は、液化石油ガス器具等による一般消費者等の生命又は身体についての災害の拡大を防止するため必要があると認めるときは、経済産業省令で定めるところにより、この章の規定若しくは当該規定に基づく命令若しくは処分又は第八十二条第一項、第八十三条第一項若しくは第八十三条の二第一項の規定に基づく命令若しくは処分に違反する行為（以下この条において「法令等違反行為」という。）を行つた者の氏名又は名称その他法令等違反行為による災害の拡大を防止するために必要な事項を公表することができる。","p":1}],"del":false},{"id":"法-69:80","law":"法","num":"69:80","title":"第六十九条から第八十条まで","cap":"（法令等違反行為を行つた者の氏名等の公表）","capInh":true,"path":"第五章　液化石油ガス器具等 / 第六節　災害防止命令等","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"法-81","law":"法","num":"81","title":"第八十一条","cap":"（帳簿の記載）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"液化石油ガス販売事業者、保安機関及び充てん事業者は、経済産業省令で定めるところにより、帳簿を備え、その業務に関し経済産業省令で定める事項を記載し、これを保存しなければならない。","p":1},{"d":0,"t":"２　指定試験機関は、経済産業省令で定めるところにより、帳簿を備え、試験事務に関し経済産業省令で定める事項を記載し、これを保存しなければならない。","p":1},{"d":0,"t":"３　国内登録検査機関は、経済産業省令で定めるところにより、帳簿を備え、適合性検査に関し経済産業省令で定める事項を記載し、これを保存しなければならない。","p":1},{"d":0,"t":"４　前項の規定は、外国登録検査機関に準用する。","p":1}],"del":false},{"id":"法-82","law":"法","num":"82","title":"第八十二条","cap":"（報告の徴収）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣等は、この法律の施行に必要な限度において、政令で定めるところにより、液化石油ガス販売事業者、保安機関、液化石油ガス設備士、特定液化石油ガス設備工事事業者又は液化石油ガス器具等の製造、輸入若しくは販売の事業を行う者（特定輸入事業者である届出事業者にあつては、その国内管理人を含む。以下「液化石油ガス器具等製造事業者等」という。）に対し、その業務又は経理の状況（特定輸入事業者である届出事業者の国内管理人に対しては、その業務の状況及び当該届出事業者の業務の状況）に関し報告をさせることができる。","p":1},{"d":0,"t":"２　都道府県知事又は指定都市の長は、この法律の施行に必要な限度において、政令で定めるところにより、充てん事業者に対し、その業務又は経理の状況に関し報告をさせることができる。","p":1},{"d":0,"t":"３　経済産業大臣は、この法律の施行に必要な限度において、指定試験機関に対し、その業務又は経理の状況に関し報告をさせることができる。","p":1},{"d":0,"t":"４　経済産業大臣は、この法律の施行に必要な限度において、国内登録検査機関に対し、その業務又は経理の状況に関し報告をさせることができる。","p":1},{"d":0,"t":"５　委任都道府県知事は、その行わせることとした試験事務の適正な実施を確保するため必要があると認めるときは、指定試験機関に対し、当該試験事務の状況に関し報告をさせることができる。","p":1}],"del":false},{"id":"法-83","law":"法","num":"83","title":"第八十三条","cap":"（立入検査等）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣は、この法律の施行に必要な限度において、その職員に、液化石油ガス販売事業者又は液化石油ガス器具等製造事業者等の事務所、営業所、工場、液化石油ガス又は液化石油ガス器具等の保管場所その他その業務を行う場所に立ち入り、帳簿、書類その他の物件を検査させ、関係者に質問させ、又は試験のため必要な最少限度の分量に限り液化石油ガスを収去させることができる。","p":1},{"d":0,"t":"２　経済産業大臣は、この法律の施行に必要な限度において、その職員に、その認定を受けた保安機関の事務所又は事業所に立ち入り、業務の状況若しくは帳簿、書類その他の物件を検査させ、又は関係者に質問させることができる。","p":1},{"d":0,"t":"３　都道府県知事又は指定都市の長は、この法律の施行に必要な限度において、その職員に、その登録を受けた液化石油ガス販売事業者、その許可を受けた充てん事業者又は特定液化石油ガス設備工事事業者の事務所、営業所、液化石油ガス、充てん設備若しくは液化石油ガス設備工事に使用する機械、器具若しくは材料の保管場所、特定液化石油ガス設備工事の施工場所その他その業務を行う場所に立ち入り、帳簿、書類その他の物件を検査させ、関係者に質問させ、又は試験のため必要な最少限度の分量に限り液化石油ガスを収去させることができる。ただし、特定液化石油ガス設備工事の施工場所には、当該施工場所の管理者の承諾を得た場合でなければ、立ち入らせてはならない。","p":1},{"d":0,"t":"４　都道府県知事又は指定都市の長は、この法律の施行に必要な限度において、その職員に、その認定を受けた保安機関の事務所又は事業所に立ち入り、業務の状況若しくは帳簿、書類その他の物件を検査させ、又は関係者に質問させることができる。","p":1},{"d":0,"t":"５　経済産業大臣は、この法律の施行に必要な限度において、その職員に、国内登録検査機関の事務所又は事業所に立ち入り、業務の状況若しくは帳簿、書類その他の物件を検査させ、又は関係者に質問させることができる。","p":1},{"d":0,"t":"６　経済産業大臣は、この法律の施行に必要な限度において、その職員に、指定試験機関の事務所に立ち入り、業務の状況若しくは帳簿、書類その他の物件を検査させ、又は関係者に質問させることができる。","p":1},{"d":0,"t":"７　委任都道府県知事は、その行わせることとした試験事務の適正な実施を確保するため必要があると認めるときは、その職員に、当該試験事務を取り扱う指定試験機関の事務所に立ち入り、当該試験事務の状況若しくは帳簿、書類その他の物件を検査させ、又は関係者に質問させることができる。","p":1},{"d":0,"t":"８　前各項の規定により職員が立ち入るときは、その身分を示す証明書を携帯し、関係者に提示しなければならない。","p":1},{"d":0,"t":"９　経済産業大臣は、必要があると認めるときは、機構に、第一項の規定による立入検査又は質問（液化石油ガス器具等製造事業者等に係るものに限る。）又は第五項の規定による立入検査又は質問を行わせることができる。","p":1},{"d":0,"t":"１０　経済産業大臣は、前項の規定により機構に立入検査又は質問を行わせる場合には、機構に対し、当該立入検査の場所その他必要な事項を示してこれを実施すべきことを指示するものとする。","p":1},{"d":0,"t":"１１　機構は、前項の指示に従つて第九項に規定する立入検査又は質問を行つたときは、その結果を経済産業大臣に報告しなければならない。","p":1},{"d":0,"t":"１２　第九項の規定により機構の職員が立ち入るときは、その身分を示す証明書を携帯し、関係者に提示しなければならない。","p":1},{"d":0,"t":"１３　第一項から第七項までの規定による権限は、犯罪捜査のために認められたものと解釈してはならない。","p":1}],"del":false},{"id":"法-83_2","law":"法","num":"83_2","title":"第八十三条の二","cap":"（液化石油ガス器具等の提出）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣は、前条第一項の規定によりその職員に、又は同条第九項の規定により機構に液化石油ガス器具等製造事業者等の事務所、営業所、工場、液化石油ガス器具等の保管場所その他その業務を行う場所に立ち入り、検査をさせ、又は検査を行わせた場合において、その所在の場所において検査をさせ、又は検査を行わせることが著しく困難であると認められる液化石油ガス器具等があつたときは、その所有者又は占有者に対し、期限を定めて、これを提出すべきことを命ずることができる。","p":1},{"d":0,"t":"２　国（前項の規定に基づく経済産業大臣の権限に属する事務を第九十四条の二の規定に基づく政令の規定により都道府県知事又は市長が行うこととされている場合にあつては、都道府県又は市）は、同項の規定による命令によつて生じた損失を所有者又は占有者に対し補償しなければならない。","p":1},{"d":0,"t":"３　前項の規定により補償すべき損失は、第一項の命令により通常生ずべき損失とする。","p":1}],"del":false},{"id":"法-83_3","law":"法","num":"83_3","title":"第八十三条の三","cap":"（機構に対する命令）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣は、第六十四条第三項に規定する検査若しくは質問又は第八十三条第九項に規定する立入検査若しくは質問の業務の適正な実施を確保するため必要があると認めるときは、機構に対し、当該業務に関し必要な命令をすることができる。","p":1}],"del":false},{"id":"法-84","law":"法","num":"84","title":"第八十四条","cap":"（許可等の条件）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"許可、指定、認定又は承認には、条件を付することができる。","p":1},{"d":0,"t":"２　前項の条件は、許可、指定、認定又は承認に係る事項の確実な実施を図るため必要な最少限度のものに限り、かつ、許可、指定、認定又は承認を受ける者に不当な義務を課することとなるものであつてはならない。","p":1}],"del":false},{"id":"法-85","law":"法","num":"85","title":"第八十五条","cap":"（許可等の条件）","capInh":true,"path":"第六章　雑則","lines":[{"d":0,"t":"削除","p":1}],"del":true},{"id":"法-86","law":"法","num":"86","title":"第八十六条","cap":"（手数料）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"次に掲げる者（経済産業大臣、産業保安監督部長又は機構に対して手続を行おうとする者に限る。）は、実費を勘案して政令で定める額の手数料を納付しなければならない。","p":1},{"d":1,"t":"一　第三条第一項の登録を受けようとする者"},{"d":1,"t":"二　液化石油ガス販売事業者登録簿の謄本の交付を請求しようとする者"},{"d":1,"t":"三　液化石油ガス販売事業者登録簿の閲覧を請求しようとする者"},{"d":1,"t":"四　第二十九条第一項の認定及びその更新を受けようとする者"},{"d":1,"t":"五　第三十三条第一項の認可を受けようとする者"},{"d":1,"t":"六　第三十五条の六第一項の認定を受けようとする者"},{"d":1,"t":"六の二　第三十七条の五第四項の指定を受けようとする者"},{"d":1,"t":"七から十まで　削除"},{"d":1,"t":"十一　第六十二条第一項の規定により経済産業大臣の行う適合性検査又は同条第二項の規定により機構の行う適合性検査を受けようとする者"},{"d":0,"t":"２　前項の手数料は、経済産業大臣が行う第六十二条第一項の適合性検査、経済産業大臣若しくは産業保安監督部長が行う第三条第一項の登録、第二十九条第一項の認定及びその更新、第三十三条第一項の認可、第三十五条の六第一項の認定、第三十七条の五第四項の指定を受け又は経済産業大臣若しくは産業保安監督部長に対し液化石油ガス販売事業者登録簿の謄本の交付若しくは液化石油ガス販売事業者登録簿の閲覧を請求しようとする者の納付するものについては国庫の、機構が行う第六十二条第二項の適合性検査を受けようとする者の納付するものについては機構の収入とする。","p":1}],"del":false},{"id":"法-86_2","law":"法","num":"86_2","title":"第八十六条の二","cap":"（手数料）","capInh":true,"path":"第六章　雑則","lines":[{"d":0,"t":"都道府県は、地方自治法第二百二十七条の規定に基づき液化石油ガス設備士試験に係る手数料を徴収する場合においては、第三十八条の六第一項の規定により協会又は指定試験機関が行う液化石油ガス設備士試験を受けようとする者に、条例で定めるところにより、当該手数料を協会又は当該指定試験機関へ納めさせ、その収入とすることができる。","p":1}],"del":false},{"id":"法-87","law":"法","num":"87","title":"第八十七条","cap":"（関係行政機関への通報等）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣等は、第三条第一項の登録をし、第三十六条第一項、第三十七条の二第一項（第三十七条の四第三項において準用する場合を含む。）若しくは第三十七条の四第一項の許可をし、第六条、第八条、第二十三条、第三十七条の二第二項（第三十七条の四第三項において準用する場合を含む。）若しくは第三十八条の三の規定による届出若しくは第十条第三項の規定による届出（同条第二項に規定する場合に係るものに限る。）を受理し、第二十五条若しくは第二十六条の規定により登録の取消しをし、又は第三十七条の七第一項の規定により許可の取消しをしたときは、政令で定めるところにより、その旨を都道府県知事、指定都市の長、国家公安委員会若しくは都道府県公安委員会又は消防庁長官若しくは消防長に通報しなければならない。","p":1},{"d":0,"t":"２　消防庁長官又は消防長は、液化石油ガス販売事業者の液化石油ガスの貯蔵 ３　指定都市の長は、次の場合には、その旨を公示しなければならない。","p":1},{"d":1,"t":"一　第三十五条の六第一項の認定をしたとき。"},{"d":1,"t":"二　第三十五条の六第一項の認定を取り消したとき。"}],"del":false},{"id":"法-89","law":"法","num":"89","title":"第八十九条","cap":"（協会の意見の聴取）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣は、第十六条第一項若しくは第二項、第十六条の二第一項、第三十五条の五又は第三十七条の基準を定める経済産業省令の制定又は改廃をしようとするときは、協会の意見を聴かなければならない。","p":1}],"del":false},{"id":"法-90","law":"法","num":"90","title":"第九十条","cap":"（聴聞の特例）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"経済産業大臣等は、第二十六条の規定による命令又は第五十条の規定による禁止をしようとするときは、行政手続法（平成五年法律第八十八号）第十三条第一項の規定による意見陳述のための手続の区分にかかわらず、聴聞を行わなければならない。","p":1},{"d":0,"t":"２　第二十二条、第二十五条、第二十六条、第三十五条の三、第三十八条の四第四項、第三十八条の二十二（第三十八条の二十三第四項において準用する場合を含む。）、第三十八条の二十六第一項若しくは第二項、第五十条、第六十一条又は第六十四条の規定による処分に係る聴聞の期日における審理は、公開により行わなければならない。","p":1},{"d":0,"t":"３　前項の聴聞の主宰者は、行政手続法第十七条第一項の規定により当該処分に係る利害関係人が当該聴聞に関する手続に参加することを求めたときは、これを許可しなければならない。","p":1}],"del":false},{"id":"法-91","law":"法","num":"91","title":"第九十一条","cap":"（機構、協会又は指定試験機関の処分等についての審査請求）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"機構が行う適合性検査又は協会若しくは指定試験機関が行う試験事務に係る処分又はその不作為について不服がある者は、経済産業大臣に対して審査請求をすることができる。この場合において、経済産業大臣は、行政不服審査法（平成二十六年法律第六十八号）第二十五条第二項及び第三項、第四十六条第一項及び第二項並びに第四十九条第三項の規定の適用については、機構、協会又は指定試験機関の上級行政庁とみなす。","p":1}],"del":false},{"id":"法-92","law":"法","num":"92","title":"第九十二条","cap":"（審査請求の手続における意見の聴取）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"この法律又はこの法律に基づく命令の規定による処分又はその不作為についての審査請求に対する裁決は、行政不服審査法第二十四条の規定により当該審査請求を却下する場合を除き、審査請求人に対し、相当な期間をおいて予告をした上、同法第十一条第二項に規定する審理員が公開による意見の聴取をした後にしなければならない。","p":1},{"d":0,"t":"２　前項の意見の聴取に際しては、審査請求人及び利害関係人に対し、その事案について証拠を提示し、意見を述べる機会を与えなければならない。","p":1},{"d":0,"t":"３　第一項に規定する審査請求については、行政不服審査法第三十一条の規定は適用せず、同項の意見の聴取については、同条第二項から第五項までの規定を準用する。","p":1}],"del":false},{"id":"法-92_2","law":"法","num":"92_2","title":"第九十二条の二","cap":"（適合性検査についての申請及び経済産業大臣の命令）","capInh":false,"path":"第六章　雑則","lines":[{"d":0,"t":"届出事業者は、その製造し、又は輸入する特定液化石油ガス器具等について、国内登録検査機関が適合性検査を行わない場合又は国内登録検査機関の適合性検査の結果に異議のある場合は、経済産業大臣に対し、国内登録検査機関が適合性検査を行うこと
