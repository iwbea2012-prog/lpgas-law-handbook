<script>
const DATA = /*__DATA__*/null;

// ---------- 業務用語 → 条文用語 の関連語辞書 ----------
const SYN = {
  "無償貸与":["貸与","利益を供与","正常な商慣習"],
  "貸与":["貸与","消費設備の貸与等"],
  "利益供与":["利益を供与","正常な商慣習"],
  "過大な営業":["利益を供与","正常な商慣習","変更することを制限"],
  "協力金":["利益を供与","正常な商慣習"],
  "キャッシュバック":["利益を供与","正常な商慣習"],
  "三部料金":["量にかかわらず生ずる費用","量に応じて生ずる費用","消費設備の貸与等に係る費用","算定根拠"],
  "設備料金":["消費設備の貸与等に係る費用","設置等に係る費用"],
  "外出し":["消費設備の貸与等に係る費用","算定根拠"],
  "基本料金":["量にかかわらず生ずる費用"],
  "従量料金":["量に応じて生ずる費用"],
  "料金表":["料金表","料金その他"],
  "料金":["料金","費用","算定根拠","料金表"],
  "エアコン":["設置等に係る費用以外の費用"],
  "オーナー":["所有者","賃貸借"],
  "大家":["所有者","賃貸借"],
  "賃貸":["賃貸借","所有者"],
  "アパート":["賃貸借","所有者","集合住宅"],
  "切替":["変更することを制限","解除","撤去"],
  "切り替え":["変更することを制限","解除","撤去"],
  "乗り換え":["変更することを制限","解除","撤去"],
  "解約":["解除","撤去","所有権を移転"],
  "契約書":["書面","書面の交付"],
  "重要事項":["書面の交付","書面"],
  "書面":["書面"],
  "電子交付":["情報通信の技術","電磁的方法"],
  "点検":["点検","調査"],
  "定期点検":["点検","調査"],
  "保安点検":["点検","調査","保安業務"],
  "調査":["調査","点検"],
  "保安":["保安業務","保安機関","保安教育"],
  "委託":["委託","保安機関"],
  "主任者":["業務主任者"],
  "設備士":["液化石油ガス設備士"],
  "工事":["液化石油ガス設備工事","工事"],
  "ボンベ":["容器","充てん容器"],
  "容器":["容器","充てん容器"],
  "バルク":["バルク貯槽","バルク容器","バルク供給"],
  "メーター":["ガスメーター","計量"],
  "警報器":["ガス漏れ警報器","警報器"],
  "ガス漏れ":["ガス漏れ","漏えい"],
  "co":["一酸化炭素"],
  "一酸化炭素":["一酸化炭素"],
  "事故":["事故","災害"],
  "緊急":["緊急時","災害","措置を講ずる"],
  "罰則":["罰金","拘禁刑","懲役","科料","過料"],
  "罰金":["罰金"],
  "登録":["登録"],
  "開業":["登録","届出"],
  "廃業":["廃止の届出","廃止"],
  "帳簿":["帳簿","記録"],
  "記録":["帳簿","記録","保存"],
  "周知":["周知"],
  "撤去":["撤去"],
  "違約金":["違約金","解除","変更することを制限"],
  "自動更新":["更新","解除"],
  "フリーメンテ":["利益を供与","正常な商慣習"],
  "キックバック":["利益を供与","正常な商慣習"],
  "配管":["配管"],
  "質量":["質量","法定計量単位"],
  "立入":["立入検査","報告の徴収"],
  "命令":["基準適合命令","命ずることができる","改善命令"],
  "教育":["保安教育"],
  "表示":["表示","標識"],
  "標識":["標識"],
  "器具":["液化石油ガス器具等","器具"],
  "psマーク":["特定液化石油ガス器具等","表示"],
  "賠償":["損害の賠償","賠償"],
  "保険":["損害の賠償","賠償"]
};

const LAWNAME = {"法":"法","令":"施行令","規則":"施行規則"};
const KN = "〇一二三四五六七八九";
function kanji(n){ // 1..9999 → 漢数字（条文表記）
  n=+n; if(!n) return "";
  let s="", u=[[1000,"千"],[100,"百"],[10,"十"]];
  for(const [v,c] of u){ const d=Math.floor(n/v); if(d){ s+=(d>1?KN[d]:"")+c; n%=v; } }
  return s+(n?KN[n]:"");
}
const norm = s => s.normalize("NFKC").toLowerCase().replace(/\s+/g,"");
// クエリ中の算用数字を条文の漢数字に（16条→十六条、第3項→第三項）
const toKanjiNums = s => s.replace(/\d+/g, m => kanji(m));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- インデックス ----------
const ARTS=[], BYID={};
for(const law of DATA.laws){
  law.arts.forEach((a,i)=>{
    a.lawId=law.id; a.idx=i; a.lawObj=law;
    a.body=a.lines.map(l=>l.t).join("\n");
    a.n=norm(a.title+" "+a.cap+" "+a.path+" "+a.body);
    a.nh=norm(a.title+" "+a.cap+" "+a.path);
    ARTS.push(a); BYID[a.id]=a;
  });
}
const WIKI = DATA.wiki.map(w=>({...w, n:norm(w.title+" "+w.md), plain:w.md.replace(/[#*|`>-]+/g," ").replace(/\[\[([^\]]+)\]\]/g,"$1").replace(/\s+/g," ")}));
const CASES = (DATA.cases||[]).map(c=>({...c, n:norm(c.id+" "+c.title+" "+c.theme+" "+c.basis+" "+c.scene+" "+c.expl+" "+c.tips), plain:(c.scene+" "+c.expl).replace(/[#*|`>-]+/g," ").replace(/\s+/g," ")}));
const CBYID = Object.fromEntries(CASES.map(c=>[c.id,c]));
const VD = {"○":["o","問題なし"],"△":["t","条件次第"],"×":["x","問題あり"]};
const vdBadge = v => `<span class="vd vd-${(VD[v]||["t"])[0]}">${esc(v||"?")}</span>`;
const WBYTITLE = Object.fromEntries(WIKI.map(w=>[w.title,w]));
document.getElementById("built").textContent = "条文 "+DATA.built+" 時点";

function artLabel(a){
  return (a.law==="法"?"":LAWNAME[a.law]+" ")+a.title;
}
function numToId(law, n1, n2, n3){
  return law+"-"+n1+(n2?"_"+n2:"")+(n3?"_"+n3:"");
}

// 条番号の直接指定：「16条の2」「規則16条」「法第27条」
function parseArticleRef(q){
  const m = q.normalize("NFKC").replace(/\s+/g,"").match(/^(法|施行令|令|施行規則|規則)?第?(\d+)条(?:の(\d+))?(?:の(\d+))?/);
  if(!m) return null;
  const law = m[1] ? ({"法":"法","施行令":"令","令":"令","施行規則":"規則","規則":"規則"})[m[1]] : null;
  const laws = law ? [law] : ["法","規則","令"];
  return laws.map(l=>BYID[numToId(l,m[2],m[3],m[4])]).filter(Boolean);
}

function expandTerms(q, useSyn){
  const terms = q.normalize("NFKC").split(/[\s、,，]+/).filter(Boolean);
  return terms.map(t=>{
    const base = norm(t), kj = norm(toKanjiNums(t));
    const own = [...new Set([base,kj])];
    const syn = new Set();
    if(useSyn){
      let keys = Object.keys(SYN).filter(k=>{ const nk=norm(k); return base.includes(nk) || (base.length>=2 && nk.includes(base)); });
      // 「三部料金」に含まれる「料金」のように、より長い一致語に含まれる短い語は使わない
      keys = keys.filter(k=>!keys.some(o=>o!==k && norm(o).includes(norm(k)) && base.includes(norm(o))));
      keys.forEach(k=>SYN[k].forEach(s=>syn.add(norm(s))));
      own.forEach(o=>syn.delete(o));
    }
    return {raw:t, own, syn:[...syn]};
  });
}
function countAll(hay, needle){
  if(!needle) return 0; let c=0, i=0;
  while((i=hay.indexOf(needle,i))!==-1){ c++; i+=needle.length; }
  return c;
}
function scoreText(n, nh, groups, mode){
  let total=0, matched=0;
  for(const g of groups){
    let gs=0;
    for(const o of g.own){ const c=countAll(n,o); gs+=c*3; if(nh && nh.includes(o)) gs+=12; }
    for(const s of g.syn){ const c=countAll(n,s); gs+=c; if(nh && nh.includes(s)) gs+=5; }
    if(gs>0) matched++;
    total+=gs;
  }
  if(mode==="and" && matched<groups.length) return 0;
  return total + matched*20;
}

function enabledLaws(){
  const s=new Set();
  document.querySelectorAll(".filters input[data-law]").forEach(c=>{ if(c.checked) s.add(c.dataset.law); });
  return s;
}

// ある条を引用している条文（例：法第十六条 ← 規則第十六条「法第十六条第二項の…」）
function citers(t){
  const out=[];
  const re = new RegExp(t.title.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?!の[一二三四五六七八九十])","g");
  for(const a of ARTS){
    if(a===t || a.del) continue;
    let m, hit=false;
    while((m=re.exec(a.body))){
      const pre = a.body.slice(Math.max(0,m.index-3), m.index);
      const last = pre.slice(-1), before = pre.slice(-2,-1);
      const ideo = c => /[一-鿿]/.test(c);
      let ok;
      if(t.law===a.law) ok = !(last==="法"||last==="令"||pre.endsWith("規則")) || (t.law==="法"&&last==="法"&&!ideo(before));
      else if(t.law==="法") ok = last==="法" && !ideo(before);
      else if(t.law==="令") ok = last==="令" && !ideo(before);
      else ok = pre.endsWith("規則");
      if(ok){ hit=true; break; }
    }
    if(hit) out.push(a);
  }
  return out;
}

function search(q){
  const useSyn = document.getElementById("syn").checked;
  const laws = enabledLaws();
  const groups = expandTerms(q, useSyn);
  if(!groups.length) return null;
  const direct = (parseArticleRef(q)||[]).filter(a=>laws.has(a.law));
  // 条番号だけの検索 → その条と、その条を引用している条文
  if(direct.length && /^(法|施行令|令|施行規則|規則)?第?\d+条(の\d+){0,2}$/.test(q.normalize("NFKC").replace(/\s+/g,""))){
    const seen=new Set(direct.map(a=>a.id));
    const cites=[];
    direct.forEach(t=>citers(t).forEach(a=>{ if(!seen.has(a.id)&&laws.has(a.law)){ seen.add(a.id); cites.push({a, s:1, of:t}); } }));
    const g=[{raw:q, own:direct.map(t=>norm(t.title)), syn:[]}];
    return {groups:g, direct, mode:"ref", arts:cites, wiki:[], cases:CASES.filter(c=>direct.some(t=>c.refs.includes(t.id))).map(c=>({c}))};
  }
  let mode="and";
  const run = () => {
    const arts = ARTS.filter(a=>laws.has(a.law)&&!a.del).map(a=>({a, s:scoreText(a.n,a.nh,groups,mode)})).filter(x=>x.s>0)
      .sort((x,y)=>y.s-x.s || (x.a.law===y.a.law?x.a.idx-y.a.idx:"法令規則".indexOf(x.a.law)-"法令規則".indexOf(y.a.law)));
    const cases = laws.has("wiki") ? CASES.map(c=>({c, s:scoreText(c.n,norm(c.title),groups,mode)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s) : [];
    const wiki = laws.has("wiki") ? WIKI.map(w=>({w, s:scoreText(w.n,norm(w.title),groups,mode)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s) : [];
    return {arts, wiki, cases};
  };
  let r = run();
  if(!r.arts.length && !r.wiki.length && !r.cases.length && groups.length>1){ mode="or"; r=run(); }
  return {groups, direct, mode, ...r};
}

// ---------- ハイライト ----------
function hlNeedles(groups){
  const set=new Set();
  groups.forEach(g=>{ g.own.forEach(x=>set.add(x)); g.syn.forEach(x=>set.add(x)); });
  return [...set].filter(x=>x.length>0).sort((a,b)=>b.length-a.length);
}
function highlight(text, needles){
  if(!needles.length) return esc(text);
  // NFKC 比較のため、表示用テキストも正規化（法令本文はほぼ全角のまま変わらない）
  const t = text.normalize("NFKC");
  const lower = t.toLowerCase();
  const marks = new Array(t.length).fill(false);
  for(const n of needles){ let i=0; while((i=lower.indexOf(n,i))!==-1){ for(let k=i;k<i+n.length;k++) marks[k]=true; i+=n.length; } }
  let out="", on=false;
  for(let i=0;i<t.length;i++){
    if(marks[i]&&!on){ out+="<mark>"; on=true; }
    if(!marks[i]&&on){ out+="</mark>"; on=false; }
    out+=esc(t[i]);
  }
  return out+(on?"</mark>":"");
}
function snippet(text, needles, len=90){
  const t=text.normalize("NFKC").replace(/\n/g," "), lower=t.toLowerCase();
  let pos=-1;
  for(const n of needles){ const i=lower.indexOf(n); if(i!==-1 && (pos===-1||i<pos)) pos=i; }
  if(pos===-1) return esc(t.slice(0,len))+(t.length>len?"…":"");
  const st=Math.max(0,pos-30), s=t.slice(st, st+len);
  return (st>0?"…":"")+highlight(s,needles)+(st+len<t.length?"…":"");
}

// ---------- 条文中の参照をリンク化 ----------
function linkRefs(html, defaultLaw){
  // 「法第十六条」「規則第16条第15号の3」「第二十七条第一項」など（同一法令内）
  return html.replace(/(施行規則|規則|施行令|法)?第([0-9一二三四五六七八九十百千]+)条(?:の([0-9一二三四五六七八九十]+))?(?:の([0-9一二三四五六七八九十]+))?/g, (m, lw, a, b, c, off, str)=>{
    // 他の法律名の直後（例：高圧ガス保安法第…、計量法（…）第…）はリンクしない
    const before = str.slice(Math.max(0,off-6), off);
    if(!lw && /(保安法|計量法|自治法|建築基準法|消防法|法律)$/.test(before)) return m;
    if(!lw && /）$/.test(before)) return m;
    const law = lw ? ({"施行規則":"規則","規則":"規則","施行令":"令","法":"法"})[lw] : defaultLaw;
    const id = numToId(law, k2n(a), b&&k2n(b), c&&k2n(c));
    return BYID[id] ? `<a class="ref" href="#a/${encodeURIComponent(id)}">${m}</a>` : m;
  });
}
function k2n(s){
  if(/^\d+$/.test(s)) return +s;
  let n=0, cur=0;
  for(const ch of s){
    const d=KN.indexOf(ch);
    if(d>0) cur=d;
    else if(ch==="十"){ n+=(cur||1)*10; cur=0; }
    else if(ch==="百"){ n+=(cur||1)*100; cur=0; }
    else if(ch==="千"){ n+=(cur||1)*1000; cur=0; }
  }
  return n+cur;
}

// ---------- まとめ（Markdown） ----------
function inlineMd(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>WBYTITLE[t]?`<a href="#w/${WBYTITLE[t].id}">${t}</a>`:t);
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s（(])(https?:\/\/[^\s<）)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return linkRefs(s, "法");
}
function renderMd(md){
  const L = md.split("\n"); let out="", i=0;
  while(i<L.length){
    const l=L[i];
    if(/^#{1,3} /.test(l)){ const n=l.match(/^#+/)[0].length; out+=`<h${n}>${inlineMd(l.slice(n+1))}</h${n}>`; i++; continue; }
    if(/^\|/.test(l)){
      const rows=[]; while(i<L.length && /^\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      out+="<table><tr>"+cells(rows[0]).map(c=>`<th>${inlineMd(c)}</th>`).join("")+"</tr>";
      rows.slice(2).forEach(r=>{ out+="<tr>"+cells(r).map(c=>`<td>${inlineMd(c)}</td>`).join("")+"</tr>"; });
      out+="</table>"; continue;
    }
    if(/^\s*[-*] /.test(l)){
      let html="", depth=-1;
      while(i<L.length && /^\s*[-*] /.test(L[i])){
        const d=Math.floor(L[i].match(/^\s*/)[0].length/2);
        while(depth<d){ html+="<ul>"; depth++; }
        while(depth>d){ html+="</ul>"; depth--; }
        html+=`<li>${inlineMd(L[i].replace(/^\s*[-*] /,""))}</li>`; i++;
      }
      while(depth>=0){ html+="</ul>"; depth--; }
      out+=html; continue;
    }
    if(l.trim()===""){ i++; continue; }
    const para=[]; while(i<L.length && L[i].trim() && !/^(#{1,3} |\||\s*[-*] )/.test(L[i])){ para.push(L[i]); i++; }
    out+=`<p>${inlineMd(para.join(""))}</p>`;
  }
  return out;
}

  if(h.startsWith("q/")) return viewSearch(h.slice(2));
  if(h.startsWith("a/")) return viewArticle(h.slice(2).split("&")[0]);
  if(h.startsWith("toc")) return viewToc(h.split("/")[1]||"法");
  if(h.startsWith("w/")) return viewWiki(h.slice(2));
  if(h==="fav") return viewFav();
  if(h.startsWith("cases")) return viewCases(h.split("/")[1]||"");
  if(h.startsWith("c/")) return viewCase(h.slice(2));
  if(h.startsWith("quiz")) return viewQuiz(h.split("/")[1]||"", h.split("/")[2]||"");
  $q.value=""; lastGroups=[]; viewHome();
}
document.getElementById("sf").onsubmit = e => {
  e.preventDefault(); const q=$q.value.trim(); if(!q) return;
  $q.blur();
  const target = "#q/"+encodeURIComponent(q);
  if(location.hash===target) route(); else location.hash=target;
};
document.querySelectorAll(".filters input").forEach(c=>c.onchange=()=>{
  LS.set("lp-filters",[...document.querySelectorAll(".filters input")].map(x=>x.checked));
  if(location.hash.startsWith("#q/")) route();
});
LS.get("lp-filters",[]).forEach((v,i)=>{ const el=document.querySelectorAll(".filters input")[i]; if(el) el.checked=v; });
window.addEventListener("hashchange", route);
route();
</script>
</body>
